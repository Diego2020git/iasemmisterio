<script>
// 27/10/2026 · 12h · Radar IA #12 (63 s): GPT-6.1 Terra no Work e no Codex, Anthropic pede para abrir capital na Nasdaq (ANT), OpenAI Signals com o uso do ChatGPT no trabalho. Neon + neon-entrega.js.
// Fontes: help.openai.com (Model Release Notes, 26/10), anthropic.com/news/s1-sec (26/10), openai.com/signals (26/10).
const T0 = TEMPOS.cenas;
const SC = [T0[0], T0[1], T0[2], T0[3], T0[4], T0[5], T0[6], T0[7], T0[8], T0[9] + .7];
const DURATION = SC[9], IMPACTO = SC[8] + .4;
const COR = [AZ, CI, AZ, AMB, IN, AMB, CI, AZ, AZ];
const HITS = [wt('terra', 0), wt('bolsa', 0), wt('trabalho', 0), wt('radar', 1), wt('imagem', 2), wt('computador', 2), wt('clicando', 2), wt('pagos', 3), wt('nasdaq', 4), wt('codigo', 4), wt('preco', 5), wt('165', 6), wt('100', 6), wt('profissao', 7)];
const CLIQUES = [wt('clicando', 2) + .2, wt('digitando', 2) + .2];
const CK = [[0, 0, 0, 0, 0], [DURATION, 0, 0, 0, 0]];
// tela de computador com o cursor do agente clicando e digitando
function tela(x, y, w, h, t, tc, td) { ctx.fillStyle = '#f4f7ff'; rr(x, y, w, h, 18); ctx.fill();
  ctx.fillStyle = '#dfe6f7'; rr(x, y, w, 46, 18); ctx.fill(); ctx.fillRect(x, y + 26, w, 20);
  [0, 1, 2].forEach(i => { ctx.fillStyle = ['#ff6b6b', '#ffc24b', '#4be38a'][i]; ctx.beginPath(); ctx.arc(x + 28 + i * 28, y + 23, 8, 0, 7); ctx.fill(); });
  txt('Formulário', x + 40, y + 100, EXP, 30, '#1b2440');
  const bx = x + 40, by = y + 140, bw = w - 80; ctx.strokeStyle = '#9fb0d6'; ctx.lineWidth = 3; rr(bx, by, bw, 64, 10); ctx.stroke();
  const s = 'Pedido 2847 enviado', n = Math.floor(clamp((t - td) * 1.6) * s.length); txt(s.slice(0, n), bx + 20, by + 34, ARC, 30, '#1b2440', { weight: 600 });
  const on = t > tc; ctx.fillStyle = on ? '#2e6bff' : '#9fb0d6'; rr(x + w - 260, y + h - 100, 220, 64, 14); ctx.fill(); txt(on ? 'Enviado ✓' : 'Enviar', x + w - 150, y + h - 66, ARC, 30, '#fff', { align: 'center', weight: 700 });
  // cursor parado ao lado do botão, nunca sobre o texto
  const cxr = lerp(x + 80, x + w - 20, prog(t, tc - 1, tc - .2)), cyr = lerp(y + 120, y + h - 40, prog(t, tc - 1, tc - .2));
  ctx.save(); ctx.translate(cxr, cyr); ctx.fillStyle = CI; ctx.shadowColor = CI; ctx.shadowBlur = 20; ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(0, 44); ctx.lineTo(12, 33); ctx.lineTo(22, 54); ctx.lineTo(30, 50); ctx.lineTo(20, 30); ctx.lineTo(36, 30); ctx.closePath(); ctx.fill(); ctx.restore(); }
// gráfico de ações subindo com o código ANT
function bolsa(x, y, a, t) { if (a <= 0) return; ctx.save(); ctx.globalAlpha *= clamp(a); ctx.strokeStyle = IN; ctx.lineWidth = 8; ctx.shadowColor = IN; ctx.shadowBlur = 24; ctx.beginPath();
  const n = 9; for (let i = 0; i <= n * clamp(a); i++) { const px = x - 360 + i * 80, py = y + 120 - i * 22 - 40 * Math.sin(i * 1.7 + t); i ? ctx.lineTo(px, py) : ctx.moveTo(px, py); } ctx.stroke(); ctx.restore(); }
// mapa de pontos (países) acendendo
function mundo(x, y, a, t) { if (a <= 0) return; for (let i = 0; i < 100; i++) { const gx = i % 14, gy = Math.floor(i / 14); const on = clamp(a * 100 - i);
  ctx.save(); ctx.globalAlpha *= on * (.6 + .4 * Math.sin(t * 3 + i)); ctx.fillStyle = i % 3 ? CI : AZ; ctx.beginPath(); ctx.arc(x - 390 + gx * 60 + (gy % 2) * 30, y + gy * 52, 11, 0, 7); ctx.fill(); ctx.restore(); } }
const S = [
  // 0 · gancho
  (t, lt) => {
    linhaTxt('RADAR IA · 27/10', 330, -1, SC[1] - .2, t, 40, CI);
    versao('GPT-6.1 TERRA', cx0, 560, prog(t, -1, .1), CI, 0, 56);
    versao('ANTHROPIC NA BOLSA', cx0, 820, prog(t, wt('anthropic', 0) - .2, wt('anthropic', 0) + .2), IN, 0, 52);
    versao('CHATGPT NO TRABALHO', cx0, 1080, prog(t, wt('mundo', 0) - .2, wt('mundo', 0) + .2), VERDE, 0, 50);
  },
  // 1 · radar
  (t, lt) => {
    neon3d(P.radar, cx0, 700, 230 * back(prog(lt, .05, .4)), .4 * Math.sin(t * .9), .3, CI, prog(lt, .05, .25));
    titulo('RADAR IA', 1050, SC[1], SC[2] - .2, t, 110, BR, 'IA', CI);
  },
  // 2 · GPT-6.1 Terra usa o computador
  (t, lt) => {
    numero(1, 300, SC[2], SC[3] - .2, t);
    titulo('GPT-6.1 TERRA', 450, wt('terra', 2) - .2, SC[3] - .2, t, 84, BR, 'TERRA', CI);
    pilula('entende imagem', cx0 - 210, 590, 380, prog(t, wt('imagem', 2) - .2, wt('imagem', 2) + .2), CI, '', 1, 36);
    pilula('usa o computador', cx0 + 210, 590, 400, prog(t, wt('computador', 2) - .2, wt('computador', 2) + .2), VERDE, '', 1, 36);
    const a = prog(t, wt('computador', 2) - .2, wt('computador', 2) + .3);
    if (a > 0) { ctx.save(); ctx.globalAlpha *= a; tela(cx0 - 400, 690, 800, 480, t, wt('clicando', 2) + .3, wt('digitando', 2)); ctx.restore(); }
  },
  // 3 · quem tem
  (t, lt) => {
    titulo('ONDE ESTÁ', 380, SC[3], SC[4] - .2, t, 90, BR, 'ESTÁ', AMB);
    pilula('Work', cx0 - 200, 620, 340, prog(t, wt('work', 3) - .2, wt('work', 3) + .2), CI, '', 1, 48);
    pilula('Codex', cx0 + 200, 620, 340, prog(t, wt('codex', 3) - .2, wt('codex', 3) + .2), IN, '', 1, 48);
    pilula('só planos pagos', cx0, 820, 560, prog(t, wt('pagos', 3) - .2, wt('pagos', 3) + .2), AMB, 'PLUS, PRO E EMPRESAS', 1, 44);
    versao('CHAT COMUM', cx0, 1060, prog(t, wt('comum', 3) - .2, wt('comum', 3) + .2), BR, prog(t, wt('ainda', 3), wt('ainda', 3) + .3), 46);
  },
  // 4 · Anthropic na Nasdaq
  (t, lt) => {
    numero(2, 300, SC[4], SC[5] - .2, t);
    titulo('ANTHROPIC NA BOLSA', 450, wt('anthropic', 4) - .2, SC[5] - .2, t, 72, BR, 'BOLSA', IN);
    pilula('dona do Claude', cx0, 590, 460, prog(t, wt('claude', 4) - .2, wt('claude', 4) + .2), CI, '', 1, 38);
    bolsa(cx0, 760, prog(t, wt('acoes', 4) - .2, wt('nasdaq', 4) + .4), t);
    pilula('Nasdaq', cx0 - 200, 1050, 320, prog(t, wt('nasdaq', 4) - .2, wt('nasdaq', 4) + .2), IN, 'BOLSA AMERICANA', 1, 46);
    pilula('ANT', cx0 + 200, 1050, 300, prog(t, wt('codigo', 4) - .2, wt('codigo', 4) + .3), VERDE, 'CÓDIGO', 1, 56);
  },
  // 5 · ainda não definido
  (t, lt) => {
    titulo('AINDA SEM PREÇO', 380, SC[5], SC[6] - .2, t, 84, BR, 'PREÇO', AMB);
    pilula('quantidade de ações: a definir', cx0, 640, 820, prog(t, wt('quantidade', 5) - .2, wt('quantidade', 5) + .2), AMB, '', 1, 40);
    pilula('preço: a definir', cx0, 800, 600, prog(t, wt('preco', 5) - .2, wt('preco', 5) + .2), AMB, '', 1, 40);
    neon3d(P.cadeado, cx0, 1060 + flut(t), 100 * back(prog(t, wt('vendido', 5) - .2, wt('vendido', 5) + .2)), .3 * Math.sin(t), .1, IN, prog(t, wt('vendido', 5) - .2, wt('vendido', 5)));
    linhaTxt('venda só depois da liberação', 1240, wt('liberacao', 5) - .3, SC[6] - .2, t, 36, BR);
  },
  // 6 · OpenAI Signals
  (t, lt) => {
    numero(3, 300, SC[6], SC[7] - .2, t);
    titulo('CHATGPT NO TRABALHO', 450, wt('openai', 6) - .2, SC[7] - .2, t, 70, BR, 'TRABALHO', CI);
    pilula('165 tipos de tarefa', cx0, 590, 560, prog(t, wt('165', 6) - .2, wt('165', 6) + .2), CI, '', 1, 42);
    mundo(cx0, 720, prog(t, wt('100', 6) - .4, wt('100', 6) + 1.2), t);
    pilula('quase 100 países', cx0, 1130, 520, prog(t, wt('100', 6) - .2, wt('100', 6) + .2), VERDE, '2025 ATÉ SETEMBRO DE 2026', 1, 42);
  },
  // 7 · teste hoje
  (t, lt) => {
    titulo('TESTE HOJE', 330, SC[7], SC[8] - .2, t, 90, BR, 'HOJE', CI);
    janela(470, 420, prog(t, wt('profissao', 7) - .3, wt('profissao', 7) + .1), 'ChatGPT', (x, y, w) => {
      const s = 'Sou contador. Que tarefas você adianta?', n = Math.floor(clamp((t - wt('pergunte', 7)) * 1.4) * s.length);
      ctx.fillStyle = '#e9efff'; rr(x, y, w, 80, 40); ctx.fill(); txt(s.slice(0, n), x + 30, y + 42, ARC, 30, '#1b2440', { weight: 600 });
      ['✓ Planilhas e conferências', '✓ E-mails para clientes'].forEach((r, i) => { const q = prog(t, wt('adiantar', 7) + i * .5, wt('adiantar', 7) + i * .5 + .3); if (q <= 0) return;
        ctx.save(); ctx.globalAlpha *= q; ctx.fillStyle = '#fff'; rr(x, y + 110 + i * 78, w, 64, 14); ctx.fill(); txt(r, x + 24, y + 144 + i * 78, ARC, 30, '#1b2440', { weight: 600 }); ctx.restore(); }); });
    exemplo(cx0, 980, prog(t, wt('pergunte', 7), wt('pergunte', 7) + .3));
  },
  // 8 · fim
  (t, lt) => fim(t, lt, 'Siga o Radar IA', 'todo dia às 12h'),
];
</script></body></html>
