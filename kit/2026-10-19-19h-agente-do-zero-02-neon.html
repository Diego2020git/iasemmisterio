<html><head><meta charset="utf-8">
<style>
@font-face{font-family:"AX";src:url(fontes/ArchivoExpanded-ExtraBold.ttf);font-weight:800}
@font-face{font-family:"AR";src:url(fontes/Archivo-SemiBold.ttf);font-weight:600}

</style></head><body>
<img id="logo" src="marca/logo.png" style="display:none">
<canvas id="c" width="1080" height="1920"></canvas>
<script src="audio/2026-10-19-agente-do-zero-02.tempos.js"></script>
<script src="raiox-kit.js"></script>
<script src="neon-kit.js"></script>
<script src="neon-extra.js"></script>
<script>
// 19/10/2026 · 19h · Agente do zero #2: a chave grátis do Gemini (Google AI Studio). Neon.
const T0 = TEMPOS.cenas;
const SC = [T0[0], T0[1], T0[2], T0[3], T0[4], T0[5], T0[6], T0[7] + .7];
const DURATION = SC[7], IMPACTO = SC[6] + .4;
const COR = [AZ, CI, AZ, CI, IN, CI, AZ];
const HITS = [wt('chave', 0), wt('zero', 1), wt('google', 2), wt('create', 3), wt('seguro', 4), wt('pronto', 5)];
const CL = { get: wt('get', 3), create: wt('create', 3) };
const CLIQUES = [CL.get, CL.create];
const CK = [[0, 0, 0, 0, 0], [DURATION, 0, 0, 0, 0]];
const S = [
  // 0 · gancho: a chave liga o cérebro
  (t, lt) => {
    frase('A chave do cérebro', 300, -1, SC[1] - .2, 84, { t, hot: 'chave', cor: CI });
    neon3d(P.cadeado, cx0 - 190, cy0, 150 * back(prog(lt, .1, .5)), .4 * Math.sin(t * .9), .3, CI, prog(lt, .1, .3));
    neon3d(P.chip, cx0 + 190, cy0, 150 * back(prog(t, wt('cerebro', 0), wt('cerebro', 0) + .4)), -.4 * Math.sin(t * .9), .3, AZ, prog(t, wt('cerebro', 0), wt('cerebro', 0) + .2));
    frase('grátis, em 2 minutos', 1240, wt('gratis', 0) - .1, SC[1] - .2, 70, { t, hot: 'grátis', cor: CI });
  },
  // 1 · série
  (t, lt) => {
    neon3d(P.balao, cx0, cy0 - 110, 200 * back(prog(lt, .05, .5)), .4 * Math.sin(t * .9), .3, CI, prog(lt, .05, .3));
    frase('Agente do zero', cy0 + 200, wt('agente', 1) - .1, SC[2] - .2, 92, { t, hot: 'zero', cor: CI });
    selo('episódio 2', cx0, cy0 + 340, prog(t, wt('episodio', 1), wt('episodio', 1) + .3));
    linhaTxt('sem chave, o Make não fala com o Gemini', cy0 + 460, wt('sem', 1), SC[2] - .2, t, 42);
  },
  // 2 · passo 1: entrar no AI Studio
  (t, lt) => {
    numero(1, 300, SC[2], SC[3] - .2, t);
    frase('Google AI Studio', 470, wt('google', 2) - .1, SC[3] - .2, 78, { t, hot: 'AI Studio', cor: CI });
    janela(640, 420, prog(lt, .1, .4), 'aistudio.google.com', (x, y, w) => {
      campo(x, y, w - 140, 'Conta', '✓ sua conta Google', prog(t, wt('conta', 2) - .2, wt('conta', 2) + .1), prog(t, wt('conta', 2), wt('conta', 2) + .2));
    });
    exemplo(cx0, 1150, prog(lt, .4, .7));
  },
  // 3 · passo 2: Get API key -> Create API key
  (t, lt) => {
    numero(2, 300, SC[3], SC[4] - .2, t);
    frase('Get API key', 470, wt('get', 3) - .2, SC[4] - .2, 80, { t, hot: 'API key', cor: CI });
    janela(640, 560, prog(lt, .1, .4), 'Google AI Studio', (x, y, w) => {
      txt('MENU', x, y, ARC, 22, '#5a6a8f', { weight: 600, ls: 2 });
      botao(x, y + 30, 'Get API key', prog(t, wt('menu', 3), wt('menu', 3) + .3), prog(t, CL.get, CL.get + .3));
      botao(x, y + 170, 'Create API key', prog(t, CL.get + .4, CL.get + .7), prog(t, CL.create, CL.create + .3));
      const k = prog(t, CL.create + .3, CL.create + .7); if (k > 0) campo(x, y + 300, w - 140, 'Sua chave', 'AIza••••••••••••••', k);
    });
    linhaTxt('chave de conexão', 1280, wt('chave', 3), SC[4] - .2, t, 44, CI);
    exemplo(cx0, 1380, prog(lt, .4, .7));
  },
  // 4 · passo 3: guardar em lugar seguro
  (t, lt) => {
    numero(3, 300, SC[4], SC[5] - .2, t);
    frase('Guarde em lugar seguro', 470, wt('copie', 4) - .1, SC[5] - .2, 72, { t, hot: 'seguro', cor: CI });
    neon3d(P.cadeado, cx0, cy0 - 20, 200 * back(prog(t, wt('guarde', 4), wt('guarde', 4) + .5)), .3 * Math.sin(t), .3, CI, prog(t, wt('guarde', 4), wt('guarde', 4) + .3));
    linhaTxt('NUNCA poste a chave', 1170, wt('nunca', 4), SC[5] - .2, t, 54, '#ff4d6d');
    linhaTxt('nem em print, nem em grupo', 1300, wt('mande', 4), SC[5] - .2, t, 42);
  },
  // 5 · resultado + custo
  (t, lt) => {
    neon3d(P.check, cx0, cy0 - 120, 190 * back(prog(lt, .05, .5)), .3 * Math.sin(t * .8), .3, CI, prog(lt, .05, .3));
    frase('Chave criada', cy0 + 140, wt('chave', 5) - .1, SC[6] - .2, 80, { t, hot: 'criada', cor: CI });
    selo('grátis nos modelos Flash', cx0, cy0 + 290, prog(t, wt('gratis', 5), wt('gratis', 5) + .3));
    linhaTxt('com limite por dia · veja o seu no AI Studio', cy0 + 410, wt('limite', 5), SC[6] - .2, t, 36, 'rgba(244,248,255,.8)');
  },
  // 6 · logo + chamada
  (t, lt) => fim(t, lt, 'Segue a série', 'quarta: episódio 3'),
];
</script></body></html>
