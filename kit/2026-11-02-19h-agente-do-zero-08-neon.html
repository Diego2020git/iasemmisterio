<!doctype html>
<html><head><meta charset="utf-8">
<style>
@font-face{font-family:"AX";src:url(fontes/ArchivoExpanded-ExtraBold.ttf);font-weight:800}

<img id="logo" src="marca/logo.png" style="display:none">
<canvas id="c" width="1080" height="1920"></canvas>
<script src="audio/2026-11-02-agente-do-zero-08.tempos.js"></script>

<script src="neon-entrega.js"></script>
<script>
// 02/11/2026 · 19h · Agente do zero #8: o primeiro oi respondido (Watch Events → Gemini Create a Completion → WhatsApp Send a Message). Padrão de entrega de 24/10. Neon + neon-entrega.js.
// Mecanismo: mensagem chega → Make acorda → Gemini escreve → Make devolve pelo número de teste. Resposta livre só nas 24 h depois da mensagem do cliente. Fontes: apps.make.com/whatsapp-business-cloud-modules, make.com/how-to-guides/how-to-create-whatsapp-business-chatbot.
const T0 = TEMPOS.cenas;
const SC = [T0[0], T0[1], T0[2], T0[3], T0[4], T0[5], T0[6], T0[7] + .7];
const DURATION = SC[7], IMPACTO = SC[6] + .4;
const CLIQUES = [];
const CK = [[0, 0, 0, 0, 0], [DURATION, 0, 0, 0, 0]];
const COR = [AZ, CI, AZ, VERDE, CI, AMB, AZ];
const HITS = [wt('oi', 0), wt('oito', 1), wt('gemini', 2), wt('completion', 2), wt('pedido', 2), wt('send', 3), wt('receiver', 3), wt('text', 4), wt('ligue', 4), wt('oi', 5), wt('vinte', 5) , wt('nove', 6)];
// bolhas do WhatsApp dentro do celular
function conversa(x, y, w, s, t, tOi, tResp) {
  const b = (str, mine, yy, a) => { if (a <= 0) return; ctx.save(); ctx.globalAlpha *= clamp(a); const bw = Math.min(w * .9, measure(str, ARC, 30 * s, 600) + 50 * s);
    ctx.fillStyle = mine ? '#d9fdd3' : '#ffffff'; rr(mine ? x + w - bw : x, yy, bw, 70 * s, 18 * s); ctx.fill(); txt(str, (mine ? x + w - bw : x) + 24 * s, yy + 38 * s, ARC, 30 * s, '#1b2440', { weight: 600 }); ctx.restore(); };
  b('oi', 1, y + 20 * s, prog(t, tOi - .2, tOi + .2));
  b('Oi! Aqui é a Padaria Sol.', 0, y + 120 * s, prog(t, tResp - .2, tResp + .2)); b('Como posso ajudar?', 0, y + 200 * s, prog(t, tResp, tResp + .3)); }
// módulo do Make
function mod(x, y, a, cor, nome, sub, on) { if (a <= 0) return; ctx.save(); ctx.globalAlpha *= clamp(a); const e = back(clamp(a)); ctx.translate(x, y); ctx.scale(e, e);
  ctx.shadowColor = cor; ctx.shadowBlur = on ? 50 : 20; ctx.fillStyle = hex(cor, .85); ctx.beginPath(); ctx.arc(0, 0, 80, 0, 7); ctx.fill(); ctx.shadowBlur = 0;
  txt(nome, 0, 125, ARC, 30, BR, { align: 'center', weight: 700 }); txt(sub, 0, 165, ARC, 26, CI, { align: 'center', weight: 600 }); ctx.restore(); }
function cadeia(y, n, t, on) { const xs = [190, cx0, 890], d = [['WhatsApp', 'Watch Events', VERDE], ['Gemini', 'Create a Completion', AZ], ['WhatsApp', 'Send a Message', VERDE]];
  d.forEach(([a, b, c], i) => { mod(xs[i], y, clamp(n - i), c, a, b, on === i); if (i) fio(xs[i - 1] + 85, y, xs[i] - 85, y, clamp(n - i + .5), CI, t, true); }); }
const S = [
  // 0 · gancho: oi e resposta
  (t, lt) => {
    titulo('O AGENTE RESPONDE', 360, -1, SC[1] - .2, t, 80, BR, 'RESPONDE', VERDE);
    celular(cx0, 900, .8, .15 * Math.sin(t * .6), prog(lt, 0, .3), (x, y, w, s) => conversa(x, y, w, s, t, wt('oi', 0) - .3, wt('whatsapp', 0)), 'Padaria Sol', VERDE);
  },
  // 1 · episódio
  (t, lt) => {
    titulo('AGENTE DO ZERO', 520, SC[1], SC[2] - .2, t, 84, BR, 'ZERO', CI);
    versao('EPISÓDIO 8', cx0, 720, prog(t, wt('episodio', 1) - .1, wt('episodio', 1) + .3), CI, 0, 60);
    cadeia(1020, 3 * prog(lt, .2, 1.4), t, -1);
  },
  // 2 · passo 1: Gemini depois do Watch Events
  (t, lt) => {
    numero(1, 300, SC[2], SC[3] - .2, t);
    titulo('O GEMINI ESCREVE', 450, wt('depois', 2) - .1, SC[3] - .2, t, 80, BR, 'GEMINI', AZ);
    cadeia(680, 1 + prog(t, wt('gemini', 2) - .4, wt('gemini', 2) + .2), t, prog(t, wt('completion', 2), wt('completion', 2) + .3) > .5 ? 1 : -1);
    janela(950, 300, prog(t, wt('ligue', 2) - .3, wt('ligue', 2)), 'Create a Completion', (x, y, w) => {
      campo(x + 20, y + 30, w - 40, 'Pedido', 'Text → Body (a mensagem recebida)', prog(t, wt('texto', 2) - .2, wt('pedido', 2) + .2), prog(t, wt('pedido', 2), wt('pedido', 2) + .3)); });
  },
  // 3 · passo 2: Send a Message + Receiver
  (t, lt) => {
    numero(2, 300, SC[3], SC[4] - .2, t);
    titulo('DEVOLVA PELO WHATSAPP', 450, wt('adicione', 3) - .1, SC[4] - .2, t, 66, BR, 'WHATSAPP', VERDE);
    cadeia(680, 2 + prog(t, wt('send', 3) - .4, wt('send', 3) + .2), t, 2);
    janela(950, 300, prog(t, wt('receiver', 3) - .3, wt('receiver', 3)), 'Send a Message', (x, y, w) => {
      campo(x + 20, y + 30, w - 40, 'Receiver', 'número de quem mandou', prog(t, wt('receiver', 3) - .1, wt('mandou', 3) + .2), prog(t, wt('mandou', 3), wt('mandou', 3) + .3)); });
  },
  // 4 · passo 3: Message Type Text + resposta do Gemini
  (t, lt) => {
    numero(3, 300, SC[4], SC[5] - .2, t);
    titulo('TEXTO DA RESPOSTA', 450, wt('message', 4) - .1, SC[5] - .2, t, 72, BR, 'RESPOSTA', CI);
    janela(580, 470, prog(t, wt('message', 4) - .3, wt('message', 4)), 'Send a Message', (x, y, w) => {
      campo(x + 20, y + 30, w - 40, 'Message Type', 'Text', prog(t, wt('type', 4) - .2, wt('text', 4) + .2), prog(t, wt('text', 4), wt('text', 4) + .3));
      campo(x + 20, y + 200, w - 40, 'Body', 'resposta do Gemini', prog(t, wt('resposta', 4) - .2, wt('resposta', 4) + .2), prog(t, wt('gemini', 4), wt('gemini', 4) + .3)); });
    pilula('cenário ligado', cx0, 1200, 460, prog(t, wt('cenario', 4) - .2, wt('cenario', 4) + .2), VERDE, '', 1, 42);
  },
  // 5 · teste + regra das 24 horas
  (t, lt) => {
    titulo('MANDE UM OI', 360, SC[5], SC[6] - .2, t, 86, BR, 'OI', VERDE);
    celular(cx0 - 250, 820, .62, .1 * Math.sin(t * .7), prog(lt, 0, .3), (x, y, w, s) => conversa(x, y, w, s, t, wt('oi', 5), wt('cadastrado', 5) + .3), 'Padaria Sol', VERDE);
    neon3d(P.relogio, cx0 + 250, 700 + flut(t), 100 * back(prog(t, wt('vinte', 5) - .3, wt('vinte', 5) + .2)), t * .4, .1, AMB, prog(t, wt('vinte', 5) - .3, wt('vinte', 5)));
    pilula('resposta livre: até 24 h', cx0 + 200, 900, 500, prog(t, wt('livre', 5) - .2, wt('horas', 5) + .2), AMB, 'APÓS O CLIENTE ESCREVER', 1, 32);
    pilula('só números cadastrados', cx0 + 200, 1060, 500, prog(t, wt('cadastrado', 5) - .2, wt('cadastrado', 5) + .2), CI, 'NO NÚMERO DE TESTE', 1, 32);
  },
  // 6 · fim
  (t, lt) => fim(t, lt, 'Salva e segue', 'quarta: episódio 9'),
];
</script></body></html>
