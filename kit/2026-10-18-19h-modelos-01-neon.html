<!doctype html>
<html><head><meta charset="utf-8">
<style>
@font-face{font-family:"AX";src:url(fontes/ArchivoExpanded-ExtraBold.ttf);font-weight:800}
@font-face{font-family:"AR";src:url(fontes/Archivo-SemiBold.ttf);font-weight:600}
html,body{margin:0;background:#000}canvas{display:block}
</style></head><body>
<img id="logo" src="marca/logo.png" style="display:none">
<canvas id="c" width="1080" height="1920"></canvas>
<script src="audio/2026-10-18-modelos-e-parametros-01.tempos.js"></script>
<script src="raiox-kit.js"></script>
<script src="neon-kit.js"></script>
<script src="neon-extra.js"></script>
<script>
// 18/10/2026 · 19h · Modelos e parâmetros #1: mini, flash e pro. Neon. Preços oficiais Anthropic conferidos em 16/10/2026.
const T0 = TEMPOS.cenas;
const SC = [T0[0], T0[1], T0[2], T0[3], T0[4], T0[5], T0[6], T0[7] + .7];
const DURATION = SC[7], IMPACTO = SC[6] + .4;
const COR = [AZ, CI, CI, IN, AZ, CI, AZ];
const HITS = [wt('pro', 0), wt('modelos', 1), wt('pequenos', 2), wt('grandes', 3), wt('sonnet', 4), wt('opus', 5)];
const CLIQUES = [];
const CK = [[0, 0, 0, 0, 0], [DURATION, 0, 0, 0, 0]]; // sem cursor: nada é clicado neste episódio
// pílula com nome de modelo
function pilula(str, x, y, a, cor = CI, size = 48, on = 1) {
  if (a <= 0) return; const e = back(clamp(a)), w = measure(str, ARC, size, 600) + 70;
  ctx.save(); ctx.translate(x, y); ctx.scale(e, e); ctx.globalAlpha *= clamp(a * 2);
  ctx.shadowColor = cor; ctx.shadowBlur = 30 * on; ctx.fillStyle = 'rgba(10,30,60,.85)'; rr(-w / 2, -size * .9, w, size * 1.8, size * .9); ctx.fill();
  ctx.strokeStyle = cor; ctx.lineWidth = 3; rr(-w / 2, -size * .9, w, size * 1.8, size * .9); ctx.stroke(); ctx.shadowBlur = 0;
  txt(str, 0, 2, ARC, size, BR, { align: 'center', weight: 600 }); ctx.restore();
}
// barra de preço (largura proporcional)
function barra(rot, valor, y, frac, a, cor) {
  if (a <= 0) return; const x0 = 140, wmax = 800, w = Math.max(14, wmax * frac * ease(clamp(a)));
  txt(rot, x0, y - 50, ARC, 44, BR, { weight: 600, alpha: clamp(a * 2) });
  ctx.save(); ctx.globalAlpha *= clamp(a * 2); ctx.shadowColor = cor; ctx.shadowBlur = 30; ctx.fillStyle = cor; rr(x0, y, w, 64, 18); ctx.fill(); ctx.restore();
  const dentro = w > 260; txt(valor, x0 + w + (dentro ? -20 : 24), y + 34, ARC, 42, dentro ? '#03121a' : BR, { align: dentro ? 'right' : 'left', weight: 600, alpha: clamp(a * 2) });
}
const S = [
  // 0 · gancho: os três nomes
  (t, lt) => {
    pilula('mini', cx0 - 270, 520, prog(t, wt('mini', 0), wt('mini', 0) + .3), CI, 56);
    pilula('flash', cx0, 520, prog(t, wt('flash', 0), wt('flash', 0) + .3), AZ, 56);
    pilula('pro', cx0 + 260, 520, prog(t, wt('pro', 0), wt('pro', 0) + .3), IN, 56);
    neon3d(P.chip, cx0, cy0 + 60, 200 * back(prog(lt, .2, .7)), .35 * Math.sin(t * .9), .3, CI, prog(lt, .2, .5));
    frase('O que esses nomes dizem?', 1240, wt('o', 0) - .1, SC[1] - .2, 70, { t, hot: 'nomes', cor: CI });
  },
  // 1 · série + onde aparece
  (t, lt) => {
    frase('Modelos e parâmetros', 380, wt('modelos', 1) - .1, SC[2] - .2, 80, { t, hot: 'parâmetros', cor: CI });
    selo('episódio 1', cx0, 520, prog(t, wt('episodio', 1), wt('episodio', 1) + .3));
    janela(640, 520, prog(t, wt('nomes', 1) - .2, wt('nomes', 1) + .2), 'Escolher modelo', (x, y, w) => {
      const L = [['mini', 'rápido'], ['flash', 'rápido'], ['pro', 'pensa mais']];
      L.forEach(([n, d], k) => { const a = prog(t, wt('aparecem', 1) + k * .25, wt('aparecem', 1) + k * .25 + .3);
        campo(x, y + k * 130, w - 140, 'Modelo ' + n, d, a, k === 2 ? prog(t, wt('modelo', 1) + .2, wt('modelo', 1) + .5) : 0); });
    });
    exemplo(cx0, 1260, prog(lt, .6, .9));
  },
  // 2 · passo 1: os pequenos
  (t, lt) => {
    numero(1, 300, SC[2], SC[3] - .2, t);
    frase('Os pequenos', 470, wt('pequenos', 2) - .1, SC[3] - .2, 84, { t, hot: 'pequenos', cor: CI });
    neon3d(P.chip, cx0 - 200, cy0 + 20, 120 * back(prog(lt, .1, .5)), .4 * Math.sin(t * 1.4), .3, CI, prog(lt, .1, .3));
    neon3d(P.relogio, cx0 + 200, cy0 + 20, 130 * back(prog(t, wt('rapidos', 2), wt('rapidos', 2) + .4)), .3 * Math.sin(t), .3, AZ, prog(t, wt('rapidos', 2), wt('rapidos', 2) + .2));
    ['mini', 'flash', 'lite', 'haiku'].forEach((n, k) => pilula(n, 200 + k * 215, 1150, prog(t, wt(n, 2), wt(n, 2) + .3), CI, 40));
    selo('rápidos e baratos', cx0, 1320, prog(t, wt('rapidos', 2), wt('rapidos', 2) + .3));
  },
  // 3 · passo 2: os grandes
  (t, lt) => {
    numero(2, 300, SC[3], SC[4] - .2, t);
    frase('Os grandes', 470, wt('grandes', 3) - .1, SC[4] - .2, 84, { t, hot: 'grandes', cor: CI });
    neon3d(P.chip, cx0, cy0 + 10, 250 * back(prog(lt, .1, .6)), .3 * Math.sin(t * .7), .3, IN, prog(lt, .1, .3));
    pilula('pro', cx0 - 150, 1150, prog(t, wt('pro', 3), wt('pro', 3) + .3), IN, 48);
    pilula('opus', cx0 + 150, 1150, prog(t, wt('opus', 3), wt('opus', 3) + .3), IN, 48);
    linhaTxt('pensam mais · custam mais', 1310, wt('pensam', 3), SC[4] - .2, t, 46);
  },
  // 4 · passo 3: o meio e quando usar
  (t, lt) => {
    numero(3, 300, SC[4], SC[5] - .2, t);
    frase('No meio: equilíbrio', 470, wt('meio', 4) - .1, SC[5] - .2, 74, { t, hot: 'equilíbrio', cor: CI });
    const xs = [cx0 - 310, cx0 - 20, cx0 + 300], ss = [70, 105, 140], on = prog(t, wt('sonnet', 4), wt('sonnet', 4) + .3);
    xs.forEach((x, k) => neon3d(P.chip, x, cy0 + 20, ss[k] * back(prog(lt, .1 + k * .15, .5 + k * .15)), .3 * Math.sin(t + k), .3, k === 1 ? CI : AZ, k === 1 ? 1 : 1 - .6 * on));
    pilula('Sonnet', cx0, 1150, on, CI, 46);
    selo('resumo? use o pequeno', cx0, 1320, prog(t, wt('resumo', 4), wt('resumo', 4) + .3));
  },
  // 5 · preço oficial (Anthropic, entrada, por milhão de tokens)
  (t, lt) => {
    frase('Preço por milhão de tokens', 360, SC[5] - .05, SC[6] - .2, 62, { t, hot: 'tokens', cor: CI });
    barra('Claude Haiku 5.5', 'US$ 0,10', 640, .025, prog(t, wt('haiku', 5), wt('haiku', 5) + .6), CI);
    barra('Claude Opus 5.5', 'US$ 4', 880, 1, prog(t, wt('opus', 5), wt('opus', 5) + .8), IN);
    selo('token = pedaço de texto', cx0, 1110, prog(t, wt('pedacos', 5) - .1, wt('pedacos', 5) + .2));
    selo('40 vezes mais', cx0, 1250, prog(t, wt('4', 5) + .1, wt('4', 5) + .4), IN);
    linhaTxt('entrada, API da Anthropic · conferido em 16/10/2026', 1380, wt('haiku', 5), SC[6] - .2, t, 30, 'rgba(244,248,255,.75)');
  },
  // 6 · logo + chamada
  (t, lt) => fim(t, lt, 'Salva e segue', 'domingo: temperatura'),
];
</script></body></html>
