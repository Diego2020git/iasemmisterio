<html><head><meta charset="utf-8">

<img id="logo" src="marca/logo.png" style="display:none">
<canvas id="c" width="1080" height="1920"></canvas>

<script>
// 31/10/2026 · 19h · Automação do zero #5: e-mail de compra vira linha na planilha de gastos (Zapier, 2 passos). Padrão de entrega de 24/10. Neon + neon-entrega.js.
// Mecanismo: Zapier olha o Gmail a cada 15 min → e-mail bate com a busca subject:pedido → nova linha na planilha. Fontes: zapier.com/apps/gmail/integrations/google-sheets, zapier.com/pricing.
const T0 = TEMPOS.cenas;
const SC = [T0[0], T0[1], T0[2], T0[3], T0[4], T0[5], T0[6], T0[7] + .7];
const DURATION = SC[7], IMPACTO = SC[6] + .4;
const CLIQUES = [wt('publish', 4) + .1];
const CK = [[0, 0, 0, 0, 0], [DURATION, 0, 0, 0, 0]];
const COR = [AZ, CI, AZ, IN, CI, AMB, AZ];
const HITS = [wt('compra', 0), wt('linha', 0), wt('cinco', 1), wt('planilha', 2), wt('gatilho', 3), wt('pedido', 3), wt('sheets', 3 + 1), wt('colunas', 4), wt('publish', 4), wt('quinze', 5), wt('cem', 5)];
const MAILS = [['Loja Azul', 'Seu pedido #4821 foi aprovado', 1], ['Ana', 'Fotos do fim de semana', 0], ['Mercado Já', 'Pedido entregue: R$ 87,40', 1], ['Escola', 'Reunião de pais', 0]];
const LINHAS = [['24/10', 'Loja Azul', 'Seu pedido #4821…'], ['25/10', 'Mercado Já', 'Pedido entregue…']];
function caixa(x, y, w, t, filtro) { MAILS.forEach((m, i) => { const yy = y + i * 92, bate = m[2] && filtro > 0, fora = !m[2] && filtro > 0;
  ctx.save(); ctx.globalAlpha *= fora ? 1 - .6 * clamp(filtro) : 1;
  ctx.fillStyle = bate ? hex(VERDE, .18 * clamp(filtro)) : '#ffffff'; rr(x, yy, w, 80, 12); ctx.fill(); if (bate) { ctx.strokeStyle = hex(VERDE, clamp(filtro)); ctx.lineWidth = 3; rr(x, yy, w, 80, 12); ctx.stroke(); }
  txt(m[0], x + 22, yy + 28, ARC, 24, '#5a6a8f', { weight: 600 }); txt(m[1], x + 22, yy + 60, ARC, 30, '#1b2440', { weight: 600 }); ctx.restore(); }); }
function planilha(x, y, w, n, t, a) { if (a <= 0) return; ctx.save(); ctx.globalAlpha *= clamp(a); const cw = [150, 230, w - 380];
  ctx.fillStyle = '#ffffff'; rr(x, y, w, 70 + 70 * 2, 12); ctx.fill();
  ['Data', 'Loja', 'Assunto'].forEach((h, j) => { const cx = x + cw.slice(0, j).reduce((s, v) => s + v, 0); ctx.fillStyle = '#e6f4ea'; ctx.fillRect(cx + 2, y + 2, cw[j] - 4, 66); txt(h, cx + 18, y + 36, ARC, 30, '#1e7e45', { weight: 800 }); });
  LINHAS.forEach((l, i) => { const q = clamp(n - i); if (q <= 0) return; l.forEach((c, j) => { const cx = x + cw.slice(0, j).reduce((s, v) => s + v, 0);
    txt(c, cx + 18 + 20 * (1 - ease(q)), y + 105 + i * 70, ARC, 28, '#1b2440', { weight: 600, alpha: q }); }); });
  ctx.strokeStyle = '#c5d0e6'; ctx.lineWidth = 2; for (let i = 1; i < 3; i++) { ctx.beginPath(); ctx.moveTo(x, y + 70 * i); ctx.lineTo(x + w, y + 70 * i); ctx.stroke(); }
  ctx.restore(); }
function passo(x, y, w, rot, app, ev, a, cor) { if (a <= 0) return; ctx.save(); ctx.globalAlpha *= clamp(a); const e = .9 + .1 * back(clamp(a)); ctx.translate(x, y + 85); ctx.scale(e, e); ctx.translate(-x, -y - 85);
  ctx.fillStyle = 'rgba(10,30,60,.95)'; rr(x - w / 2, y, w, 170, 24); ctx.fill(); ctx.strokeStyle = cor; ctx.lineWidth = 4; ctx.shadowColor = cor; ctx.shadowBlur = 24; rr(x - w / 2, y, w, 170, 24); ctx.stroke(); ctx.shadowBlur = 0;
  txt(rot, x - w / 2 + 30, y + 42, ARC, 26, cor, { weight: 600, ls: 2 }); txt(app, x - w / 2 + 30, y + 95, ARC, 42, BR, { weight: 800 }); txt(ev, x - w / 2 + 30, y + 142, ARC, 34, 'rgba(244,248,255,.85)', { weight: 600 }); ctx.restore(); }
const S = [
  // 0 · gancho: e-mail de compra vira linha
  (t, lt) => {
    titulo('COMPRA VIRA LINHA', 330, -1, SC[1] - .2, t, 84, BR, 'LINHA', VERDE);
    janela(430, 470, prog(lt, 0, .2), 'Gmail', (x, y, w) => caixa(x, y, w, t, prog(t, wt('compra', 0) - .2, wt('compra', 0) + .3)));
    planilha(cx0 - 410, 970, 820, 2 * prog(t, wt('linha', 0) - .3, wt('gastos', 0)), t, prog(t, wt('linha', 0) - .4, wt('linha', 0) - .1));
  },
  // 1 · episódio
  (t, lt) => {
    titulo('AUTOMAÇÃO DO ZERO', 500, SC[1], SC[2] - .2, t, 76, BR, 'ZERO', CI);
    versao('EPISÓDIO 5', cx0, 700, prog(t, wt('episodio', 1) - .1, wt('episodio', 1) + .3), CI, 0, 60);
    versao('copiar à mão', cx0, 960, prog(t, wt('copiar', 1) - .3, wt('copiar', 1)), VERM, prog(t, wt('mao', 1) - .2, wt('mao', 1) + .3), 50);
  },
  // 2 · passo 1: planilha com cabeçalho
  (t, lt) => {
    numero(1, 300, SC[2], SC[3] - .2, t);
    titulo('CRIE A PLANILHA', 450, wt('crie', 2) - .1, SC[3] - .2, t, 80, BR, 'PLANILHA', VERDE);
    planilha(cx0 - 410, 620, 820, 0, t, prog(t, wt('planilha', 2) - .2, wt('planilha', 2) + .2));
    ['Data', 'Loja', 'Assunto'].forEach((s, i) => pilula(s, cx0 - 280 + i * 280, 980, 240, prog(t, wt(s.toLowerCase(), 2) - .2, wt(s.toLowerCase(), 2) + .2), VERDE, '', 1, 40));
    linhaTxt('na primeira linha', 1120, wt('primeira', 2) - .2, SC[3] - .2, t, 44, CI);
  },
  // 3 · passo 2: gatilho Gmail com busca
  (t, lt) => {
    numero(2, 300, SC[3], SC[4] - .2, t);
    titulo('GATILHO: GMAIL', 450, wt('zapier', 3) - .1, SC[4] - .2, t, 80, BR, 'GMAIL', CI);
    linhaTxt('gatilho = o que dispara tudo', 550, wt('gatilho', 3) - .2, SC[4] - .2, t, 38, CI);
    passo(cx0, 620, 820, 'GATILHO (TRIGGER)', 'Gmail', 'New Email Matching Search', prog(t, wt('gmail', 3) - .2, wt('gmail', 3) + .3), CI);
    versao('subject:pedido', cx0, 900, prog(t, wt('subject', 3) - .2, wt('subject', 3) + .2), AMB, 0, 56);
    janela(990, 290, prog(t, wt('pedido', 3) - .1, wt('pedido', 3) + .2), 'só os e-mails que batem', (x, y, w) => MAILS.filter(m => m[2]).forEach((m, i) => { const yy = y - 20 + i * 80; ctx.fillStyle = hex(VERDE, .18); rr(x, yy, w, 70, 12); ctx.fill(); txt(m[0], x + 22, yy + 24, ARC, 22, '#5a6a8f', { weight: 600 }); txt(m[1], x + 22, yy + 52, ARC, 28, '#1b2440', { weight: 600 }); }), 820);
  },
  // 4 · passo 3: ação Sheets
  (t, lt) => {
    numero(3, 300, SC[4], SC[5] - .2, t);
    titulo('AÇÃO: GOOGLE SHEETS', 450, wt('acao', 4) - .1, SC[5] - .2, t, 70, BR, 'SHEETS', VERDE);
    const li = wt('ligue', 4), te = wt('teste', 4);
    passo(cx0, 560, 820, 'AÇÃO (ACTION)', 'Google Sheets', 'Create Spreadsheet Row', prog(t, wt('google', 4) - .2, wt('google', 4) + .3) * (1 - prog(t, li - .4, li - .1)), VERDE);
    [['data', 'Data'], ['remetente', 'Loja'], ['assunto', 'Assunto']].forEach(([w, c], i) => { const q = prog(t, wt(w, 4) - .2, wt(w, 4) + .2), y = 600 + i * 120;
      pilula(w === 'remetente' ? 'From' : w === 'data' ? 'Date' : 'Subject', cx0 - 230, y, 300, q, CI, '', 1, 38); setaH(cx0 - 60, cx0 + 60, y, q, CI); pilula(c, cx0 + 230, y, 300, q, VERDE, '', 1, 38); });
    planilha(cx0 - 410, 980, 820, 2 * prog(t, te, wt('publish', 4)), t, prog(t, te - .3, te));
    botao(cx0 + 140, 1220 - 10, 'Publish', prog(t, wt('clique', 4) - .1, wt('clique', 4) + .2), prog(t, wt('publish', 4), wt('publish', 4) + .4), AZ);
  },
  // 5 · ritmo e limite
  (t, lt) => {
    titulo('A CADA 15 MINUTOS', 380, SC[5], SC[6] - .2, t, 80, BR, '15 MINUTOS', AMB);
    neon3d(P.relogio, cx0, 680 + flut(t), 120 * back(prog(lt, .05, .4)), t * .5, .1, AMB, prog(lt, .05, .3));
    pilula('grátis: 100 tarefas por mês', cx0, 940, 720, prog(t, wt('gratis', 5) - .2, wt('gratis', 5) + .2), VERDE, 'cada linha criada = 1 tarefa', 1, 44);
    pilula('só entra o que bate com a busca', cx0, 1110, 760, prog(t, wt('cem', 5), wt('mes', 5) + .2), AMB, '', 1, 40);
  },
  // 6 · fim
  (t, lt) => fim(t, lt, 'Salva e segue', 'terça: episódio 6'),
];
</script></body></html>
