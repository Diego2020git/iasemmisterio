<html><head><meta charset="utf-8">

<img id="logo" src="marca/logo.png" style="display:none">
<canvas id="c" width="1080" height="1920"></canvas>

<script>
// 12/11/2026 · 19h · Como o Gemini entende uma foto: multimodal (Termo de IA #5). Grade de engajamento de 06/11.
// Mecanismo: imagem cortada em quadrados (até 768x768), cada um vira 258 tokens; o mesmo modelo lê texto e imagem juntos. Fonte: ai.google.dev/gemini-api/docs/image-understanding.
const T0 = TEMPOS.cenas;
const SC = [T0[0], T0[1], T0[2], T0[3], T0[4], T0[5], T0[6], T0[7] + .7];
const DURATION = SC[7], IMPACTO = SC[6] + .4;
const CLIQUES = [];
const CK = [[0, 0, 0, 0, 0], [DURATION, 0, 0, 0, 0]];
const COR = [AZ, CI, CI, VERDE, AZ, AMB, AZ];
const HITS = [wt('foto', 0), wt('entende', 0), wt('multimodal', 1), wt('imagem', 1), wt('quadrados', 2), wt('tokens', 2), wt('juntos', 3), wt('pergunta', 3), wt('anexe', 4), wt('pergunte', 4), wt('gratis', 5), wt('confira', 5)];
// foto ilustrativa: vaso com planta
function foto(x, y, s, a, grade, t) { if (a <= 0) return; ctx.save(); ctx.globalAlpha *= clamp(a); ctx.translate(x, y); ctx.scale(s, s);
  ctx.fillStyle = '#f3e7d3'; rr(-200, -200, 400, 400, 16); ctx.fill(); ctx.fillStyle = '#e2d2b6'; ctx.fillRect(-200, 90, 400, 110);
  ctx.fillStyle = '#c0663a'; ctx.beginPath(); ctx.moveTo(-80, 40); ctx.lineTo(80, 40); ctx.lineTo(60, 170); ctx.lineTo(-60, 170); ctx.closePath(); ctx.fill();
  ctx.fillStyle = '#2f9e4f'; [[-70, -40, -.6], [0, -90, 0], [70, -40, .6], [-40, -110, -.3], [45, -115, .3]].forEach(([lx, ly, r]) => { ctx.save(); ctx.translate(lx, ly); ctx.rotate(r); ctx.beginPath(); ctx.ellipse(0, 0, 34, 70, 0, 0, 7); ctx.fill(); ctx.restore(); });
  if (grade > 0) { const g = clamp(grade); ctx.strokeStyle = CI; ctx.lineWidth = 6; ctx.shadowColor = CI; ctx.shadowBlur = 16; ctx.globalAlpha *= g;
    ctx.beginPath(); ctx.moveTo(0, -200); ctx.lineTo(0, -200 + 400 * g); ctx.moveTo(-200, 0); ctx.lineTo(-200 + 400 * g, 0); ctx.stroke(); ctx.shadowBlur = 0; }
  ctx.restore(); }
function resposta(x, y, w, a) { if (a <= 0) return; ctx.save(); ctx.globalAlpha *= clamp(a); ctx.fillStyle = '#ffffff'; rr(x, y, w, 150, 20); ctx.fill();
  ctx.fillStyle = '#4285f4'; ctx.beginPath(); ctx.arc(x + 44, y + 50, 18, 0, 7); ctx.fill(); txt('Gemini', x + 76, y + 58, ARC, 28, '#1b2440', { weight: 800 });
  txt('É uma jiboia. Regue 1 vez por semana.', x + 30, y + 112, ARC, 30, '#1b2440', { weight: 600 }); ctx.restore(); }
function ladrilhos(cx, cy, a, t) { if (a <= 0) return; [[-1, -1], [1, -1], [-1, 1], [1, 1]].forEach(([dx, dy], i) => { const q = clamp(a * 4 - i * .6); if (q <= 0) return; const ex = 40 * q;
  ctx.save(); ctx.globalAlpha *= q; ctx.strokeStyle = CI; ctx.lineWidth = 4; ctx.fillStyle = hex(CI, .12); const x = cx + dx * (110 + ex) - 100, y = cy + dy * (110 + ex) - 100;
  rr(x, y, 200, 200, 14); ctx.fill(); ctx.stroke(); txt('258', x + 100, y + 100, EXP, 52, BR, { align: 'center' }); txt('TOKENS', x + 100, y + 150, ARC, 26, CI, { align: 'center', weight: 700, ls: 2 }); ctx.restore(); }); }
const S = [
  // 0 · gancho
  (t, lt) => {
    titulo('O GEMINI ENTENDE FOTO?', 360, -1, SC[1] - .2, t, 64, BR, 'FOTO?', CI);
    foto(cx0, 700, 1, prog(lt, 0, .2), 0, t);
    resposta(cx0 - 380, 950, 760, prog(t, wt('explica', 0) - .2, wt('explica', 0) + .2));
    exemplo(cx0, 1150, prog(lt, .3, .6));
    linhaTxt('como ele entende?', 1250, wt('entende', 0) - .3, SC[1] - .2, t, 48, AMB);
  },
  // 1 · o nome
  (t, lt) => {
    titulo('MULTIMODAL', 480, SC[1], SC[2] - .2, t, 100, BR, 'MULTIMODAL', CI);
    pilula('texto', cx0 - 180, 700, 260, prog(t, wt('texto', 1) - .2, wt('texto', 1) + .2), AZ, '', 1, 46);
    pilula('imagem', cx0 + 180, 700, 280, prog(t, wt('imagem', 1) - .2, wt('imagem', 1) + .2), CI, '', 1, 46);
    pilula('ChatGPT', cx0 - 180, 880, 280, prog(t, wt('chatgpt', 1) - .2, wt('chatgpt', 1) + .2), VERDE, '', 1, 42);
    pilula('Claude', cx0 + 180, 880, 260, prog(t, wt('claude', 1) - .2, wt('claude', 1) + .2), AMB, '', 1, 42);
    neon3d(P.check, cx0, 1110 + flut(t), 70 * back(prog(t, wt('tambem', 1) - .3, wt('tambem', 1))), .3 * Math.sin(t), .1, VERDE, prog(t, wt('tambem', 1) - .3, wt('tambem', 1)));
  },
  // 2 · quadrados viram tokens
  (t, lt) => {
    numero(1, 300, SC[2], SC[3] - .2, t);
    titulo('A FOTO VIRA QUADRADOS', 450, SC[2], SC[3] - .2, t, 64, BR, 'QUADRADOS', CI);
    const g = prog(t, wt('cortada', 2) - .2, wt('quadrados', 2) + .2), sp = prog(t, wt('vira', 2) - .2, wt('tokens', 2) + .3);
    foto(cx0, 820, 1, 1 - sp, g, t);
    ladrilhos(cx0, 820, sp, t);
    linhaTxt('token = pedaço que a IA lê', 1170, wt('pedacos', 2) - .2, SC[3] - .2, t, 42, CI);
    linhaTxt('quadrados de até 768 px', 1250, wt('pedacos', 2), SC[3] - .2, t, 32, BR);
  },
  // 3 · texto e imagem juntos
  (t, lt) => {
    numero(2, 300, SC[3], SC[4] - .2, t);
    titulo('TUDO JUNTO', 450, SC[3], SC[4] - .2, t, 90, BR, 'JUNTO', VERDE);
    pilula('"que planta é essa?"', cx0 - 200, 650, 520, prog(t, wt('texto', 3) - .2, wt('texto', 3) + .2), AZ, 'TEXTO', 1, 36);
    pilula('foto', cx0 + 280, 650, 220, prog(t, wt('imagem', 3) - .2, wt('imagem', 3) + .2), CI, 'IMAGEM', 1, 40);
    const j = prog(t, wt('juntos', 3) - .3, wt('juntos', 3) + .2);
    fio(cx0 - 200, 720, cx0, 900, j, AZ, t, true); fio(cx0 + 280, 720, cx0, 900, j, CI, t, true);
    neon3d(P.engrenagem, cx0, 1000 + flut(t), 90 * back(j), t * .6, .1, VERDE, j);
    linhaTxt('um modelo só', 1190, wt('juntos', 3), SC[4] - .2, t, 46, VERDE);
  },
  // 4 · como testar
  (t, lt) => {
    numero(3, 300, SC[4], SC[5] - .2, t);
    titulo('TESTE NO GEMINI', 450, SC[4], SC[5] - .2, t, 76, BR, 'GEMINI', AZ);
    foto(cx0, 760, .6, prog(t, wt('anexe', 4) - .2, wt('anexe', 4) + .2), 0, t);
    pilula('1. anexe a foto', cx0, 1000, 480, prog(t, wt('anexe', 4) - .2, wt('foto', 4) + .2), CI, '', 1, 42);
    pilula('2. pergunte', cx0, 1150, 400, prog(t, wt('pergunte', 4) - .2, wt('quiser', 4) + .2), VERDE, '', 1, 42);
  },
  // 5 · limites
  (t, lt) => {
    titulo('OS LIMITES', 400, SC[5], SC[6] - .2, t, 90, BR, 'LIMITES', AMB);
    pilula('grátis no app', cx0, 620, 440, prog(t, wt('gratis', 5) - .2, wt('gratis', 5) + .2), VERDE, 'COM LIMITE DE USO', 1, 42);
    pilula('detalhe pequeno pode errar', cx0, 800, 700, prog(t, wt('detalhe', 5) - .2, wt('errado', 5) + .2), VERM, '', 1, 42);
    pilula('número e nome: confira', cx0, 980, 640, prog(t, wt('numero', 5) - .2, wt('confira', 5) + .2), AMB, '', 1, 42);
  },
  // 6 · fim
  (t, lt) => fim(t, lt, 'Salva e testa', 'com uma foto sua'),
];
</script></body></html>
