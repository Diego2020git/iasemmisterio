<!doctype html>
<html><head><meta charset="utf-8">
<style>
@font-face{font-family:"AX";src:url(fontes/ArchivoExpanded-ExtraBold.ttf);font-weight:800}
@font-face{font-family:"AR";src:url(fontes/Archivo-SemiBold.ttf);font-weight:600}

</style></head><body>
<img id="logo" src="marca/logo.png" style="display:none">
<canvas id="c" width="1080" height="1920"></canvas>
<script src="audio/2026-10-19-radar-ia-60s.tempos.js"></script>
<script src="raiox-kit.js"></script>
<script src="neon-kit.js"></script>
<script src="neon-extra.js"></script>
<script>
// 19/10/2026 · 12h · Radar IA #4 (60 s): DeepSeek V4.1 Flash 1017, GPT-6 Pro com agentes em paralelo, NVIDIA Nemotron 3.5 Super VL. Neon.
const T0 = TEMPOS.cenas;
const SC = [T0[0], T0[1], T0[2], T0[3], T0[4], T0[5], T0[6], T0[7] + .7];
const DURATION = SC[7], IMPACTO = SC[6] + .4;
const COR = [AZ, CI, AZ, IN, CI, AZ, AZ];
const HITS = [wt('deepseek', 0), wt('gpt6', 0), wt('nvidia', 0), wt('radar', 1), wt('flash', 2), wt('3d', 2), wt('gratis', 2), wt('agentes', 3), wt('paga', 3), wt('nemotron', 4), wt('gratis', 4), wt('legenda', 5)];
const CLIQUES = [];
const CK = [[0, 0, 0, 0, 0]];
const PEDIDO = 'Crie um jogo da cobrinha que rode no navegador, num arquivo HTML só.';
function fonte(str, t0, t1, t) { linhaTxt(str, 1560, t0, t1, t, 28, 'rgba(244,248,255,.6)'); }
// tabuleiro com cobrinha andando (ilustração do projeto gerado)
function cobrinha(x, y, a, t) { if (a <= 0) return; ctx.save(); ctx.globalAlpha *= clamp(a); const n = 10, c = 46, w = n * c;
  ctx.fillStyle = 'rgba(10,30,60,.9)'; rr(x - w / 2 - 20, y - w / 2 - 20, w + 40, w + 40, 24); ctx.fill(); ctx.strokeStyle = CI; ctx.lineWidth = 3; ctx.shadowColor = CI; ctx.shadowBlur = 20; rr(x - w / 2 - 20, y - w / 2 - 20, w + 40, w + 40, 24); ctx.stroke(); ctx.shadowBlur = 0;
  ctx.strokeStyle = 'rgba(46,230,255,.12)'; ctx.lineWidth = 1; for (let i = 1; i < n; i++) { ctx.beginPath(); ctx.moveTo(x - w / 2 + i * c, y - w / 2); ctx.lineTo(x - w / 2 + i * c, y + w / 2); ctx.stroke(); ctx.beginPath(); ctx.moveTo(x - w / 2, y - w / 2 + i * c); ctx.lineTo(x + w / 2, y - w / 2 + i * c); ctx.stroke(); }
  const path = []; for (let k = 0; k < 36; k++) { const s = k % 36; let px, py; if (s < 9) { px = s; py = 1; } else if (s < 18) { px = 9; py = 1 + (s - 9) * .9; } else if (s < 27) { px = 9 - (s - 18); py = 9; } else { px = 0; py = 9 - (s - 27) * .9; } path.push([px, py]); }
  const head = Math.floor(t * 6) % 36; for (let k = 0; k < 6; k++) { const p = path[(head - k + 36) % 36]; ctx.fillStyle = k ? hex(CI, .9 - k * .12) : BR; ctx.shadowColor = CI; ctx.shadowBlur = k ? 0 : 20; rr(x - w / 2 + p[0] * c + 4, y - w / 2 + Math.round(p[1]) * c + 4, c - 8, c - 8, 8); ctx.fill(); }
  ctx.shadowBlur = 0; ctx.fillStyle = '#ff5c8a'; ctx.beginPath(); ctx.arc(x - w / 2 + 5.5 * c, y - w / 2 + 5.5 * c, 14, 0, 7); ctx.fill(); ctx.restore(); }
// tarefa dividida entre agentes com barras de progresso
function agentes(x, y, a, t, t0) { if (a <= 0) return; ctx.save(); ctx.globalAlpha *= clamp(a);
  ctx.fillStyle = 'rgba(10,30,60,.92)'; rr(x - 220, y - 60, 440, 100, 22); ctx.fill(); ctx.strokeStyle = CI; ctx.lineWidth = 3; rr(x - 220, y - 60, 440, 100, 22); ctx.stroke();
  txt('1 tarefa', x, y + 5, ARC, 44, BR, { align: 'center', weight: 600 });
  ['pesquisa', 'texto', 'planilha'].forEach((nm, i) => { const ai = prog(t, t0 + i * .3, t0 + i * .3 + .4); if (ai <= 0) return; const bx = x + (i - 1) * 285, by = y + 260;
    ctx.save(); ctx.globalAlpha *= ai; ctx.strokeStyle = hex(CI, .6); ctx.lineWidth = 3; ctx.beginPath(); ctx.moveTo(x, y + 40); ctx.lineTo(bx, by - 80); ctx.stroke();
    ctx.fillStyle = 'rgba(10,30,60,.92)'; rr(bx - 125, by - 80, 250, 190, 20); ctx.fill(); ctx.strokeStyle = i === 1 ? CI : AZ; rr(bx - 125, by - 80, 250, 190, 20); ctx.stroke();
    txt('agente ' + (i + 1), bx, by - 25, ARC, 32, CI, { align: 'center', weight: 600 }); txt(nm, bx, by + 20, ARC, 30, BR, { align: 'center', weight: 600 });
    const pr = clamp((t - t0 - i * .2) / (2.6 + i * .5)); ctx.fillStyle = 'rgba(244,248,255,.15)'; rr(bx - 100, by + 60, 200, 16, 8); ctx.fill(); ctx.fillStyle = CI; rr(bx - 100, by + 60, 200 * pr, 16, 8); ctx.fill(); ctx.restore(); });
  ctx.restore(); }
const S = [
  // 0 · gancho
  (t, lt) => {
    linhaTxt('RADAR IA · 19/10', 300, -1, SC[1] - .2, t, 34, CI);
    frase('DeepSeek monta projeto inteiro', 620, -1, SC[1] - .2, 64, { t, hot: 'projeto inteiro', cor: CI });
    frase('GPT-6 Pro com vários agentes', 860, wt('gpt6', 0) - .1, SC[1] - .2, 64, { t, hot: 'vários agentes' });
    frase('NVIDIA: modelo que lê imagem', 1100, wt('nvidia', 0) - .1, SC[1] - .2, 60, { t, hot: 'lê imagem', cor: CI });
  },
  // 1 · o que é o radar
  (t, lt) => {
    neon3d(P.radar, cx0, cy0 - 90, 220 * back(prog(lt, .05, .5)), .4 * Math.sin(t * .9), .3, CI, prog(lt, .05, .3));
    frase('Radar IA', cy0 + 230, wt('radar', 1) - .1, SC[2] - .2, 100, { t, hot: 'IA', cor: CI });
    frase('as 3 notícias de hoje', cy0 + 350, wt('tres', 1) - .1, SC[2] - .2, 56, { t, hot: '3 notícias' });
  },
  // 2 · DeepSeek V4.1 Flash 1017
  (t, lt) => {
    numero(1, 300, SC[2], SC[3] - .2, t);
    frase('DeepSeek V4.1 Flash', 470, wt('deepseek', 2) - .1, SC[3] - .2, 76, { t, hot: 'Flash', cor: CI });
    linhaTxt('atualização de 17/10', 580, wt('atualizou', 2), SC[3] - .2, t, 40);
    const f2 = 1 - prog(t, SC[3] - .45, SC[3] - .2), j = wt('joguinho', 2);
    cobrinha(cx0, 900, prog(t, wt('projetos', 2), wt('projetos', 2) + .5) * f2, t);
    exemplo(cx0, 1190, prog(t, j, j + .3) * f2);
    selo('projeto completo', cx0 - 190, 1270, prog(t, wt('completos', 2) - .3, wt('completos', 2)), CI, f2);
    selo('respostas curtas', cx0 + 190, 1270, prog(t, wt('curtas', 2) - .3, wt('curtas', 2)), IN, f2);
    selo('site e app grátis', cx0, 1370, prog(t, wt('gratis', 2) - .4, wt('gratis', 2) - .1), CI, f2);
    fonte('Fonte: DeepSeek (notas oficiais, 17/10)', SC[2] + .4, SC[3] - .2, t);
  },
  // 3 · GPT-6 Pro com agentes em paralelo
  (t, lt) => {
    numero(2, 300, SC[3], SC[4] - .2, t);
    frase('GPT-6 Pro no ChatGPT', 470, wt('chatgpt', 3) - .1, SC[4] - .2, 76, { t, hot: 'GPT-6 Pro', cor: CI });
    linhaTxt('mais rápido', 580, wt('rapido', 3) - .2, SC[4] - .2, t, 40, CI);
    const f3 = 1 - prog(t, SC[4] - .45, SC[4] - .2);
    agentes(cx0, 760, prog(t, wt('divide', 3) - .2, wt('divide', 3) + .2) * f3, t, wt('agentes', 3) - .2);
    exemplo(cx0, 1180, prog(t, wt('agentes', 3), wt('agentes', 3) + .3) * f3);
    frase('só no plano Pro, que é pago', 1340, wt('mas', 3) - .1, SC[4] - .2, 60, { t, hot: 'pago' });
    fonte('Fonte: OpenAI (notas do ChatGPT, 16/10)', SC[3] + .4, SC[4] - .2, t);
  },
  // 4 · NVIDIA Nemotron 3.5
  (t, lt) => {
    numero(3, 300, SC[4], SC[5] - .2, t);
    frase('NVIDIA Nemotron 3.5', 470, wt('nemotron', 4) - .1, SC[5] - .2, 76, { t, hot: 'Nemotron 3.5', cor: CI });
    linhaTxt('modelo aberto: qualquer um pode baixar', 580, wt('aberto', 4) - .2, SC[5] - .2, t, 38);
    const f4 = 1 - prog(t, SC[5] - .45, SC[5] - .2), im = wt('imagem', 4);
    neon3d(P.chip, cx0, 850, 200 * back(prog(t, wt('modelo', 4), wt('modelo', 4) + .5)), .4 * Math.sin(t * .9), .3, CI, prog(t, wt('modelo', 4), wt('modelo', 4) + .3) * f4);
    selo('imagem', cx0 - 200, 1080, prog(t, im - .2, im + .1), CI, f4);
    selo('texto', cx0 + 200, 1080, prog(t, wt('texto', 4) - .2, wt('texto', 4) + .1), CI, f4);
    selo('feito pra agentes', cx0, 1170, prog(t, wt('agentes', 4) - .3, wt('agentes', 4)), IN, f4);
    selo('baixar: grátis', cx0 - 210, 1290, prog(t, wt('gratis', 4) - .3, wt('gratis', 4)), CI, f4);
    selo('PC potente', cx0 + 210, 1290, prog(t, wt('computador', 4) - .2, wt('computador', 4) + .1), IN, f4);
    fonte('Fonte: NVIDIA (blog oficial, 15/10)', SC[4] + .4, SC[5] - .2, t);
  },
  // 5 · teste hoje
  (t, lt) => {
    frase('Teste hoje, de graça', 300, wt('qual', 5) - .1, SC[6] - .2, 80, { t, hot: 'de graça', cor: CI });
    const a = prog(lt, .2, .5); if (a > 0) { ctx.save(); ctx.globalAlpha *= a;
      const lines = wrap(PEDIDO, 700, ARC, 46, 600), h = lines.length * 64 + 120;
      ctx.shadowColor = hex(CI, .5); ctx.shadowBlur = 40; ctx.fillStyle = 'rgba(10,30,60,.9)'; rr(cx0 - 400, 470, 800, h, 30); ctx.fill(); ctx.shadowBlur = 0;
      ctx.strokeStyle = CI; ctx.lineWidth = 3; rr(cx0 - 400, 470, 800, h, 30); ctx.stroke();
      txt('PEÇA AO DEEPSEEK (ESTÁ NA LEGENDA)', cx0 - 350, 520, ARC, 24, CI, { weight: 600, ls: 2 });
      lines.forEach((l, i) => txt(l, cx0 - 350, 590 + i * 64, ARC, 46, BR, { weight: 600, alpha: prog(t, SC[5] + .3 + i * .25, SC[5] + .6 + i * .25) }));
      ctx.restore();
      cobrinha(cx0, 470 + h + 330, prog(t, wt('cobrinha', 5), wt('cobrinha', 5) + .4) * .9, t);
    }
  },
  // 6 · logo + chamada
  (t, lt) => fim(t, lt, 'Siga o Radar IA', 'todo dia às 12h'),
];
</script></body></html>
