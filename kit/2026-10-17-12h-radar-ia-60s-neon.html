<!doctype html>
<html><head><meta charset="utf-8">
<style>
@font-face{font-family:"AX";src:url(fontes/ArchivoExpanded-ExtraBold.ttf);font-weight:800}
@font-face{font-family:"AR";src:url(fontes/Archivo-SemiBold.ttf);font-weight:600}

</style></head><body>
<img id="logo" src="marca/logo.png" style="display:none">
<canvas id="c" width="1080" height="1920"></canvas>
<script src="audio/2026-10-17-radar-ia-60s.tempos.js"></script>
<script src="raiox-kit.js"></script>
<script src="neon-kit.js"></script>
<script src="neon-extra.js"></script>
<script>
// 17/10/2026 · 12h · Radar IA #2 (60 s): GPT-Live-1.1 com voz pt-BR, Meta Muse Spark Open, ChatGPT Slides só pago. Neon.
const T0 = TEMPOS.cenas;
const SC = [T0[0], T0[1], T0[2], T0[3], T0[4], T0[5], T0[6], T0[7] + .7];
const DURATION = SC[7], IMPACTO = SC[6] + .4;
const COR = [AZ, CI, AZ, IN, CI, AZ, AZ];
const HITS = [wt('brasileira', 0), wt('meta', 0), wt('slides', 0), wt('radar', 1), wt('gptlive11', 2), wt('brasil', 2), wt('muse', 3), wt('816', 3), wt('512', 3), wt('slides', 4), wt('pagos', 4), wt('legenda', 5)];
const CLIQUES = [];
const CK = [[0, 0, 0, 0, 0]];
const PEDIDO = 'Fale como um professor paciente e me explique em 1 minuto o que é um modelo de pesos abertos.';
function fonte(str, t0, t1, t) { linhaTxt(str, 1560, t0, t1, t, 28, 'rgba(244,248,255,.6)'); }
// orbe de voz pulsando (ilustração, sem rótulo de botão)
function orbe(x, y, r, t, a) { if (a <= 0) return; ctx.save(); ctx.globalAlpha *= clamp(a);
  for (let i = 3; i >= 0; i--) { const rr2 = r * (1 + .18 * i + .06 * Math.sin(t * 5 + i)); ctx.strokeStyle = hex(CI, .25 + .15 * (3 - i)); ctx.lineWidth = 6; ctx.beginPath(); ctx.arc(x, y, rr2, 0, 7); ctx.stroke(); }
  const g = ctx.createRadialGradient(x, y, 0, x, y, r); g.addColorStop(0, '#bff8ff'); g.addColorStop(1, AZ); ctx.fillStyle = g; ctx.shadowColor = CI; ctx.shadowBlur = 40; ctx.beginPath(); ctx.arc(x, y, r, 0, 7); ctx.fill(); ctx.restore(); }
function macStudio(x, y, a, rot) { if (a <= 0) return; ctx.save(); ctx.globalAlpha *= clamp(a); ctx.translate(x, y); ctx.scale(back(clamp(a)), back(clamp(a)));
  ctx.fillStyle = 'rgba(200,215,235,.95)'; rr(-130, -80, 260, 160, 30); ctx.fill(); ctx.strokeStyle = CI; ctx.lineWidth = 3; ctx.shadowColor = CI; ctx.shadowBlur = 20; rr(-130, -80, 260, 160, 30); ctx.stroke(); ctx.shadowBlur = 0;
  ctx.fillStyle = '#7a8aa3'; for (let i = 0; i < 2; i++) { ctx.beginPath(); ctx.arc(-80 + i * 30, 40, 8, 0, 7); ctx.fill(); }
  txt('512 GB', 0, -10, ARC, 40, AZ, { align: 'center', weight: 600 }); ctx.restore(); }
const S = [
  // 0 · gancho: as três manchetes
  (t, lt) => {
    linhaTxt('RADAR IA · 17/10', 300, -1, SC[1] - .2, t, 34, CI);
    frase('ChatGPT com voz brasileira', 620, -1, SC[1] - .2, 70, { t, hot: 'voz brasileira', cor: CI });
    frase('Meta libera modelo gigante', 860, wt('meta', 0) - .1, SC[1] - .2, 70, { t, hot: 'gigante' });
    frase('ChatGPT faz slides', 1100, wt('chatgpt', 0, 2) - .1, SC[1] - .2, 76, { t, hot: 'slides', cor: CI });
  },
  // 1 · o que é o radar
  (t, lt) => {
    neon3d(P.radar, cx0, cy0 - 90, 220 * back(prog(lt, .05, .5)), .4 * Math.sin(t * .9), .3, CI, prog(lt, .05, .3));
    frase('Radar IA', cy0 + 230, wt('radar', 1) - .1, SC[2] - .2, 100, { t, hot: 'IA', cor: CI });
    frase('as 3 notícias de hoje', cy0 + 350, wt('tres', 1) - .1, SC[2] - .2, 56, { t, hot: '3 notícias' });
  },
  // 2 · ChatGPT Voice: GPT-Live-1.1, vozes novas pt-BR
  (t, lt) => {
    numero(1, 300, SC[2], SC[3] - .2, t);
    frase('GPT-Live-1.1', 470, wt('gptlive11', 2) - .1, SC[3] - .2, 84, { t, hot: '1.1', cor: CI });
    linhaTxt('no modo de voz do ChatGPT', 590, wt('modo', 2), SC[3] - .2, t, 42);
    celular(cx0, 1000, .6, .12 * Math.sin(t * .6), prog(t, wt('voz', 2), wt('voz', 2) + .4), (x, y, w, s) => {
      orbe(x + w / 2, y + 230 * s, 120 * s, t, prog(t, wt('voz', 2) + .2, wt('voz', 2) + .6));
    }, 'ChatGPT', AZ);
    exemplo(cx0, 1340, prog(t, wt('voz', 2) + .2, wt('voz', 2) + .6));
    const f2 = 1 - prog(t, SC[3] - .45, SC[3] - .2);
    selo('vozes novas', cx0 - 230, 1410, prog(t, wt('vozes', 2) - .1, wt('vozes', 2) + .2), CI, f2);
    selo('português do Brasil', cx0 + 170, 1410, prog(t, wt('brasil', 2) - .3, wt('brasil', 2)), CI, f2);
    selo('chegando pra todos desde 15/10', cx0, 1488, prog(t, wt('chegando', 2) - .1, wt('chegando', 2) + .2), IN, f2);
    fonte('Fonte: OpenAI (notas de versão do ChatGPT, 15/10)', SC[2] + .4, SC[3] - .2, t);
  },
  // 3 · Meta Muse Spark Open: pesos abertos, 816 bi, 2 Mac Studio
  (t, lt) => {
    numero(2, 300, SC[3], SC[4] - .2, t);
    frase('Muse Spark Open', 470, wt('muse', 3) - .1, SC[4] - .2, 80, { t, hot: 'Open', cor: CI });
    const f3 = 1 - prog(t, SC[4] - .45, SC[4] - .2);
    selo('pesos abertos', cx0, 590, prog(t, wt('pesos', 3) - .1, wt('pesos', 3) + .2), CI, f3);
    const b = wt('baixa', 3);
    neon3d(P.chip, cx0, 740, 90 * back(prog(t, b - .2, b + .2)), .4 * Math.sin(t * .9), .3, CI, prog(t, b - .2, b) * (1 - prog(t, wt('816', 3) - .4, wt('816', 3) - .1)));
    linhaTxt('baixa e roda na sua máquina', 880, b, wt('816', 3) - .1, t, 44);
    frase('816 bilhões', 760, wt('816', 3) - .1, SC[4] - .2, 110, { t, hot: '816', cor: CI });
    linhaTxt('de parâmetros', 870, wt('parametros', 3), SC[4] - .2, t, 46);
    linhaTxt('parâmetro = peça que guarda o que ele aprendeu', 950, wt('pecas', 3), SC[4] - .2, t, 34, CI);
    const m = wt('precisa', 3);
    macStudio(cx0 - 170, 1170, prog(t, m, m + .4) * f3); macStudio(cx0 + 170, 1170, prog(t, wt('mac', 3), wt('mac', 3) + .4) * f3);
    linhaTxt('2 Mac Studio de 512 GB cada', 1340, wt('mac', 3), SC[4] - .2, t, 44, CI);
    fonte('Fonte: Meta (blog e documentação, 15/10)', SC[3] + .4, SC[4] - .2, t);
  },
  // 4 · ChatGPT Slides: exporta, só pago
  (t, lt) => {
    numero(3, 300, SC[4], SC[5] - .2, t);
    frase('ChatGPT faz slides', 470, wt('slides', 4) - .3, SC[5] - .2, 80, { t, hot: 'slides', cor: CI });
    const p = wt('pede', 4), a = prog(t, p - .2, p + .3);
    if (a > 0) { ctx.save(); ctx.globalAlpha *= a; for (let i = 2; i >= 0; i--) { const ox = i * 34, oy = -i * 34;
      ctx.fillStyle = i ? 'rgba(220,232,255,.5)' : '#ffffff'; rr(cx0 - 300 + ox, 640 + oy, 520, 300, 22); ctx.fill(); }
      ctx.fillStyle = AZ; rr(cx0 - 260, 690, 300, 34, 10); ctx.fill(); ctx.fillStyle = '#c9d6f2'; [0, 1, 2].forEach(i => { rr(cx0 - 260, 760 + i * 46, 260 * ease(prog(t, p + i * .2, p + .5 + i * .2)), 22, 8); ctx.fill(); });
      ctx.fillStyle = CI; rr(cx0 + 40, 760, 140, 130, 14); ctx.fill(); ctx.restore(); }
    const e = wt('exporta', 4);
    const f4 = 1 - prog(t, SC[5] - .45, SC[5] - .2);
    ['PowerPoint', 'PDF', 'Google Slides'].forEach((l, i) => selo(l, cx0 - 280 + i * 260 + (i == 2 ? 20 : 0), 1060, prog(t, e + .3 + i * .35, e + .6 + i * .35), CI, f4));
    const k = wt('pagos', 4);
    neon3d(P.cadeado, cx0, 1240, 110 * back(prog(t, k - .4, k)), .4 * Math.sin(t * .8), .3, IN, prog(t, k - .4, k - .1));
    selo('só nos pagos: Pro, Business, Enterprise', cx0, 1400, prog(t, k, k + .3), IN, f4);
    fonte('Fonte: OpenAI (notas de versão do ChatGPT, 16/10)', SC[4] + .4, SC[5] - .2, t);
  },
  // 5 · teste hoje: o pedido completo
  (t, lt) => {
    frase('Teste hoje: a voz nova', 300, wt('qual', 5) - .1, SC[6] - .2, 76, { t, hot: 'voz nova', cor: CI });
    const a = prog(lt, .2, .5); if (a > 0) { ctx.save(); ctx.globalAlpha *= a;
      const lines = wrap(PEDIDO, 700, ARC, 46, 600), h = lines.length * 64 + 120;
      ctx.shadowColor = hex(CI, .5); ctx.shadowBlur = 40; ctx.fillStyle = 'rgba(10,30,60,.9)'; rr(cx0 - 400, 470, 800, h, 30); ctx.fill(); ctx.shadowBlur = 0;
      ctx.strokeStyle = CI; ctx.lineWidth = 3; rr(cx0 - 400, 470, 800, h, 30); ctx.stroke();
      txt('FALE ISTO (ESTÁ NA LEGENDA)', cx0 - 350, 520, ARC, 24, CI, { weight: 600, ls: 2 });
      lines.forEach((l, i) => txt(l, cx0 - 350, 590 + i * 64, ARC, 46, BR, { weight: 600, alpha: prog(t, SC[5] + .3 + i * .25, SC[5] + .6 + i * .25) }));
      ctx.restore();
      orbe(cx0, 470 + h + 220, 110, t, prog(t, wt('voz', 5, 2), wt('voz', 5, 2) + .5));
      linhaTxt('escolha uma voz em português', 470 + h + 420, wt('escolha', 5), SC[6] - .2, t, 42);
    }
  },
  // 6 · logo + chamada
  (t, lt) => fim(t, lt, 'Siga o Radar IA', 'todo dia às 12h'),
];
</script></body></html>
