<script>
// 24/10/2026 · 19h · Automação do zero #3: linha no Google Planilhas vira evento na Google Agenda (Zapier, 2 passos). Neon.
const T0 = TEMPOS.cenas;
const SC = [T0[0], T0[1], T0[2], T0[3], T0[4], T0[5], T0[6], T0[7] + .7];
const DURATION = SC[7], IMPACTO = SC[6] + .4;
const CLIQUES = [];
const CK = [[0, 0, 0, 0, 0], [DURATION, 0, 0, 0, 0]];
const COR = [AZ, CI, AZ, CI, IN, CI, AZ];
const HITS = [wt('planilha', 0), wt('agenda', 0), wt('zero', 1), wt('colunas', 2), wt('gatilho', 3), wt('event', 4), wt('100', 5)];
const COLS = ['Título', 'Data', 'Início', 'Fim'], LIN = ['Dentista', '28/10', '14:00', '15:00'];
function tabela(x, y, w, t, tl) { const cw = w / 4;
  COLS.forEach((c, i) => { const a = prog(t, tl + i * .35, tl + i * .35 + .3); txt(c, x + i * cw + 10, y + 30, ARC, 30, '#1b2440', { weight: 600, alpha: a }); });
  ctx.strokeStyle = 'rgba(27,36,64,.2)'; ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(x, y + 60); ctx.lineTo(x + w, y + 60); ctx.stroke(); }
function linha(x, y, w, a) { if (a <= 0) return; const cw = w / 4; ctx.save(); ctx.globalAlpha *= clamp(a); ctx.fillStyle = 'rgba(46,107,255,.12)'; rr(x - 6, y + 70, w + 12, 54, 10); ctx.fill();
  LIN.forEach((c, i) => txt(c, x + i * cw + 10, y + 105, ARC, 30, '#1b2440', { weight: 600 })); ctx.restore(); }
function evento(x, y, a) { if (a <= 0) return; ctx.save(); ctx.globalAlpha *= clamp(a); const e = back(clamp(a)); ctx.translate(x, y); ctx.scale(e, e);
  ctx.fillStyle = 'rgba(10,30,60,.95)'; rr(-300, -150, 600, 300, 30); ctx.fill(); ctx.strokeStyle = CI; ctx.lineWidth = 4; ctx.shadowColor = CI; ctx.shadowBlur = 24; rr(-300, -150, 600, 300, 30); ctx.stroke(); ctx.shadowBlur = 0;
  ctx.fillStyle = AZ; rr(-300, -150, 600, 70, 30); ctx.fill(); txt('Qua, 28 de outubro', 0, -105, ARC, 32, BR, { align: 'center', weight: 600 });
  ctx.fillStyle = CI; rr(-250, -40, 12, 120, 6); ctx.fill(); txt('Dentista', -210, 0, ARC, 48, BR, { weight: 800 }); txt('14:00 às 15:00', -210, 60, ARC, 36, 'rgba(244,248,255,.8)', { weight: 600 }); ctx.restore(); }
function passo(x, y, w, rot, app, ev, a, cor) { if (a <= 0) return; ctx.save(); ctx.globalAlpha *= clamp(a);
  ctx.fillStyle = 'rgba(10,30,60,.95)'; rr(x - w / 2, y, w, 170, 24); ctx.fill(); ctx.strokeStyle = cor; ctx.lineWidth = 3; rr(x - w / 2, y, w, 170, 24); ctx.stroke();
  txt(rot, x - w / 2 + 30, y + 42, ARC, 26, cor, { weight: 600, ls: 2 }); txt(app, x - w / 2 + 30, y + 95, ARC, 40, BR, { weight: 800 }); txt(ev, x - w / 2 + 30, y + 142, ARC, 34, 'rgba(244,248,255,.85)', { weight: 600 }); ctx.restore(); }
const S = [
  (t, lt) => {
    frase('Escreveu na planilha?', 300, -1, SC[1] - .2, 78, { t, hot: 'planilha', cor: CI });
    janela(470, 260, prog(lt, .1, .4), 'Google Planilhas', (x, y, w) => { tabela(x, y, w - 40, t, 0); linha(x, y, w - 40, prog(t, wt('planilha', 0) - .2, wt('planilha', 0) + .2)); });
    txt('↓', cx0, 860, ARC, 90, CI, { align: 'center', weight: 800, alpha: prog(t, wt('compromisso', 0) - .3, wt('compromisso', 0)) });
    evento(cx0, 1120, prog(t, wt('aparece', 0) - .2, wt('aparece', 0) + .3));
    exemplo(cx0, 1320, prog(t, wt('aparece', 0), wt('aparece', 0) + .3));
  },
  (t, lt) => {
    neon3d(P.check, cx0, cy0 - 110, 200 * back(prog(lt, .05, .5)), .4 * Math.sin(t * .9), .3, CI, prog(lt, .05, .3));
    frase('Automação do zero', cy0 + 200, wt('automacao', 1) - .1, SC[2] - .2, 88, { t, hot: 'zero', cor: CI });
    selo('episódio 3', cx0, cy0 + 340, prog(t, wt('episodio', 1), wt('episodio', 1) + .3));
    linhaTxt('nada de copiar data por data', cy0 + 460, wt('nada', 1), SC[2] - .2, t, 42);
  },
  (t, lt) => {
    numero(1, 300, SC[2], SC[3] - .2, t);
    frase('Crie as colunas', 470, wt('crie', 2) - .1, SC[3] - .2, 78, { t, hot: 'colunas', cor: CI });
    janela(640, 300, prog(lt, .1, .4), 'Google Planilhas', (x, y, w) => { tabela(x, y, w - 40, t, wt('titulo', 2) - .2); linha(x, y, w - 40, prog(t, wt('fim', 2) + .2, wt('fim', 2) + .6)); });
    exemplo(cx0, 1040, prog(lt, .4, .7));
  },
  (t, lt) => {
    numero(2, 300, SC[3], SC[4] - .2, t);
    frase('No Zapier, crie um Zap', 470, wt('zapier', 3) - .1, SC[4] - .2, 74, { t, hot: 'crie um Zap', cor: CI });
    linhaTxt('gatilho = o que dispara tudo', 580, wt('gatilho', 3) - .2, SC[4] - .2, t, 38, CI);
    passo(cx0, 700, 760, 'GATILHO (TRIGGER)', 'Google Sheets', 'New Spreadsheet Row', prog(t, wt('google', 3) - .2, wt('google', 3) + .3), CI);
    exemplo(cx0, 940, prog(lt, .4, .7));
  },
  (t, lt) => {
    numero(3, 300, SC[4], SC[5] - .2, t);
    frase('Ação: Google Calendar', 470, wt('acao', 4) - .1, SC[5] - .2, 74, { t, hot: 'Google Calendar', cor: CI });
    passo(cx0, 600, 760, 'GATILHO (TRIGGER)', 'Google Sheets', 'New Spreadsheet Row', prog(lt, .1, .3) * .6, IN);
    passo(cx0, 820, 760, 'AÇÃO (ACTION)', 'Google Calendar', 'Create Detailed Event', prog(t, wt('calendar', 4) - .2, wt('calendar', 4) + .3), CI);
    selo('Título → Summary', cx0 - 200, 1060, prog(t, wt('ligue', 4) - .1, wt('ligue', 4) + .2));
    selo('Início → Start', cx0 + 200, 1060, prog(t, wt('ligue', 4) + .2, wt('ligue', 4) + .5));
    selo('Publish', cx0, 1160, prog(t, wt('publique', 4) - .2, wt('publique', 4) + .1), IN);
    exemplo(cx0, 1250, prog(lt, .4, .7));
  },
  (t, lt) => {
    evento(cx0, cy0 - 120, prog(lt, .05, .5));
    frase('Cada linha vira evento', cy0 + 140, wt('cada', 5) - .1, SC[6] - .2, 72, { t, hot: 'evento', cor: CI });
    selo('grátis: 100 tarefas por mês', cx0, cy0 + 270, prog(t, wt('gratis', 5) - .2, wt('gratis', 5) + .2));
    linhaTxt('cada evento criado = 1 tarefa', cy0 + 370, wt('tarefas', 5), SC[6] - .2, t, 38);
  },
  (t, lt) => fim(t, lt, 'Salva e segue', 'terça: episódio 4'),
];
