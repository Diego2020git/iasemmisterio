<!doctype html>
<html><head><meta charset="utf-8">
<style>
@font-face{font-family:"AX";src:url(fontes/ArchivoExpanded-ExtraBold.ttf);font-weight:800}
@font-face{font-family:"AR";src:url(fontes/Archivo-SemiBold.ttf);font-weight:600}
html,body{margin:0;background:#000}canvas{display:block}
</style></head><body>
<img id="logo" src="marca/logo.png" style="display:none">
<canvas id="c" width="1080" height="1920"></canvas>
<script src="audio/2026-10-17-12h-legenda-clipchamp.tempos.js"></script>
<script src="raiox-kit.js"></script>
<script src="neon-kit.js"></script>
<script>
// 17/10/2026 · Faça com IA · legenda automática grátis no Clipchamp. Estilo neon (teste 2). Tempos em TEMPOS (voz.py).
const T0 = TEMPOS.cenas, FIMV = T0[5], TS = wt('salva', 4) - .1;
const SC = [T0[0], T0[1], T0[2], T0[3], T0[4], TS, FIMV + 1.6];
const DURATION = SC[6], IMPACTO = TS + .4;
const COR = [AZ, CI, AZ, CI, IN, AZ];
const HITS = [wt('graca', 0), wt('clipchamp', 1), wt('legendas', 2), wt('texto', 3), wt('gratis', 4)];
const CLIQUES = [wt('ative', 2) + .1, wt('corrija', 3)];
// tela de vídeo com legenda queimada (dentro do celular)
function telaVideo(x, y, w, s, t, leg, on) {
  const h = 560 * s; ctx.fillStyle = '#10182c'; rr(x, y, w, h, 18 * s); ctx.fill();
  const g = ctx.createLinearGradient(0, y, 0, y + h); g.addColorStop(0, 'rgba(47,107,255,.35)'); g.addColorStop(1, 'rgba(46,230,255,.08)'); ctx.fillStyle = g; rr(x, y, w, h, 18 * s); ctx.fill();
  ctx.fillStyle = 'rgba(244,248,255,.85)'; ctx.beginPath(); ctx.arc(x + w / 2, y + 190 * s, 62 * s, 0, 7); ctx.fill();
  ctx.beginPath(); ctx.moveTo(x + w / 2 - 120 * s, y + 400 * s); ctx.quadraticCurveTo(x + w / 2 - 120 * s, y + 270 * s, x + w / 2, y + 270 * s); ctx.quadraticCurveTo(x + w / 2 + 120 * s, y + 270 * s, x + w / 2 + 120 * s, y + 400 * s); ctx.fill();
  if (on > 0) { const sz = 30 * s, tw = measure(leg, ARC, sz, 600) + 30 * s; ctx.globalAlpha *= clamp(on);
    ctx.fillStyle = 'rgba(0,0,0,.8)'; rr(x + w / 2 - tw / 2, y + h - 110 * s, tw, 56 * s, 10 * s); ctx.fill();
    txt(leg, x + w / 2, y + h - 80 * s, ARC, sz, '#ffffff', { align: 'center', weight: 600 }); }
}
// linha de ajuste com chave liga/desliga (dentro do celular)
function linha(x, y, w, s, rot, on, a) {
  if (a <= 0) return; ctx.save(); ctx.globalAlpha *= clamp(a);
  txt(rot, x, y, ARC, 32 * s, '#1b2440', { weight: 600 });
  const kx = x + w - 100 * s; ctx.fillStyle = on > .5 ? AZ : '#b8c3da'; rr(kx, y - 26 * s, 92 * s, 50 * s, 25 * s); ctx.fill();
  ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(kx + 25 * s + 42 * s * ease(clamp(on)), y - 1 * s, 19 * s, 0, 7); ctx.fill();
  ctx.restore();
}
// cursor parado ao lado do elemento principal de cada cena; só se move nas trocas de cena (fora das linhas de texto)
const CPOS = [[860, 1000, 58, .3], [800, 860, 60, -.2], [770, 870, 55, 0], [800, 830, 55, .3], [850, 760, 0, -.2], [850, 760, 0, -.2]];
const CK = [[0, ...CPOS[0]]];
CPOS.forEach((c, i) => { if (i) CK.push([SC[i] - .25, ...CPOS[i - 1]]); CK.push([SC[i] + .3, ...c]); });
CK.push([SC[5] + .35, 800, 1600, 0, .5]);
const S = [
  // 0 · gancho: no quadro 1 o vídeo já tem a legenda e o título está inteiro
  (t, lt) => {
    frase('Legenda automática', 300, -1, SC[1] - .2, 84, { t, hot: 'automática' });
    celular(cx0, cy0 + 40, .82, -.25 + .15 * sm(lt / 3), 1, (x, y, w, s) => telaVideo(x, y, w, s, t, 'legenda automática', 1), 'Meu vídeo', CI);
    frase('grátis e sem marca d\'água', 1400, wt('graca', 0) - .1, SC[1] - .2, 56, { t, hot: 'grátis' });
  },
  // 1 · ferramenta: Clipchamp (da Microsoft), vídeo enviado
  (t, lt) => {
    neon3d(P.play, cx0, cy0 - 80, 210 * back(prog(lt, .05, .5)), .45 * Math.sin(t * .9), .3, CI, prog(lt, .05, .3));
    frase('Clipchamp', cy0 + 230, wt('clipchamp', 1) - .1, SC[2] - .2, 92, { t, hot: 'Clipchamp', cor: CI });
    frase('da Microsoft', cy0 + 340, wt('microsoft', 1) - .1, SC[2] - .2, 52, { t });
    selo('vídeo enviado', cx0, cy0 + 470, prog(t, wt('suba', 1), wt('suba', 1) + .3));
  },
  // 2 · aba Legendas: liga as legendas automáticas
  (t, lt) => {
    frase('Aba Legendas', 300, wt('aba', 2) - .1, SC[3] - .2, 80, { t, hot: 'Legendas' });
    celular(cx0, cy0 + 60, .82, .2 * Math.sin(t * .6), prog(lt, 0, .3), (x, y, w, s) => {
      txt('LEGENDAS', x, y + 30 * s, ARC, 24 * s, '#5a6a8f', { weight: 600, ls: 3 });
      linha(x, y + 120 * s, w, s, 'Automáticas', prog(t, CLIQUES[0], CLIQUES[0] + .3), 1);
      linha(x, y + 210 * s, w, s, 'Português', 1, prog(t, CLIQUES[0] + .4, CLIQUES[0] + .7));
      if (t > CLIQUES[0] + .6) { ctx.fillStyle = '#e6ecfa'; rr(x, y + 280 * s, w, 70 * s, 14 * s); ctx.fill();
        ctx.fillStyle = AZ; rr(x, y + 280 * s, w * clamp((t - CLIQUES[0] - .6) / 1.4), 70 * s, 14 * s); ctx.fill();
        txt('Transcrevendo...', x + 20 * s, y + 316 * s, ARC, 26 * s, '#ffffff', { weight: 600 }); }
    }, 'Clipchamp', CI);
  },
  // 3 · a fala vira texto; você corrige
  (t, lt) => {
    neon3d(P.legenda, cx0, cy0 - 120, 210 * back(prog(lt, .05, .5)), .4 * Math.sin(t * .8), .3, AZ, prog(lt, .05, .3));
    frase('A fala vira texto', cy0 + 190, wt('fala', 3) - .1, wt('corrija', 3) - .1, 76, { t, hot: 'texto' });
    frase('Corrija o que precisar', cy0 + 190, wt('corrija', 3) - .05, SC[4] - .2, 68, { t, hot: 'Corrija', cor: CI });
    selo('revisado', cx0, cy0 + 330, prog(t, wt('precisar', 3), wt('precisar', 3) + .3));
  },
  // 4 · 1080p no plano grátis
  (t, lt) => {
    frase('1080p', cy0 - 80, wt('exporta', 4) - .05, SC[5] + .1, 160, { t, hot: '1080p', cor: CI });
    frase('no plano grátis', cy0 + 90, wt('plano', 4) - .1, SC[5] + .1, 64, { t, hot: 'grátis' });
    selo('sem marca d\'água', cx0, cy0 + 240, prog(t, wt('gratis', 4), wt('gratis', 4) + .3));
  },
  // 5 · logo + chamada
  (t, lt) => fim(t, lt, 'Salva e testa hoje'),
];
</script></body></html>
