<!doctype html>
<html><head><meta charset="utf-8">
<style>
@font-face{font-family:"AX";src:url(fontes/ArchivoExpanded-ExtraBold.ttf);font-weight:800}
@font-face{font-family:"AR";src:url(fontes/Archivo-SemiBold.ttf);font-weight:600}
html,body{margin:0;background:#000}canvas{display:block}
</style></head><body>
<img id="logo" src="marca/logo.png" style="display:none">
<canvas id="c" width="1080" height="1920"></canvas>
<script src="audio/2026-10-18-12h-curriculo-chatgpt.tempos.js"></script>
<script src="raiox-kit.js"></script>
<script src="neon-kit.js"></script>
<script>
// 18/10/2026 · Faça com IA · currículo reescrito pra vaga no ChatGPT grátis. Estilo neon (teste 2). Tempos em TEMPOS (voz.py).
const T0 = TEMPOS.cenas, FIMV = T0[5], TS = wt('salva', 4) - .1;
const SC = [T0[0], T0[1], T0[2], T0[3], T0[4], TS, FIMV + 1.6];
const DURATION = SC[6], IMPACTO = TS + .4;
const COR = [AZ, CI, AZ, CI, IN, AZ];
const HITS = [wt('graca', 0), wt('chatgpt', 1), wt('vaga', 2), wt('resultado', 3), wt('confira', 4)];
const CLIQUES = [wt('cole', 1) + .1, wt('vaga', 2) + .1];
// folha de currículo (ícone novo, quadrado de -100 a 100)
P.documento = () => { ctx.beginPath(); ctx.moveTo(-70, -96); ctx.lineTo(40, -96); ctx.lineTo(76, -60); ctx.lineTo(76, 96); ctx.lineTo(-70, 96); ctx.closePath();
  ctx.moveTo(-28, -36); ctx.arc(-38, -36, 18, 0, 7); ctx.moveTo(-6, -46); ctx.lineTo(48, -46); ctx.moveTo(-6, -24); ctx.lineTo(30, -24);
  ctx.moveTo(-46, 16); ctx.lineTo(50, 16); ctx.moveTo(-46, 42); ctx.lineTo(50, 42); ctx.moveTo(-46, 68); ctx.lineTo(20, 68); };
// antes (riscado) e depois (ciano): a tarefa vira resultado, com os mesmos fatos
function troca(antes, depois, y, k) {
  const w = 760, a = ease(clamp(k));
  ctx.save(); ctx.shadowColor = a > .5 ? CI : AZ; ctx.shadowBlur = 25; ctx.fillStyle = 'rgba(10,30,60,.85)'; rr(cx0 - w / 2, y - 56, w, 112, 28); ctx.fill();
  ctx.strokeStyle = a > .5 ? CI : AZ; ctx.lineWidth = 3; rr(cx0 - w / 2, y - 56, w, 112, 28); ctx.stroke(); ctx.shadowBlur = 0;
  if (a < 1) { ctx.globalAlpha = 1 - a; txt(antes, cx0, y + 2, ARC, 40, '#9aa6bf', { align: 'center', weight: 600 });
    const tw = measure(antes, ARC, 40, 600); ctx.strokeStyle = '#ff5a76'; ctx.lineWidth = 5; ctx.beginPath(); ctx.moveTo(cx0 - tw / 2, y + 2); ctx.lineTo(cx0 - tw / 2 + tw * clamp(k * 3), y + 2); ctx.stroke(); }
  if (a > 0) { ctx.globalAlpha = a; txt(depois, cx0, y + 2, ARC, 40, CI, { align: 'center', weight: 600 }); }
  ctx.restore();
}
// cursor parado ao lado do elemento principal de cada cena; só se move nas trocas de cena; some nas cenas sem clique
const CPOS = [[830, 930, 58, .3], [830, 1000, 60, -.2], [830, 1000, 60, -.2], [830, 1000, 0, .3], [830, 1000, 0, -.2], [830, 1000, 0, -.2]];
const CK = [[0, ...CPOS[0]]];
CPOS.forEach((c, i) => { if (i) CK.push([SC[i] - .25, ...CPOS[i - 1]]); CK.push([SC[i] + .3, ...c]); });
const CV = 'Meu currículo: vendedor na Loja Centro, de 2021 a 2025. Atendia clientes e organizava o estoque.';
const S = [
  // 0 · gancho: título inteiro no quadro 1, folha de currículo acendendo
  (t, lt) => {
    frase('Currículo com IA', 300, -1, SC[1] - .2, 88, { t, hot: 'IA' });
    const k = prog(t, wt('atencao', 0) - .1, wt('atencao', 0) + .3);
    neon3d(P.documento, cx0, cy0 - 20, 230, .35 * Math.sin(t * .8), .3, k > .5 ? CI : AZ, 1, .2 + .2 * k);
    frase('feito de graça', 1300, wt('feito', 0) - .1, SC[1] - .2, 64, { t, hot: 'de graça', cor: CI });
  },
  // 1 · ChatGPT no plano grátis: cola o currículo
  (t, lt) => {
    frase('Abra o ChatGPT', 300, wt('abra', 1) - .1, SC[2] - .2, 80, { t, hot: 'ChatGPT' });
    celular(cx0, cy0 + 20, .9, -.2 + .15 * sm(lt / 3), prog(lt, 0, .3), (x, y, w, s) => {
      msg(x, y, w, CV, true, prog(t, CLIQUES[0], CLIQUES[0] + .3), s);
    }, 'ChatGPT', CI);
    frase('plano grátis', 1400, wt('plano', 1) - .1, SC[2] - .2, 60, { t, hot: 'grátis' });
  },
  // 2 · o pedido com foco na vaga (o texto pronto vai na legenda)
  (t, lt) => {
    frase('Foco na vaga', 300, wt('peca', 2) - .1, SC[3] - .2, 80, { t, hot: 'vaga' });
    celular(cx0, cy0 + 20, .9, .2 * Math.sin(t * .6), prog(lt, 0, .3), (x, y, w, s) => {
      let yy = y; yy += msg(x, yy, w, CV, true, 1, s);
      msg(x, yy, w, 'Reescreva para esta vaga. Destaque resultados e não invente nada.', true, prog(t, CLIQUES[1], CLIQUES[1] + .3), s);
    }, 'ChatGPT', CI);
    selo('pedido pronto na legenda', cx0, 1400, prog(t, wt('legenda', 2) - .2, wt('legenda', 2) + .1));
  },
  // 3 · tarefa vira resultado, sem inventar
  (t, lt) => {
    frase('Tarefa vira resultado', 340, wt('ele', 3) - .1, SC[4] - .2, 76, { t, hot: 'resultado' });
    const k0 = prog(t, wt('troca', 3), wt('resultado', 3) + .2);
    if (lt > .05) troca('Atendia clientes', 'Vendi e atendi clientes por 4 anos', cy0 - 90, k0);
    if (lt > .25) troca('Organizava o estoque', 'Organizei o estoque da loja', cy0 + 70, prog(t, wt('resultado', 3), wt('so', 3)));
    selo('nada inventado', cx0, cy0 + 260, prog(t, wt('inventar', 3), wt('inventar', 3) + .3));
  },
  // 4 · confere cada dado e envia
  (t, lt) => {
    neon3d(P.check, cx0, cy0 - 80, 200 * back(prog(lt, .05, .5)), .3 * Math.sin(t * .8), .3, CI, prog(lt, .05, .3), .4);
    frase('Confira cada dado', cy0 + 200, wt('confira', 4) - .1, SC[5] + .1, 80, { t, hot: 'cada dado' });
    frase('e envie', cy0 + 310, wt('envie', 4) - .1, SC[5] + .1, 56, { t });
  },
  // 5 · logo + chamada
  (t, lt) => fim(t, lt, 'Salva e testa hoje'),
];
</script></body></html>
