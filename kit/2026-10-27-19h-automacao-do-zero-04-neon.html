function caixa(x, y, w, t, est) { MAILS.forEach((m, i) => { const yy = y + i * 110; ctx.fillStyle = i === 0 && est > 0 ? 'rgba(255,209,102,.18)' : '#ffffff'; rr(x, yy, w, 96, 14); ctx.fill();

  const on = i === 0 ? clamp(est) : 0; ctx.save(); ctx.translate(x + 38, yy + 50); ctx.scale(1 + .4 * Math.sin(on * Math.PI), 1 + .4 * Math.sin(on * Math.PI));
  ctx.fillStyle = on > 0 ? '#ffc24b' : '#c5d0e6'; ctx.beginPath(); for (let k = 0; k < 10; k++) { const r = k % 2 ? 9 : 22, an = -Math.PI / 2 + k * Math.PI / 5; ctx.lineTo(r * Math.cos(an), r * Math.sin(an)); } ctx.closePath(); ctx.fill(); ctx.restore(); }); }

  ctx.fillStyle = 'rgba(10,30,60,.95)'; rr(-330, -120, 660, 240, 30); ctx.fill(); ctx.strokeStyle = CI; ctx.lineWidth = 4; ctx.shadowColor = CI; ctx.shadowBlur = 24; rr(-330, -120, 660, 240, 30); ctx.stroke(); ctx.shadowBlur = 0;

function passo(x, y, w, rot, app, ev, a, cor) { if (a <= 0) return; ctx.save(); ctx.globalAlpha *= clamp(a);
  ctx.fillStyle = 'rgba(10,30,60,.95)'; rr(x - w / 2, y, w, 170, 24); ctx.fill(); ctx.strokeStyle = cor; ctx.lineWidth = 3; rr(x - w / 2, y, w, 170, 24); ctx.stroke();
  txt(rot, x - w / 2 + 30, y + 42, ARC, 26, cor, { weight: 600, ls: 2 }); txt(app, x - w / 2 + 30, y + 95, ARC, 40, BR, { weight: 800 }); txt(ev, x - w / 2 + 30, y + 142, ARC, 34, 'rgba(244,248,255,.85)', { weight: 600 }); ctx.restore(); }
