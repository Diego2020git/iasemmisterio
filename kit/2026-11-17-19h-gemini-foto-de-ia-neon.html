const COR = [CI, AZ, AZ, CI, VERDE, AMB, AZ];
const HITS = [wt('ia', 0), wt('gemini', 0), wt('invisivel', 1), wt('synthid', 1), wt('app', 2), wt('imagem', 2), wt('pergunta', 3), wt('ia', 3), wt('marca', 4), wt('google', 4), wt('prova', 5), wt('desconfie', 5)];
function foto(x, y, s, a, t, marca) { if (a <= 0) return; ctx.save(); ctx.globalAlpha *= clamp(a); ctx.translate(x, y); ctx.scale(s, s);
  const g = ctx.createLinearGradient(0, -220, 0, 220); g.addColorStop(0, '#ff9a5a'); g.addColorStop(.55, '#ffcf7a'); g.addColorStop(.56, '#2f6f5e'); g.addColorStop(1, '#1d4a3f');
  ctx.fillStyle = g; rr(-300, -220, 600, 440, 24); ctx.fill(); ctx.fillStyle = '#fff3c4'; ctx.beginPath(); ctx.arc(120, -40, 60, 0, 7); ctx.fill();
  ctx.fillStyle = '#16362e'; ctx.beginPath(); ctx.moveTo(-300, 60); ctx.lineTo(-120, -60); ctx.lineTo(40, 60); ctx.closePath(); ctx.fill();
  if (marca > 0) { ctx.globalAlpha *= clamp(marca); ctx.fillStyle = CI; for (let i = 0; i < 12; i++) for (let j = 0; j < 9; j++) { const p = .5 + .5 * Math.sin(t * 4 + i * .7 + j * 1.3); ctx.globalAlpha = clamp(marca) * .6 * p; ctx.fillRect(-280 + i * 48, -200 + j * 48, 6, 6); } }
  ctx.restore(); }
const S = [

    titulo('ESSA FOTO É DE IA?', 340, -1, SC[1] - .2, t, 76, BR, 'IA?', CI);

  (t, lt) => {

      pilula('uma de cada vez', x + w / 2, y + 420, 480, prog(t, wt('uma', 2, 1) - .3, wt('vez', 2)), AZ, '', 1, 38); });
  },
  (t, lt) => {
    numero(2, 300, SC[3], SC[4] - .2, t);
    titulo('PERGUNTE', 450, wt('escreva', 3) - .2, SC[4] - .2, t, 84, BR, 'PERGUNTE', CI);

  },
  (t, lt) => {
    numero(3, 300, SC[4], SC[5] - .2, t);
    titulo('ACHOU A MARCA', 450, wt('achar', 4) - .2, SC[5] - .2, t, 80, BR, 'MARCA', VERDE);
    neon3d(P.check, cx0, 720 + flut(t), 100 * back(prog(t, wt('achar', 4) - .3, wt('achar', 4) + .1)), .4 * Math.sin(t * .8), .1, VERDE, prog(t, wt('achar', 4) - .3, wt('achar', 4) + .1));
    pilula('criada ou editada', cx0, 960, 520, prog(t, wt('criada', 4) - .3, wt('editada', 4) + .1), VERDE, 'PELA IA DO GOOGLE', 1, 44);
  },
  (t, lt) => {

    neon3d(P.escudo, cx0, 680 + flut(t), 90 * back(prog(t, wt('prova', 5) - .3, wt('prova', 5) + .1)), .4 * Math.sin(t * .8), .1, AMB, prog(t, wt('prova', 5) - .3, wt('prova', 5) + .1));
    pilula('outras IAs não deixam essa marca', cx0, 920, 800, prog(t, wt('outras', 5) - .3, wt('marca', 5) + .1), AMB, '', 1, 40);
    pilula('desconfie mesmo assim', cx0, 1070, 560, prog(t, wt('desconfie', 5) - .3, wt('assim', 5) + .1), VERM, '', 1, 42);
    linhaTxt('Fonte: Ajuda do Gemini (support.google.com)', 1210, wt('outras', 5), SC[6] - .2, t, 28, CI);
  },
  (t, lt) => fim(t, lt, 'Salva e confere', 'antes de compartilhar'),
];
