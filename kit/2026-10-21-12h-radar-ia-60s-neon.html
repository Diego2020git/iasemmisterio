<!doctype html>
<html><head><meta charset="utf-8">
<style>

<img id="logo" src="marca/logo.png" style="display:none">
<canvas id="c" width="1080" height="1920"></canvas>
<script src="audio/2026-10-21-radar-ia-60s.tempos.js"></script>
<script src="raiox-kit.js"></script>

<script src="neon-extra.js"></script>
<script>
// 21/10/2026 · 12h · Radar IA #6 (60 s): Gemini no Android Auto, agentes do Notion por até 24 h, DeepSeek abre o DeepInfer. Neon.
const T0 = TEMPOS.cenas;
const SC = [T0[0], T0[1], T0[2], T0[3], T0[4], T0[5], T0[6], T0[7] + .7];
const DURATION = SC[7], IMPACTO = SC[6] + .4;
const COR = [AZ, CI, AZ, IN, CI, AZ, AZ];
const HITS = [wt('gemini', 0), wt('notion', 0), wt('deepseek', 0), wt('radar', 1), wt('auto', 2), wt('agenda', 2), wt('brasil', 2), wt('24', 3), wt('revisao', 3), wt('deepinfer', 4), wt('gratis', 4), wt('legenda', 5)];
const CLIQUES = [];
const CK = [[0, 0, 0, 0, 0]];
const PEDIDO = 'Leia minhas notas desta semana e monte uma lista de tarefas com prazo.';
function fonte(str, t0, t1, t) { linhaTxt(str, 1560, t0, t1, t, 28, 'rgba(244,248,255,.6)'); }
function barra(x, y, w, rot, frac, a, cor) { if (a <= 0) return; ctx.save(); ctx.globalAlpha *= clamp(a);
  txt(rot, x - w / 2, y - 18, ARC, 34, BR, { weight: 600 }); ctx.fillStyle = 'rgba(244,248,255,.12)'; rr(x - w / 2, y, w, 44, 22); ctx.fill();
  ctx.fillStyle = cor; ctx.shadowColor = cor; ctx.shadowBlur = 20; rr(x - w / 2, y, w * frac * clamp(a), 44, 22); ctx.fill(); ctx.restore(); }
// tela de carro (ilustração) com pergunta e fontes de dados
function painelCarro(x, y, a, t, tp, fontes) { if (a <= 0) return; ctx.save(); ctx.globalAlpha *= clamp(a); const e = back(clamp(a)); ctx.translate(x, y); ctx.scale(e, e);
  ctx.fillStyle = 'rgba(10,30,60,.95)'; rr(-400, -170, 800, 340, 40); ctx.fill(); ctx.strokeStyle = CI; ctx.lineWidth = 4; ctx.shadowColor = CI; ctx.shadowBlur = 24; rr(-400, -170, 800, 340, 40); ctx.stroke(); ctx.shadowBlur = 0;
  ctx.fillStyle = 'rgba(46,107,255,.25)'; rr(-370, -140, 250, 280, 24); ctx.fill();
  ctx.strokeStyle = hex(CI, .7); ctx.lineWidth = 6; ctx.beginPath(); ctx.moveTo(-330, 110); ctx.quadraticCurveTo(-250, -20, -170, -100); ctx.stroke();
  ctx.fillStyle = BR; ctx.beginPath(); ctx.arc(-250 + 10 * Math.sin(t), 0, 12, 0, 7); ctx.fill();
  const ap = prog(t, tp, tp + .4); if (ap > 0) { ctx.globalAlpha *= ap; ctx.fillStyle = 'rgba(244,248,255,.95)'; rr(-90, -130, 460, 110, 28); ctx.fill();
    txt('A que horas é minha', -60, -88, ARC, 30, '#0b1a33', { weight: 600 }); txt('reunião de amanhã?', -60, -48, ARC, 30, '#0b1a33', { weight: 600 }); }
  ctx.restore();
  fontes.forEach((f, i) => selo(f[0], x - 250 + i * 250, y + 240, f[1], CI, 1)); }
function codigo(x, y, a, t) { if (a <= 0) return; ctx.save(); ctx.globalAlpha *= clamp(a);
  ctx.fillStyle = 'rgba(10,30,60,.95)'; rr(x - 380, y, 760, 330, 26); ctx.fill(); ctx.strokeStyle = CI; ctx.lineWidth = 3; ctx.shadowColor = CI; ctx.shadowBlur = 20; rr(x - 380, y, 760, 330, 26); ctx.stroke(); ctx.shadowBlur = 0;
  ['#ff5c8a', '#ffd166', '#2ee6ff'].forEach((c, i) => { ctx.fillStyle = c; ctx.beginPath(); ctx.arc(x - 340 + i * 34, y + 34, 9, 0, 7); ctx.fill(); });
  txt('DeepInfer', x + 340, y + 44, ARC, 28, CI, { align: 'right', weight: 600 });
  const L = [[0, .5, AZ], [1, .7, CI], [1, .55, BR], [2, .4, BR], [1, .62, CI], [0, .3, AZ]];
  L.forEach((l, i) => { const q = clamp((t * 3) - i * .5 - 1); if (q <= 0) return; ctx.fillStyle = l[2]; ctx.globalAlpha = clamp(a) * .85; rr(x - 330 + l[0] * 50, y + 80 + i * 38, 560 * l[1] * q, 16, 8); ctx.fill(); });
  ctx.restore(); }
const S = [
  // 0 · gancho
  (t, lt) => {
    linhaTxt('RADAR IA · 21/10', 300, -1, SC[1] - .2, t, 34, CI);
    frase('Gemini no Android Auto', 620, -1, SC[1] - .2, 64, { t, hot: 'Android Auto', cor: CI });
    frase('Notion: agente o dia inteiro', 860, wt('notion', 0) - .1, SC[1] - .2, 64, { t, hot: 'o dia inteiro' });
    frase('DeepSeek abre o código', 1100, wt('deepseek', 0) - .1, SC[1] - .2, 64, { t, hot: 'abre o código', cor: CI });
  },
  // 1 · o que é o radar
  (t, lt) => {
    neon3d(P.radar, cx0, cy0 - 90, 220 * back(prog(lt, .05, .5)), .4 * Math.sin(t * .9), .3, CI, prog(lt, .05, .3));
    frase('Radar IA', cy0 + 230, wt('radar', 1) - .1, SC[2] - .2, 100, { t, hot: 'IA', cor: CI });
    frase('as 3 notícias de hoje', cy0 + 350, wt('tres', 1) - .1, SC[2] - .2, 56, { t, hot: '3 notícias' });
  },
  // 2 · Gemini no Android Auto
  (t, lt) => {
    numero(1, 300, SC[2], SC[3] - .2, t);
    frase('Gemini no Android Auto', 470, wt('android', 2) - .1, SC[3] - .2, 74, { t, hot: 'Android Auto', cor: CI });
    const f2 = 1 - prog(t, SC[3] - .45, SC[3] - .2);
    painelCarro(cx0, 800, prog(t, wt('auto', 2), wt('auto', 2) + .5) * f2, t, wt('responder', 2) - .3,
      [['e-mails', prog(t, wt('emails', 2) - .2, wt('emails', 2) + .1) * f2], ['fotos', prog(t, wt('fotos', 2) - .2, wt('fotos', 2) + .1) * f2], ['agenda', prog(t, wt('agenda', 2) - .2, wt('agenda', 2) + .1) * f2]]);
    exemplo(cx0, 1110, prog(t, wt('responder', 2), wt('responder', 2) + .3) * f2);
    selo('contas pessoais, 18+', cx0, 1210, prog(t, wt('contas', 2) - .2, wt('contas', 2) + .1), IN, f2);
    selo('Brasil está na lista', cx0, 1300, prog(t, wt('brasil', 2) - .2, wt('brasil', 2) + .1), CI, f2);
    fonte('Fonte: Google (blog oficial, 20/10)', SC[2] + .4, SC[3] - .2, t);
  },
  // 3 · Notion: agentes por até 24 h
  (t, lt) => {
    numero(2, 300, SC[3], SC[4] - .2, t);
    frase('Agentes do Notion', 470, wt('notion', 3) - .1, SC[4] - .2, 76, { t, hot: 'Notion', cor: CI });
    linhaTxt('numa mesma tarefa', 580, wt('tarefa', 3) - .2, SC[4] - .2, t, 40);
    const f3 = 1 - prog(t, SC[4] - .45, SC[4] - .2);
    barra(cx0, 760, 680, 'antes: 5 minutos', .02, prog(t, wt('antes', 3) - .1, wt('antes', 3) + .3) * f3, IN);
    barra(cx0, 900, 680, 'agora: até 24 horas', 1, prog(t, wt('24', 3) - .2, wt('24', 3) + .6) * f3, CI);
    neon3d(P.cadeado, cx0, 1120, 130 * back(prog(t, wt('revisao', 3) - .2, wt('revisao', 3) + .3)), .4 * Math.sin(t * .9), .3, CI, prog(t, wt('revisao', 3) - .2, wt('revisao', 3) + .1) * f3);
    selo('revisão antes de agir', cx0, 1290, prog(t, wt('segura', 3) - .3, wt('segura', 3)), CI, f3);
    linhaTxt('números do próprio Notion', 1380, wt('segura', 3), SC[4] - .2, t, 30, 'rgba(244,248,255,.7)');
    fonte('Fonte: Notion (blog e notas de 19/10)', SC[3] + .4, SC[4] - .2, t);
  },
  // 4 · DeepSeek DeepInfer
  (t, lt) => {
    numero(3, 300, SC[4], SC[5] - .2, t);
    frase('DeepSeek abre o DeepInfer', 470, wt('deepseek', 4) - .1, SC[5] - .2, 64, { t, hot: 'DeepInfer', cor: CI });
    linhaTxt('o sistema que roda a IA nos servidores', 580, wt('sistema', 4) - .2, SC[5] - .2, t, 38);
    const f4 = 1 - prog(t, SC[5] - .45, SC[5] - .2);
    codigo(cx0, 680, prog(t, wt('servidores', 4) - .3, wt('servidores', 4) + .2) * f4, t - wt('servidores', 4) + .3);
    selo('código aberto', cx0 - 190, 1100, prog(t, wt('aberto', 4) - .3, wt('aberto', 4)), CI, f4);
    selo('grátis no GitHub', cx0 + 200, 1100, prog(t, wt('github', 4) - .3, wt('github', 4)), CI, f4);
    frase('é pra programador', 1260, wt('programador', 4) - .3, SC[5] - .2, 64, { t, hot: 'programador' });
    fonte('Fonte: DeepSeek (GitHub oficial, 20/10)', SC[4] + .4, SC[5] - .2, t);
  },
  // 5 · teste hoje
  (t, lt) => {
    frase('Teste hoje', 300, wt('qual', 5) - .1, SC[6] - .2, 80, { t, hot: 'hoje', cor: CI });
    const a = prog(lt, .2, .5); if (a > 0) { ctx.save(); ctx.globalAlpha *= a;
      const lines = wrap(PEDIDO, 700, ARC, 46, 600), h = lines.length * 64 + 120;
      ctx.shadowColor = hex(CI, .5); ctx.shadowBlur = 40; ctx.fillStyle = 'rgba(10,30,60,.9)'; rr(cx0 - 400, 470, 800, h, 30); ctx.fill(); ctx.shadowBlur = 0;
      ctx.strokeStyle = CI; ctx.lineWidth = 3; rr(cx0 - 400, 470, 800, h, 30); ctx.stroke();
      txt('PEÇA AO NOTION AGENT (ESTÁ NA LEGENDA)', cx0 - 350, 520, ARC, 24, CI, { weight: 600, ls: 2 });
      lines.forEach((l, i) => txt(l, cx0 - 350, 590 + i * 64, ARC, 46, BR, { weight: 600, alpha: prog(t, SC[5] + .3 + i * .25, SC[5] + .6 + i * .25) }));
      ctx.restore();
      neon3d(P.check, cx0, 470 + h + 200, 120 * back(prog(t, wt('lista', 5), wt('lista', 5) + .4)), .4 * Math.sin(t * .9), .3, CI, prog(t, wt('lista', 5), wt('lista', 5) + .3));
      linhaTxt('no plano grátis, é um teste limitado', 470 + h + 380, wt('pedido', 5) - .3, SC[6] - .2, t, 38);
    }
  },
  // 6 · logo + chamada
  (t, lt) => fim(t, lt, 'Siga o Radar IA', 'todo dia às 12h'),
];
</script></body></html>
