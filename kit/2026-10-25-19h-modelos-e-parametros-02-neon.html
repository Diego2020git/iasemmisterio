<script>
// 25/10/2026 · 19h · Modelos e parâmetros #2: janela de contexto (quanto a IA lê de uma vez). Neon.
const T0 = TEMPOS.cenas;
const SC = [T0[0], T0[1], T0[2], T0[3], T0[4], T0[5], T0[6], T0[7] + .7];
const DURATION = SC[7], IMPACTO = SC[6] + .4;
const CLIQUES = [];
const CK = [[0, 0, 0, 0, 0], [DURATION, 0, 0, 0, 0]];
const COR = [AZ, CI, AZ, CI, IN, CI, AZ];
const HITS = [wt('enorme', 0), wt('contexto', 0), wt('janela', 1), wt('flash', 2), wt('pdf', 3), wt('contador', 4), wt('milhao', 5)];
// janela que mostra só parte de uma fita de texto
function janelaCtx(x, y, a, t, desl, cor) { if (a <= 0) return; ctx.save(); ctx.globalAlpha *= clamp(a);
  const W = 640, H = 420; for (let i = 0; i < 14; i++) { const yy = y - 300 + i * 60 - desl; const dentro = yy > y - H / 2 && yy < y + H / 2 - 30;
    ctx.fillStyle = dentro ? BR : 'rgba(244,248,255,.15)'; rr(x - 280, yy, 560 * (.55 + .4 * ((i * 37) % 10) / 10), 20, 10); ctx.fill(); }
  ctx.strokeStyle = cor; ctx.lineWidth = 6; ctx.shadowColor = cor; ctx.shadowBlur = 30; rr(x - W / 2, y - H / 2, W, H, 28); ctx.stroke(); ctx.restore(); }
function contador(x, y, a, t, t0) { if (a <= 0) return; ctx.save(); ctx.globalAlpha *= clamp(a); const n = Math.round(184320 * clamp((t - t0) / 1.6));
  ctx.fillStyle = 'rgba(10,30,60,.95)'; rr(x - 380, y, 760, 200, 26); ctx.fill(); ctx.strokeStyle = CI; ctx.lineWidth = 3; rr(x - 380, y, 760, 200, 26); ctx.stroke();
  txt('tokens usados', x - 340, y + 50, ARC, 28, CI, { weight: 600, ls: 2 }); txt(n.toLocaleString('pt-BR') + ' / 1.048.576', x - 340, y + 120, ARC, 52, BR, { weight: 800 });
  ctx.fillStyle = 'rgba(244,248,255,.15)'; rr(x - 340, y + 150, 680, 18, 9); ctx.fill(); ctx.fillStyle = CI; rr(x - 340, y + 150, 680 * n / 1048576, 18, 9); ctx.fill(); ctx.restore(); }
const S = [
  (t, lt) => {
    frase('Ela esqueceu o começo?', 300, -1, SC[1] - .2, 76, { t, hot: 'esqueceu', cor: CI });
    janelaCtx(cx0, 820, prog(lt, .1, .4), t, 160 * prog(t, wt('esqueceu', 0) - .5, wt('esqueceu', 0) + .5), CI);
    frase('janela de contexto', 1340, wt('janela', 0) - .1, SC[1] - .2, 70, { t, hot: 'contexto', cor: CI });
  },
  (t, lt) => {
    frase('Modelos e parâmetros', 300, wt('modelos', 1) - .1, SC[2] - .2, 74, { t, hot: 'parâmetros', cor: CI });
    selo('episódio 2', cx0, 410, prog(t, wt('episodio', 1), wt('episodio', 1) + .3));
    janelaCtx(cx0, 820, prog(lt, .2, .5), t, 0, CI);
    linhaTxt('quanto texto ela lê de uma vez', 1340, wt('quanto', 1) - .1, SC[2] - .2, t, 44, CI);
  },
  (t, lt) => {
    numero(1, 300, SC[2], SC[3] - .2, t);
    frase('Google AI Studio', 470, wt('google', 2) - .1, SC[3] - .2, 78, { t, hot: 'AI Studio', cor: CI });
    selo('grátis', cx0, 590, prog(t, wt('gratis', 2) - .1, wt('gratis', 2) + .2));
    janela(680, 300, prog(lt, .1, .4), 'Google AI Studio', (x, y, w) => {
      campo(x, y, w - 140, 'Modelo', 'Gemini Flash', prog(t, wt('escolha', 2) - .2, wt('escolha', 2) + .1), prog(t, wt('flash', 2), wt('flash', 2) + .2)); });
    exemplo(cx0, 1060, prog(lt, .4, .7));
  },
  (t, lt) => {
    numero(2, 300, SC[3], SC[4] - .2, t);
    frase('Anexe um PDF grande', 470, wt('anexe', 3) - .1, SC[4] - .2, 76, { t, hot: 'PDF grande', cor: CI });
    neon3d(P.pasta, cx0, 820, 190 * back(prog(lt, .1, .5)), .35 * Math.sin(t * .8), .3, CI, prog(lt, .1, .3));
    selo('apostila', cx0 - 160, 1060, prog(t, wt('apostila', 3) - .1, wt('apostila', 3) + .2));
    selo('manual', cx0 + 160, 1060, prog(t, wt('manual', 3) - .1, wt('manual', 3) + .2));
  },
  (t, lt) => {
    numero(3, 300, SC[4], SC[5] - .2, t);
    frase('Olhe o contador', 470, wt('veja', 4) - .1, SC[5] - .2, 78, { t, hot: 'contador', cor: CI });
    linhaTxt('token = pedaço de texto', 580, wt('pedacos', 4) - .2, SC[5] - .2, t, 40, CI);
    contador(cx0, 700, prog(t, wt('contador', 4) - .2, wt('contador', 4) + .2), t, wt('contador', 4));
    exemplo(cx0, 960, prog(lt, .4, .7));
  },
  (t, lt) => {
    frase('Flash: até 1 milhão de tokens', 300, wt('flash', 5) - .1, SC[6] - .2, 64, { t, hot: '1 milhão', cor: CI });
    janelaCtx(cx0, 760, prog(lt, .1, .4), t, 0, CI);
    selo('passou disso: chat novo', cx0, 1200, prog(t, wt('passou', 5) - .1, wt('passou', 5) + .2), IN);
    linhaTxt('fonte: ai.google.dev, Gemini 3.8 Flash', 1290, wt('passou', 5), SC[6] - .2, t, 30, 'rgba(244,248,255,.7)');
  },
  (t, lt) => fim(t, lt, 'Salva e segue', 'domingo: modelo com raciocínio'),
];
