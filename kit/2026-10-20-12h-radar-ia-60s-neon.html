<!doctype html>
<html><head><meta charset="utf-8">
<style>
@font-face{font-family:"AX";src:url(fontes/ArchivoExpanded-ExtraBold.ttf);font-weight:800}
@font-face{font-family:"AR";src:url(fontes/Archivo-SemiBold.ttf);font-weight:600}
html,body{margin:0;background:#000}canvas{display:block}
</style></head><body>
<img id="logo" src="marca/logo.png" style="display:none">
<canvas id="c" width="1080" height="1920"></canvas>
<script src="audio/2026-10-20-radar-ia-60s.tempos.js"></script>
<script src="raiox-kit.js"></script>
<script src="neon-kit.js"></script>
<script src="neon-extra.js"></script>
<script>
// 20/10/2026 · 12h · Radar IA #5 (60 s): Mercury 3 (difusão), MiniMax M3.1 Flash, Gemini no Planilhas para iPhone. Neon.
const T0 = TEMPOS.cenas;
const SC = [T0[0], T0[1], T0[2], T0[3], T0[4], T0[5], T0[6], T0[7] + .7];
const DURATION = SC[7], IMPACTO = SC[6] + .4;
const COR = [AZ, CI, AZ, IN, CI, AZ, AZ];
const HITS = [wt('inteiro', 0), wt('70', 0), wt('gemini', 0), wt('radar', 1), wt('mercury', 2), wt('tempo', 2), wt('mil', 2), wt('minimax', 3), wt('70', 3), wt('gemini', 4), wt('pagos', 4), wt('legenda', 5)];
const CLIQUES = [];
const CK = [[0, 0, 0, 0, 0]];
const PEDIDO = 'Escreva um guia de 800 palavras sobre como organizar a semana com IA.';
function fonte(str, t0, t1, t) { linhaTxt(str, 1560, t0, t1, t, 28, 'rgba(244,248,255,.6)'); }
// painel de texto: 'seq' revela linha a linha; 'dif' revela todas as linhas juntas, de borrão a nítido
function painel(x, y, w, titulo, modo, a, p, cor) { if (a <= 0) return; ctx.save(); ctx.globalAlpha *= clamp(a);
  ctx.fillStyle = 'rgba(10,30,60,.92)'; rr(x - w / 2, y, w, 470, 22); ctx.fill(); ctx.strokeStyle = cor; ctx.lineWidth = 3; ctx.shadowColor = cor; ctx.shadowBlur = 18; rr(x - w / 2, y, w, 470, 22); ctx.stroke(); ctx.shadowBlur = 0;
  txt(titulo, x, y + 50, ARC, 30, cor, { align: 'center', weight: 600 });
  const L = [.92, .8, .88, .7, .85, .6, .9, .5];
  L.forEach((lw, i) => { let ww = (w - 60) * lw, al = 1;
    if (modo === 'seq') { const q = clamp(p * L.length - i); ww *= q; al = q > 0 ? 1 : 0; }
    else { al = .25 + .75 * clamp(p); }
    if (ww <= 0 || al <= 0) return; ctx.globalAlpha = clamp(a) * al;
    ctx.fillStyle = modo === 'dif' && p < 1 ? hex(CI, .35 + .5 * clamp(p)) : BR; rr(x - w / 2 + 30, y + 95 + i * 44, ww, 18, 9); ctx.fill(); });
  ctx.restore(); }
function barra(x, y, w, rot, frac, a, cor) { if (a <= 0) return; ctx.save(); ctx.globalAlpha *= clamp(a);
  txt(rot, x - w / 2, y - 18, ARC, 34, BR, { weight: 600 }); ctx.fillStyle = 'rgba(244,248,255,.12)'; rr(x - w / 2, y, w, 44, 22); ctx.fill();
  ctx.fillStyle = cor; ctx.shadowColor = cor; ctx.shadowBlur = 20; rr(x - w / 2, y, w * frac * clamp(a), 44, 22); ctx.fill(); ctx.restore(); }
const S = [
  // 0 · gancho
  (t, lt) => {
    linhaTxt('RADAR IA · 20/10', 300, -1, SC[1] - .2, t, 34, CI);
    frase('IA que escreve tudo de uma vez', 620, -1, SC[1] - .2, 60, { t, hot: 'de uma vez', cor: CI });
    frase('modelo chinês 70% mais barato', 860, wt('modelo', 0) - .1, SC[1] - .2, 60, { t, hot: '70%' });
    frase('Gemini nas planilhas do iPhone', 1100, wt('gemini', 0) - .1, SC[1] - .2, 60, { t, hot: 'planilhas', cor: CI });
  },
  // 1 · o que é o radar
  (t, lt) => {
    neon3d(P.radar, cx0, cy0 - 90, 220 * back(prog(lt, .05, .5)), .4 * Math.sin(t * .9), .3, CI, prog(lt, .05, .3));
    frase('Radar IA', cy0 + 230, wt('radar', 1) - .1, SC[2] - .2, 100, { t, hot: 'IA', cor: CI });
    frase('as 3 notícias de hoje', cy0 + 350, wt('tres', 1) - .1, SC[2] - .2, 56, { t, hot: '3 notícias' });
  },
  // 2 · Mercury 3
  (t, lt) => {
    numero(1, 300, SC[2], SC[3] - .2, t);
    frase('Mercury 3, da Inception', 470, wt('mercury', 2) - .1, SC[3] - .2, 72, { t, hot: 'Mercury 3', cor: CI });
    const f2 = 1 - prog(t, SC[3] - .45, SC[3] - .2), v = wt('vez', 2), m = wt('monta', 2);
    painel(cx0 - 200, 600, 380, 'palavra por palavra', 'seq', prog(t, v - .2, v + .2) * f2, (t - v) / 4, IN);
    painel(cx0 + 200, 600, 380, 'tudo de uma vez', 'dif', prog(t, m - .2, m + .2) * f2, (t - m) / 1.6, CI);
    exemplo(cx0, 1110, prog(t, v, v + .3) * f2);
    frase('+ de mil tokens por segundo', 1240, wt('mil', 2) - .2, SC[3] - .2, 60, { t, hot: 'mil tokens', cor: CI });
    linhaTxt('token = cada pedacinho de texto', 1340, wt('token', 2) - .1, SC[3] - .2, t, 40);
    linhaTxt('número divulgado pela empresa', 1410, wt('empresa', 2), SC[3] - .2, t, 30, 'rgba(244,248,255,.7)');
    fonte('Fonte: Inception (blog oficial, 19/10)', SC[2] + .4, SC[3] - .2, t);
  },
  // 3 · MiniMax M3.1 Flash
  (t, lt) => {
    numero(2, 300, SC[3], SC[4] - .2, t);
    frase('MiniMax M3.1 Flash', 470, wt('minimax', 3) - .1, SC[4] - .2, 76, { t, hot: 'M3.1 Flash', cor: CI });
    linhaTxt('pra agentes e programação', 580, wt('agentes', 3) - .2, SC[4] - .2, t, 40);
    const f3 = 1 - prog(t, SC[4] - .45, SC[4] - .2), r = wt('rapido', 3), c = wt('custa', 3);
    neon3d(P.chip, cx0, 790, 170 * back(prog(t, wt('flash', 3), wt('flash', 3) + .5)), .4 * Math.sin(t * .9), .3, CI, prog(t, wt('flash', 3), wt('flash', 3) + .3) * f3);
    selo('quase 3x mais rápido', cx0, 1000, prog(t, r - .5, r - .2), CI, f3);
    barra(cx0, 1130, 640, 'custo antes', 1, prog(t, c - .3, c + .2) * f3, IN);
    barra(cx0, 1250, 640, 'custo agora: 70% menos', .3, prog(t, wt('70', 3) - .2, wt('70', 3) + .3) * f3, CI);
    linhaTxt('segundo a empresa', 1360, wt('segundo', 3), SC[4] - .2, t, 30, 'rgba(244,248,255,.7)');
    fonte('Fonte: MiniMax (blog oficial, 19/10)', SC[3] + .4, SC[4] - .2, t);
  },
  // 4 · Gemini no Planilhas para iPhone
  (t, lt) => {
    numero(3, 300, SC[4], SC[5] - .2, t);
    frase('Gemini no Planilhas Google', 470, wt('gemini', 4) - .1, SC[5] - .2, 70, { t, hot: 'Planilhas', cor: CI });
    linhaTxt('no iPhone e no iPad', 580, wt('iphone', 4) - .2, SC[5] - .2, t, 40, CI);
    const f4 = 1 - prog(t, SC[5] - .45, SC[5] - .2), pg = wt('pergunta', 4), gr = wt('graficos', 4);
    celular(cx0, 960, .55, .12 * Math.sin(t * .6), prog(t, wt('iphone', 4), wt('iphone', 4) + .4) * f4, (x, y, w, s) => {
      let yy = y; yy += msg(x, yy, w, 'Qual mês vendeu mais?', true, prog(t, pg, pg + .3), s);
      const a = prog(t, gr, gr + .4); if (a > 0) { ctx.save(); ctx.globalAlpha *= a; const hs = [.4, .65, .5, .9, .7];
        hs.forEach((h, i) => { ctx.fillStyle = i === 3 ? CI : AZ; rr(x + 20 * s + i * (w - 40 * s) / 5, yy + 260 * s - 240 * s * h * a, (w - 40 * s) / 5 - 14 * s, 240 * s * h * a, 6 * s); ctx.fill(); }); ctx.restore(); }
    }, 'Planilhas', AZ);
    exemplo(cx0, 1300, prog(t, pg, pg + .3) * f4);
    selo('só planos pagos', cx0, 1390, prog(t, wt('pagos', 4) - .4, wt('pagos', 4) - .1), IN, f4);
    selo('chegando aos poucos', cx0, 1470, prog(t, wt('poucos', 4) - .5, wt('poucos', 4) - .2), CI, f4);
    fonte('Fonte: Google Workspace Updates (15/10)', SC[4] + .4, SC[5] - .2, t);
  },
  // 5 · teste hoje
  (t, lt) => {
    frase('Teste hoje', 300, wt('qual', 5) - .1, SC[6] - .2, 80, { t, hot: 'hoje', cor: CI });
    const a = prog(lt, .2, .5); if (a > 0) { ctx.save(); ctx.globalAlpha *= a;
      const lines = wrap(PEDIDO, 700, ARC, 46, 600), h = lines.length * 64 + 120;
      ctx.shadowColor = hex(CI, .5); ctx.shadowBlur = 40; ctx.fillStyle = 'rgba(10,30,60,.9)'; rr(cx0 - 400, 470, 800, h, 30); ctx.fill(); ctx.shadowBlur = 0;
      ctx.strokeStyle = CI; ctx.lineWidth = 3; rr(cx0 - 400, 470, 800, h, 30); ctx.stroke();
      txt('PEÇA NO CHAT DO MERCURY (ESTÁ NA LEGENDA)', cx0 - 350, 520, ARC, 24, CI, { weight: 600, ls: 2 });
      lines.forEach((l, i) => txt(l, cx0 - 350, 590 + i * 64, ARC, 46, BR, { weight: 600, alpha: prog(t, SC[5] + .3 + i * .25, SC[5] + .6 + i * .25) }));
      ctx.restore();
      const vv = wt('velocidade', 5);
      painel(cx0, 470 + h + 60, 600, 'veja a velocidade', 'dif', prog(t, vv - .3, vv + .1), (t - vv) / .8, CI);
    }
  },
  // 6 · logo + chamada
  (t, lt) => fim(t, lt, 'Siga o Radar IA', 'todo dia às 12h'),
];
</script></body></html>
