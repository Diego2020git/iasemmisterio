<!doctype html>
<html><head><meta charset="utf-8">
<style>

<img id="logo" src="marca/logo.png" style="display:none">
<canvas id="c" width="1080" height="1920"></canvas>
<script src="audio/2026-10-18-radar-ia-60s.tempos.js"></script>
<script src="raiox-kit.js"></script>
<script src="neon-kit.js"></script>
<script src="neon-extra.js"></script>
<script>
// 18/10/2026 · 12h · Radar IA #3 (60 s): skills no Gemini, notebooks NVIDIA RTX Spark, voz criada por texto na API da OpenAI. Neon.
const T0 = TEMPOS.cenas;
const SC = [T0[0], T0[1], T0[2], T0[3], T0[4], T0[5], T0[6], T0[7] + .7];
const DURATION = SC[7], IMPACTO = SC[6] + .4;
const COR = [AZ, CI, AZ, IN, CI, AZ, AZ];
const HITS = [wt('skills', 0), wt('nvidia', 0), wt('voz', 0), wt('radar', 1), wt('skills', 2), wt('assinatura', 2), wt('rtx', 3), wt('128', 3), wt('dolares', 3), wt('voz', 4), wt('gratis', 4), wt('legenda', 5)];
const CLIQUES = [];
const CK = [[0, 0, 0, 0, 0]];
const PEDIDO = 'Crie uma skill que transforma qualquer texto que eu colar numa lista de tarefas com prazo.';
function fonte(str, t0, t1, t) { linhaTxt(str, 1560, t0, t1, t, 28, 'rgba(244,248,255,.6)'); }
// orbe de voz pulsando (ilustração, sem rótulo de botão)
function orbe(x, y, r, t, a) { if (a <= 0) return; ctx.save(); ctx.globalAlpha *= clamp(a);
  for (let i = 3; i >= 0; i--) { const rr2 = r * (1 + .18 * i + .06 * Math.sin(t * 5 + i)); ctx.strokeStyle = hex(CI, .25 + .15 * (3 - i)); ctx.lineWidth = 6; ctx.beginPath(); ctx.arc(x, y, rr2, 0, 7); ctx.stroke(); }
  const g = ctx.createRadialGradient(x, y, 0, x, y, r); g.addColorStop(0, '#bff8ff'); g.addColorStop(1, AZ); ctx.fillStyle = g; ctx.shadowColor = CI; ctx.shadowBlur = 40; ctx.beginPath(); ctx.arc(x, y, r, 0, 7); ctx.fill(); ctx.restore(); }
function macStudio(x, y, a, rot) { if (a <= 0) return; ctx.save(); ctx.globalAlpha *= clamp(a); ctx.translate(x, y); ctx.scale(back(clamp(a)), back(clamp(a)));
  ctx.fillStyle = 'rgba(200,215,235,.95)'; rr(-130, -80, 260, 160, 30); ctx.fill(); ctx.strokeStyle = CI; ctx.lineWidth = 3; ctx.shadowColor = CI; ctx.shadowBlur = 20; rr(-130, -80, 260, 160, 30); ctx.stroke(); ctx.shadowBlur = 0;
  ctx.fillStyle = '#7a8aa3'; for (let i = 0; i < 2; i++) { ctx.beginPath(); ctx.arc(-80 + i * 30, 40, 8, 0, 7); ctx.fill(); }
  txt('512 GB', 0, -10, ARC, 40, AZ, { align: 'center', weight: 600 }); ctx.restore(); }
function notebook(x, y, a, t) { if (a <= 0) return; ctx.save(); ctx.globalAlpha *= clamp(a); ctx.translate(x, y); const e = back(clamp(a)); ctx.scale(e, e);
  ctx.shadowColor = CI; ctx.shadowBlur = 30; ctx.fillStyle = 'rgba(10,30,60,.95)'; rr(-260, -200, 520, 320, 22); ctx.fill(); ctx.strokeStyle = CI; ctx.lineWidth = 4; rr(-260, -200, 520, 320, 22); ctx.stroke(); ctx.shadowBlur = 0;
  ctx.fillStyle = 'rgba(200,215,235,.9)'; ctx.beginPath(); ctx.moveTo(-320, 130); ctx.lineTo(320, 130); ctx.lineTo(290, 170); ctx.lineTo(-290, 170); ctx.closePath(); ctx.fill();
  ctx.restore(); neon3d(P.chip, x, y - 45, 90, .4 * Math.sin(t * .9), .3, CI, a); }
const S = [
  // 0 · gancho
  (t, lt) => {
    linhaTxt('RADAR IA · 18/10', 300, -1, SC[1] - .2, t, 34, CI);
    frase('Gemini com skills grátis', 620, -1, SC[1] - .2, 72, { t, hot: 'skills grátis', cor: CI });
    frase('notebook que roda IA', 860, wt('nvidia', 0) - .1, SC[1] - .2, 72, { t, hot: 'roda IA' });
    frase('voz criada por texto', 1100, wt('criar', 0) - .1, SC[1] - .2, 72, { t, hot: 'por texto', cor: CI });
  },
  // 1 · o que é o radar
  (t, lt) => {
    neon3d(P.radar, cx0, cy0 - 90, 220 * back(prog(lt, .05, .5)), .4 * Math.sin(t * .9), .3, CI, prog(lt, .05, .3));
    frase('Radar IA', cy0 + 230, wt('radar', 1) - .1, SC[2] - .2, 100, { t, hot: 'IA', cor: CI });
    frase('as 3 notícias de hoje', cy0 + 350, wt('tres', 1) - .1, SC[2] - .2, 56, { t, hot: '3 notícias' });
  },
  // 2 · skills no Gemini
  (t, lt) => {
    numero(1, 300, SC[2], SC[3] - .2, t);
    frase('Skills no Gemini', 470, wt('skills', 2) - .1, SC[3] - .2, 80, { t, hot: 'Skills', cor: CI });
    linhaTxt('instrução que você salva uma vez', 590, wt('instrucoes', 2), SC[3] - .2, t, 42);
    const e = wt('exemplo', 2), f2 = 1 - prog(t, SC[3] - .45, SC[3] - .2);
    celular(cx0, 1000, .6, .12 * Math.sin(t * .6), prog(t, wt('salva', 2), wt('salva', 2) + .4) * f2, (x, y, w, s) => {
      let yy = y; yy += msg(x, yy, w, 'Resuma este e-mail', true, prog(t, e, e + .3), s);
      yy += msg(x, yy, w, 'Assunto, pedido e prazo, em 3 linhas', false, prog(t, e + .6, e + 1), s);
      yy += msg(x, yy, w, 'Resuma este outro', true, prog(t, e + 1.4, e + 1.7), s);
      msg(x, yy, w, '• Mesmo formato, sempre', false, prog(t, e + 2, e + 2.4), s);
    }, 'Gemini', AZ);
    exemplo(cx0, 1340, prog(t, e, e + .3) * f2);
    const a = wt('assinatura', 2);
    selo('sem assinatura', cx0, 1410, prog(t, a - .3, a), CI, f2);
    selo('chegando até novembro', cx0, 1490, prog(t, wt('novembro', 2) - .5, wt('novembro', 2) - .2), IN, f2);
    fonte('Fonte: Google (Workspace Updates e Central de Ajuda)', SC[2] + .4, SC[3] - .2, t);
  },
  // 3 · NVIDIA RTX Spark
  (t, lt) => {
    numero(2, 300, SC[3], SC[4] - .2, t);
    frase('NVIDIA RTX Spark', 470, wt('nvidia', 3) - .1, SC[4] - .2, 80, { t, hot: 'RTX Spark', cor: CI });
    const f3 = 1 - prog(t, SC[4] - .45, SC[4] - .2);
    notebook(cx0, 820, prog(t, wt('notebooks', 3), wt('notebooks', 3) + .5) * f3, t);
    selo('IA no próprio aparelho', cx0, 1090, prog(t, wt('aparelho', 3) - .3, wt('aparelho', 3)), CI, f3);
    selo('sem internet', cx0 - 200, 1190, prog(t, wt('internet', 3) - .3, wt('internet', 3)), CI, f3);
    selo('até 128 GB', cx0 + 220, 1190, prog(t, wt('128', 3) - .1, wt('128', 3) + .2), CI, f3);
    frase('mais de US$ 2 mil', 1360, wt('custam', 3) - .1, SC[4] - .2, 70, { t, hot: 'US$ 2 mil' });
    fonte('Fonte: NVIDIA, 16/10 (preço nos EUA, varia por região)', SC[3] + .4, SC[4] - .2, t);
  },
  // 4 · OpenAI: voz criada por texto
  (t, lt) => {
    numero(3, 300, SC[4], SC[5] - .2, t);
    frase('Voz criada por texto', 470, SC[4] + .3, SC[5] - .2, 76, { t, hot: 'por texto', cor: CI });
    linhaTxt('na API da OpenAI · API = acesso pra programadores', 580, wt('acesso', 4) - .2, SC[5] - .2, t, 32, CI);
    const d = wt('descreve', 4), a = prog(t, d, d + .4), f4 = 1 - prog(t, SC[5] - .45, SC[5] - .2);
    if (a > 0) { ctx.save(); ctx.globalAlpha *= a * f4; ctx.fillStyle = 'rgba(10,30,60,.9)'; rr(cx0 - 380, 660, 760, 150, 26); ctx.fill(); ctx.strokeStyle = CI; ctx.lineWidth = 3; rr(cx0 - 380, 660, 760, 150, 26); ctx.stroke();
      txt('DESCRIÇÃO DA VOZ (EXEMPLO)', cx0 - 340, 700, ARC, 22, CI, { weight: 600, ls: 2 });
      txt('"voz grave, calma, de locutor de rádio"', cx0 - 340, 760, ARC, 38, BR, { weight: 600 }); ctx.restore(); }
    orbe(cx0, 1000, 110, t, prog(t, wt('criada', 4), wt('criada', 4) + .5) * f4);
    selo('criar: grátis', cx0 - 200, 1260, prog(t, wt('gratis', 4) - .3, wt('gratis', 4)), CI, f4);
    selo('usar: pago', cx0 + 200, 1260, prog(t, wt('usar', 4) - .1, wt('usar', 4) + .2), IN, f4);
    fonte('Fonte: OpenAI (changelog da API, 16/10)', SC[4] + .4, SC[5] - .2, t);
  },
  // 5 · teste hoje
  (t, lt) => {
    frase('Teste hoje, de graça', 300, wt('qual', 5) - .1, SC[6] - .2, 80, { t, hot: 'de graça', cor: CI });
    const a = prog(lt, .2, .5); if (a > 0) { ctx.save(); ctx.globalAlpha *= a;
      const lines = wrap(PEDIDO, 700, ARC, 46, 600), h = lines.length * 64 + 120;
      ctx.shadowColor = hex(CI, .5); ctx.shadowBlur = 40; ctx.fillStyle = 'rgba(10,30,60,.9)'; rr(cx0 - 400, 470, 800, h, 30); ctx.fill(); ctx.shadowBlur = 0;
      ctx.strokeStyle = CI; ctx.lineWidth = 3; rr(cx0 - 400, 470, 800, h, 30); ctx.stroke();
      txt('PEÇA AO GEMINI (ESTÁ NA LEGENDA)', cx0 - 350, 520, ARC, 24, CI, { weight: 600, ls: 2 });
      lines.forEach((l, i) => txt(l, cx0 - 350, 590 + i * 64, ARC, 46, BR, { weight: 600, alpha: prog(t, SC[5] + .3 + i * .25, SC[5] + .6 + i * .25) }));
      ctx.restore();
      neon3d(P.check, cx0, 470 + h + 200, 120 * back(prog(t, wt('lista', 5), wt('lista', 5) + .4)), .4 * Math.sin(t * .9), .3, CI, prog(t, wt('lista', 5), wt('lista', 5) + .3));
      linhaTxt('se a função já chegou pra você', 470 + h + 380, wt('pedido', 5), SC[6] - .2, t, 40);
    }
  },
  // 6 · logo + chamada
  (t, lt) => fim(t, lt, 'Siga o Radar IA', 'todo dia às 12h'),
];
</script></body></html>
