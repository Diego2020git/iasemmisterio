<!doctype html>
<html><head><meta charset="utf-8">
<style>
@font-face{font-family:"AX";src:url(fontes/ArchivoExpanded-ExtraBold.ttf);font-weight:800}
@font-face{font-family:"AR";src:url(fontes/Archivo-SemiBold.ttf);font-weight:600}
html,body{margin:0;background:#000}canvas{display:block}
</style></head><body>
<canvas id="c" width="1080" height="1920"></canvas>
<script src="audio/2026-10-12-12h-qual-ia-usar.tempos.js"></script>
<script src="raiox-kit.js"></script>
<script src="raiox-motion.js"></script>
<script>
// 12/10/2026 · Faça com IA (versão curta pelas diretrizes de retenção) · qual IA usar pra cada tarefa (ChatGPT, Gemini, NotebookLM, Flow). Tempos em TEMPOS (voz.py).
const EP = '16';
const SC = TEMPOS.cenas, CAPS = TEMPOS.frases;
const TOOLS = [['ChatGPT', 'chatgpt.com', '#10a37f', 'TEXTO'], ['Gemini', 'gemini.google.com', '#4285f4', 'IMAGEM'], ['NotebookLM', 'notebooklm.google', '#4285f4', 'ESTUDO'], ['Flow', 'labs.google/flow', '#4285f4', 'VÍDEO']];
// ícone em traço de cada tarefa, desenhado dentro de um quadrado (k = índice da tarefa)
function taskIcon(k, cx, cy, r, p, color = COL.ink) {
  if (p <= 0) return;
  ctx.save(); ctx.strokeStyle = color; ctx.lineWidth = 5; ctx.lineJoin = 'round';
  if (k === 0) { ctx.translate(cx, cy); page(-r * .6, -r * .8, r * 1.2, r * 1.6, p); }
  if (k === 1) { draw(p, 8 * r, () => { ctx.strokeRect(cx - r * .8, cy - r * .6, r * 1.6, r * 1.2); ctx.beginPath(); ctx.moveTo(cx - r * .8, cy + r * .5); ctx.lineTo(cx - r * .2, cy - r * .1); ctx.lineTo(cx + r * .2, cy + r * .25); ctx.lineTo(cx + r * .5, cy - r * .05); ctx.lineTo(cx + r * .8, cy + r * .4); ctx.stroke(); ctx.beginPath(); ctx.arc(cx + r * .4, cy - r * .3, r * .14, 0, 7); ctx.stroke(); }); }
  if (k === 2) draw(p, 10 * r, () => { ctx.strokeRect(cx - r * .7, cy - r * .8, r * 1.4, r * 1.6); ctx.beginPath(); ctx.moveTo(cx - r * .5, cy - r * .8); ctx.lineTo(cx - r * .5, cy + r * .8); for (let j = 0; j < 3; j++) { ctx.moveTo(cx - r * .3, cy - r * .3 + j * r * .3); ctx.lineTo(cx + r * .5, cy - r * .3 + j * r * .3); } ctx.stroke(); }); // caderno reto, sem perspectiva
  if (k === 3) strokeShape(morph(shape('rect', cx, cy, 0, { w: r * 1.6, h: r * 1.2 }), shape('play', cx + r * .1, cy, r * .7), prog(p, .5, 1)), { color, lw: 5, p: clamp(p * 2) });
  ctx.restore();
}

// 0 · gancho (versão curta, 12/10): o quadro 1 já mostra o resultado, as 4 tarefas com a IA certa de cada uma
CAMS[0] = () => [[0, 0, 30, 1.04, 0], [cue('tarefa'), 0, 0, 1, 0]];
function s0(t, lt) {
  kinetic([{ w: 'A IA certa', t: cue('certa') }, { w: 'pra cada', t: cue('cada') }, { w: 'tarefa', t: cue('tarefa') }], M, 230, lt, { size: 84, hl: [0], maxW: 900 });
  const hot = Math.floor(lt / .7) % 4; // as tarefas acendem em sequência: o quadro nunca fica parado
  TOOLS.forEach((tl, k) => {
    const x = k % 2 ? W / 2 + 20 : M, y = k < 2 ? 540 : 910, w = W / 2 - M - 20, h = 290;
    panel(x, y, w, h, 1, tl[3]);
    taskIcon(k, x + w / 2, y + 120, 60, 1, k === hot ? COL.cyan : COL.ink);
    txt(tl[0], x + w / 2, y + 245, EXP, tl[0].length > 8 ? 36 : 44, k === hot ? COL.cyan : COL.ink, { align: 'center' });
  });
  stamp(W / 2, 1300, 'todas com plano grátis', prog(lt, cue('existe', 2), cue('existe', 2) + .3), 34);
}
// cena de ferramenta: título com a tarefa, ícone grande que reage à fala e selo da ferramenta
function toolScene(k, lt, w1, w2, extra) {
  title([TOOLS[k][3]], lt, 0, 200, 92, 0);
  taskIcon(k, W / 2, 640, 170, prog(lt, cue(w1) - .3, cue(w1) + .6), COL.ink);
  toolCard(W / 2, 980, TOOLS[k][0], TOOLS[k][1] + ' · tem plano grátis', prog(lt, cue(w2) - .2, cue(w2) + .2), TOOLS[k][2]);
  extra && extra();
}
CAMS[1] = () => [[0, 0, 0, 1, 0], [cue('chatgpt'), 0, 30, 1.04, 0]];
function s1(t, lt) {
  toolScene(0, lt, 'texto', 'chatgpt', () => {
    const p = prog(lt, cue('email') - .1, cue('chatgpt') + .8);
    if (p > 0) promptBox(M, 1120, W - 2 * M, 'Escreve um e-mail pro cliente.', p, t, 'você pede');
  });
}
CAMS[2] = () => [[0, 0, 0, 1, 0], [cue('google'), 0, 30, 1.04, 0]];
function s2(t, lt) {
  toolScene(1, lt, 'imagem', 'gemini', () => {
    const d = prog(lt, cue('google') - .2, cue('google') + .5);
    if (d > 0) { ctx.save(); ctx.globalAlpha = d; ctx.fillStyle = 'rgba(46,230,255,.18)'; ctx.fillRect(W / 2 - 136, 640 - 102, 272 * d, 204); ctx.restore(); }
    dimLine(M, W - M, 1150, 'imagem em segundos', prog(lt, cue('google'), cue('google') + .3));
  });
}
CAMS[3] = () => [[0, 0, 0, 1, 0], [cue('notebooklm'), 0, 30, 1.04, 0]];
function s3(t, lt) {
  toolScene(2, lt, 'estudar', 'notebooklm', () => {
    annot(W / 2 + 120, 580, 900, 400, 'o seu material', prog(lt, cue('material') - .1, cue('material') + .3), 'L', COL.cyan);
    dimLine(M, W - M, 1150, 'responde com a fonte', prog(lt, cue('notebooklm'), cue('notebooklm') + .3));
  });
}
CAMS[4] = () => [[0, 0, 0, 1, 0], [cue('google'), 0, 30, 1.04, 0]];
function s4(t, lt) {
  toolScene(3, lt, 'vídeo', 'flow', () => {
    dimLine(M, W - M, 1150, 'do texto ao vídeo', prog(lt, cue('google'), cue('google') + .3));
  });
}
// 5 · fecha: as 4 ferramentas, carimbo grátis, card final
CAMS[5] = () => [[0, 0, 30, 1.04, 0], [cue('salva'), 0, 0, 1, 0]];
function s5(t, lt) {
  kinetic([{ w: 'Plano', t: cue('plano') }, { w: 'grátis', t: cue('grátis') }], M, 230, lt, { size: 96, hl: [1], maxW: 900 });
  TOOLS.forEach((tl, k) => {
    const x = k % 2 ? W / 2 + 20 : M, y = k < 2 ? 480 : 700, w = W / 2 - M - 20, h = 170, p = prog(lt, k * .12, k * .12 + .4);
    panel(x, y, w, h, p, tl[3]);
    txt(tl[0], x + w / 2, y + h / 2 + 15, EXP, tl[0].length > 8 ? 36 : 46, COL.ink, { align: 'center', alpha: p });
  });
  stamp(W / 2, 1000, 'as quatro de graça', prog(lt, cue('grátis') - .1, cue('grátis') + .25), 38);
  endCard(t, SC[5] + cue('salva') - .25);
}
const SCENES = [s0, s1, s2, s3, s4, s5];
window.DURATION = TEMPOS.duracao;
</script>
</body></html>
