<!doctype html>
<html><head><meta charset="utf-8">
<style>
@font-face{font-family:"AX";src:url(fontes/ArchivoExpanded-ExtraBold.ttf);font-weight:800}
@font-face{font-family:"AR";src:url(fontes/Archivo-SemiBold.ttf);font-weight:600}
html,body{margin:0;background:#000}canvas{display:block}
</style></head><body>
<canvas id="c" width="1080" height="1920"></canvas>
<script src="audio/2026-10-15-12h-formula-planilha.tempos.js"></script>
<script src="raiox-kit.js"></script>
<script src="raiox-motion.js"></script>
<script>
// 15/10/2026 · Faça com IA · fórmula de planilha com o ChatGPT. Tempos em TEMPOS (voz.py).
const EP = '21';
const SC = TEMPOS.cenas, CAPS = TEMPOS.frases;
const ROWS = [['Bolo', '40', '3'], ['Torta', '55', '2'], ['Pão', '8', '12']];
// planilha em traço: colunas A a D, cabeçalho e 3 linhas; colA/D acendem; fill = quanto da coluna D já foi calculada
function sheet(x, y, a, hi = -1, fill = 0) {
  if (a <= 0) return;
  const cw = 220, ch = 90, cols = ['A', 'B', 'C', 'D'], head = ['produto', 'preço', 'qtd', 'total'];
  ctx.save(); ctx.globalAlpha = clamp(a * 1.5); ctx.lineWidth = 3;
  cols.forEach((c, i) => {
    const on = i === hi;
    txt(c, x + i * cw + cw / 2, y - 20, EXP, 34, on ? COL.cyan : COL.dim, { align: 'center' });
    for (let j = 0; j < 4; j++) {
      const p = prog(a, .2 + (i + j) * .05, .5 + (i + j) * .05);
      ctx.strokeStyle = on ? COL.cyan : COL.dim; ctx.globalAlpha = p; ctx.strokeRect(x + i * cw, y + j * ch, cw, ch);
      const v = j === 0 ? head[i] : i < 3 ? ROWS[j - 1][i] : (fill >= j / 3 ? String(ROWS[j - 1][1] * ROWS[j - 1][2]) : '');
      if (v) txt(v, x + i * cw + cw / 2, y + j * ch + 58, ARC, j === 0 ? 26 : 36, j === 0 ? COL.dim : (i === 3 ? COL.cyan : COL.ink), { align: 'center', weight: 600, alpha: p });
    }
  });
  ctx.restore();
}
const SX = (W - 880) / 2;

// 0 · gancho (versão curta, 12/10): no quadro 1 a planilha já está calculada e a fórmula pronta
CAMS[0] = () => [[0, 0, 30, 1.04, 0], [cue('chatgpt'), 0, 0, 1, 0]];
function s0(t, lt) {
  kinetic([{ w: 'Fórmula', t: cue('fórmula') }, { w: 'sem decorar', t: cue('decorar') }], M, 230, lt, { size: 84, hl: [1], maxW: 1000 });
  panel(M, 460, W - 2 * M, 150, 1, 'célula D2');
  txt('=B2*C2', M + 40, 560, EXP, 72, COL.cyan);
  sheet(SX, 740, 1, 3, 1);
  toolCard(W / 2, 1260, 'ChatGPT', 'chatgpt.com · tem plano grátis', prog(lt, cue('chatgpt') - .1, cue('chatgpt') + .25), '#10a37f');
}
// 1 · explica as colunas: cada uma acende quando é falada
CAMS[1] = () => [[0, 0, 0, 1, 0], [cue('c'), 0, 30, 1.04, 0]];
function s1(t, lt) {
  title(['Explica'], lt, 0, 200, 92, 0);
  const hi = lt > cue('c') - .1 ? 2 : lt > cue('b') - .1 ? 1 : lt > cue('a') - .1 ? 0 : -1;
  sheet(SX, 520, prog(lt, 0, .6), hi);
  promptBox(M, 1000, W - 2 * M, 'A: produto. B: preço. C: quantidade.', spoken(t, 1), t, 'você explica');
}
// 2 · pede o total: a fórmula chega digitada e a coluna D se preenche
CAMS[2] = () => [[0, 0, 0, 1, 0], [cue('devolve'), 0, 30, 1.04, 0]];
function s2(t, lt) {
  title(['A fórmula'], lt, 0, 200, 92, 0);
  const f = prog(lt, cue('devolve') - .1, cue('devolve') + .8);
  panel(M, 380, W - 2 * M, 180, prog(lt, 0, .4), 'célula D2');
  txt(typed('=B2*C2', f), M + 40, 500, EXP, 80, COL.cyan);
  sheet(SX, 720, prog(lt, 0, .6), lt > cue('d') - .1 ? 3 : -1, prog(lt, cue('devolve') + .4, cue('devolve') + 1.4));
}
// 3 · deu erro: a mensagem vira correção
CAMS[3] = () => [[0, 0, 0, 1, 0], [cue('corrige'), 0, 30, 1.04, 0]];
function s3(t, lt) {
  title(['Deu erro?'], lt, 0, 200, 92, 0);
  const e = prog(lt, 0, .3), c = prog(lt, cue('corrige') - .1, cue('corrige') + .4);
  panel(M, 450, W - 2 * M, 160, e, 'mensagem');
  txt('#VALOR!', M + 40, 555, EXP, 64, COL.red, { alpha: e * (1 - c) });
  txt('=B2*C2 ✓', M + 40, 555, EXP, 64, COL.cyan, { alpha: c });
  sheet(SX, 760, prog(lt, 0, .4), 3, c);
}
// 4 · fecha: prompt na legenda; card final
CAMS[4] = () => [[0, 0, 30, 1.04, 0], [cue('legenda'), 0, 0, 1, 0]];
function s4(t, lt) {
  kinetic([{ w: 'Prompt', t: cue('prompt') }, { w: 'na legenda', t: cue('legenda') }], M, 230, lt, { size: 80, hl: [1], maxW: 1000 });
  sheet(SX, 600, prog(lt, 0, .4), 3, 1);
  endCard(t, SC[4] + cue('salva') - .25);
}
const SCENES = [s0, s1, s2, s3, s4];
window.DURATION = TEMPOS.duracao;
</script>
</body></html>
