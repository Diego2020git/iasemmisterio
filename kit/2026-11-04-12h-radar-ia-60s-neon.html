<script>
// 04/11/2026 · 12h · Radar IA #20 (57 s): Siri AI aberta a desenvolvedores, Google desliga IA pra alunos K-12 + Guided Learning, dots com GPT-6.1 Terra. Neon + neon-entrega.js.
// Fontes: developer.apple.com (Siri AI is now open to all developers), blog.google (Responsible AI for schools with Guided Learning), openai.com (Introducing dots, update 03/11).
const T0 = TEMPOS.cenas;
const SC = [T0[0], T0[1], T0[2], T0[3], T0[4], T0[5], T0[6], T0[7], T0[8], T0[9] + .7];
const DURATION = SC[9], IMPACTO = SC[8] + .4;
const COR = [AZ, CI, AZ, AZ, VERDE, VERDE, AMB, CI, AZ];
const HITS = [wt('siri', 0), wt('desligou', 0), wt('novo', 0), wt('radar', 1), wt('siri', 2), wt('desenvolvedor', 2), wt('acoes', 3), wt('meses', 3), wt('aluno', 4), wt('desligados', 4), wt('ligar', 4), wt('guided', 5), wt('pronta', 5), wt('dots', 6), wt('terra', 6), wt('premium', 6), wt('ensinar', 7)];
const CLIQUES = [];
const CK = [[0, 0, 0, 0, 0], [DURATION, 0, 0, 0, 0]];
const S = [
  // 0 · gancho
  (t, lt) => {
    linhaTxt('RADAR IA · 04/11', 330, -1, SC[1] - .2, t, 40, CI);
    versao('SIRI ABERTA PROS APPS', cx0, 560, prog(t, -1, .1), AZ, 0, 40);
    versao('IA DESLIGADA PRA ALUNOS', cx0, 820, prog(t, wt('google', 0) - .2, wt('google', 0) + .2), VERDE, 0, 38);
    versao('AGENTES COM MODELO NOVO', cx0, 1080, prog(t, wt('agentes', 0) - .2, wt('agentes', 0) + .2), AMB, 0, 38);
  },
  // 1 · radar
  (t, lt) => {
    neon3d(P.radar, cx0, 700, 230 * back(prog(lt, .05, .4)), .4 * Math.sin(t * .9), .3, CI, prog(lt, .05, .25));
    titulo('RADAR IA', 1050, SC[1], SC[2] - .2, t, 110, BR, 'IA', CI);
  },
  // 2 · Siri aberta
  (t, lt) => {
    numero(1, 300, SC[2], SC[3] - .2, t);
    titulo('SIRI PRA TODO APP', 450, wt('apple', 2) - .2, SC[3] - .2, t, 76, BR, 'SIRI', AZ);
    neon3d(P.balao, cx0, 700 + flut(t), 120 * back(prog(t, wt('siri', 2) - .4, wt('siri', 2))), .4 * Math.sin(t * .8), .1, AZ, prog(t, wt('siri', 2) - .4, wt('siri', 2)));
    pilula('qualquer desenvolvedor', cx0, 940, 600, prog(t, wt('qualquer', 2) - .2, wt('desenvolvedor', 2) + .2), AZ, 'APPLE', 1, 40);
    pilula('versão de teste · iOS 27.3', cx0, 1110, 640, prog(t, wt('teste', 2) - .2, wt('tres', 2) + .2), AMB, 'POR ENQUANTO', 1, 38);
  },
  // 3 · o que muda
  (t, lt) => {
    titulo('O APP DENTRO DA SIRI', 380, SC[3], SC[4] - .2, t, 66, BR, 'SIRI', AZ);
    celular(cx0 - 200, 860, .7, .12 * Math.sin(t * .6), prog(lt, .05, .35), (x, y, w, s) => {
      const q = prog(t, wt('acoes', 3) - .3, wt('acoes', 3) + .1);
      ctx.fillStyle = '#e4ebff'; rr(x + w * .15, y + 40 * s, w * .85, 100 * s, 18 * s); ctx.fill();
      txt('Pede um café no app', x + w * .15 + 18 * s, y + 98 * s, ARC, 24 * s, '#1b2440', { weight: 700 });
      ctx.save(); ctx.globalAlpha *= clamp(q); ctx.fillStyle = '#ffffff'; rr(x, y + 170 * s, w * .9, 150 * s, 18 * s); ctx.fill();
      txt('Pedido feito ✓', x + 20 * s, y + 230 * s, ARC, 26 * s, '#1e7e45', { weight: 800 });
      ctx.fillStyle = '#c9d3ea'; rr(x + 20 * s, y + 262 * s, w * .55, 18 * s, 9 * s); ctx.fill(); ctx.restore(); }, 'Siri', AZ);
    exemplo(cx0 - 200, 1290, prog(lt, .3, .6));
    pilula('conteúdo', cx0 + 260, 700, 300, prog(t, wt('conteudo', 3) - .2, wt('conteudo', 3) + .2), AZ, '', 1, 38);
    pilula('ações', cx0 + 260, 860, 300, prog(t, wt('acoes', 3) - .2, wt('acoes', 3) + .2), AZ, '', 1, 38);
    pilula('público: em meses', cx0 + 260, 1020, 340, prog(t, wt('publico', 3) - .2, wt('meses', 3) + .2), AMB, '', 1, 32);
  },
  // 4 · IA desligada pra alunos
  (t, lt) => {
    numero(2, 300, SC[4], SC[5] - .2, t);
    titulo('IA DESLIGADA PRA ALUNO', 450, wt('contas', 4) - .2, SC[5] - .2, t, 64, BR, 'DESLIGADA', VERDE);
    [['Gemini', 'gemini'], ['Notebook', 'notebook'], ['IA da busca', 'busca']].forEach(([n, k], i) => {
      const q = prog(t, wt(k, 4) - .2, wt(k, 4) + .2), off = prog(t, wt('desligados', 4) - .2, wt('desligados', 4) + .2);
      pilula(n + (off > .5 ? '  ·  off' : ''), cx0, 640 + i * 150, 520, q, off > .5 ? VERM : VERDE, '', 1, 40); });
    pilula('até a escola ligar', cx0, 1120, 700, prog(t, wt('escola', 4) - .2, wt('ligar', 4) + .2), AMB, 'CONTA DE ALUNO · EDUCAÇÃO BÁSICA', 1, 42);
  },
  // 5 · Guided Learning
  (t, lt) => {
    titulo('GUIDED LEARNING', 380, SC[5], SC[6] - .2, t, 80, BR, 'LEARNING', VERDE);
    neon3d(P.seta, cx0, 680 + flut(t), 110 * back(prog(lt, .05, .4)), .4 * Math.sin(t * .8), .1, VERDE, prog(lt, .05, .3));
    ['passo 1', 'passo 2', 'passo 3'].forEach((n, i) => pilula(n, cx0 - 280 + i * 280, 900, 230, prog(t, wt('passo', 5) - .2 + i * .25, wt('passo', 5) + .1 + i * .25), VERDE, '', 1, 34));
    pilula('sem resposta pronta', cx0, 1080, 560, prog(t, wt('vez', 5) - .2, wt('pronta', 5) + .2), CI, 'NO CLASSROOM', 1, 40);
  },
  // 6 · dots com Terra
  (t, lt) => {
    numero(3, 300, SC[6], SC[7] - .2, t);
    titulo('DOTS COM MODELO NOVO', 450, wt('dots', 6) - .2, SC[7] - .2, t, 66, BR, 'DOTS', AMB);
    neon3d(P.relogio, cx0, 700 + flut(t), 110 * back(prog(t, wt('agentes', 6) - .4, wt('agentes', 6))), .4 * Math.sin(t * .8), .1, AMB, prog(t, wt('agentes', 6) - .4, wt('agentes', 6)));
    pilula('agente que trabalha o tempo todo', cx0, 900, 760, prog(t, wt('trabalham', 6) - .2, wt('todo', 6) + .2), AMB, 'NO CHATGPT', 1, 36);
    pilula('+ GPT-6.1 Terra', cx0, 1060, 480, prog(t, wt('terra', 6) - .4, wt('terra', 6) + .2), CI, '', 1, 44);
    pilula('só Pro e Business Premium', cx0, 1220, 640, prog(t, wt('pagos', 6) - .2, wt('premium', 6) + .2), VERM, 'PLANOS PAGOS', 1, 38);
  },
  // 7 · teste hoje
  (t, lt) => {
    titulo('TESTE HOJE', 330, SC[7], SC[8] - .2, t, 90, BR, 'HOJE', CI);
    celular(cx0, 880, .78, .1 * Math.sin(t * .6), prog(t, wt('peca', 7) - .3, wt('peca', 7) + .1), (x, y, w, s) => {
      ctx.fillStyle = '#d9fdd3'; rr(x + w * .15, y + 40 * s, w * .85, 130 * s, 18 * s); ctx.fill();
      txt('Me ensine frações passo', x + w * .15 + 18 * s, y + 90 * s, ARC, 21 * s, '#1b2440', { weight: 700 });
      txt('a passo, sem dar a resposta', x + w * .15 + 18 * s, y + 130 * s, ARC, 21 * s, '#1b2440', { weight: 600 });
      for (let i = 0; i < 3; i++) { const r = prog(t, wt('assunto', 7) + i * .35, wt('assunto', 7) + .25 + i * .35); if (r <= 0) continue;
        ctx.save(); ctx.globalAlpha *= clamp(r); ctx.fillStyle = '#ffffff'; rr(x, y + 210 * s + i * 100 * s, w * .85, 80 * s, 14 * s); ctx.fill();
        txt('Passo ' + (i + 1), x + 20 * s, y + 258 * s + i * 100 * s, EXP, 26 * s, '#1e7e45'); ctx.restore(); } }, 'Chat de IA', CI);
    exemplo(cx0, 1320, prog(t, wt('peca', 7), wt('peca', 7) + .3));
  },
  // 8 · fim
  (t, lt) => fim(t, lt, 'Siga o Radar IA', 'todo dia às 12h'),
];
</script></body></html>
