<!doctype html>
<html><head><meta charset="utf-8">
<style>
@font-face{font-family:"AX";src:url(fontes/ArchivoExpanded-ExtraBold.ttf);font-weight:800}
@font-face{font-family:"AR";src:url(fontes/Archivo-SemiBold.ttf);font-weight:600}
html,body{margin:0;background:#000}canvas{display:block}
</style></head><body>
<img id="logo" src="marca/logo.png" style="display:none">
<canvas id="c" width="1080" height="1920"></canvas>
<script src="audio/2026-10-25-modelos-e-parametros-02-v2.tempos.js"></script>
<script src="raiox-kit.js"></script>
<script src="neon-kit.js"></script>
<script src="neon-extra.js"></script>
<script src="neon-entrega.js"></script>
<script>
// 25/10/2026 · 19h · Modelos e parâmetros #2: janela de contexto (v2 no padrão de entrega de 24/10). Neon + neon-entrega.js.
// Mecanismo: texto vira tokens, o que você manda e o que a IA responde enchem a mesma janela; passou do limite, o começo sai.
// Fontes: ai.google.dev/gemini-api/docs/models/gemini-3.8-flash (1.048.576), ai.google.dev/gemini-api/docs/long-context (8 romances).
const T0 = TEMPOS.cenas;
const SC = [T0[0], T0[1], T0[2], T0[3], T0[4], T0[5], T0[6], T0[7] + .7];
const DURATION = SC[7], IMPACTO = SC[6] + .4;
const CLIQUES = [wt('anexe', 4) + .2, wt('abra', 5) + .2];
const CK = [[0, 0, 0, 0, 0], [DURATION, 0, 0, 0, 0]];
const COR = [AZ, CI, AZ, IN, CI, AZ, AZ];
const HITS = [wt('esquece', 0), wt('janela', 0, 2), wt('contexto', 1), wt('tokens', 2), wt('responde', 2), wt('limite', 3), wt('milhao', 3), wt('romances', 3), wt('contador', 4), wt('novo', 5)];
const PAL_TOK = ['Oi', 'resu', 'ma', 'meu', 'PDF', 'Cla', 'ro', 'o', 'cap', 'ítulo', '1', 'fala', 'de', 'ven', 'das', 'e', 'o', '2', 'de', 'cus', 'tos', 'ago', 'ra', 'compa', 're', 'os', 'dois', 'O', '1', 'é', 'mais', 'cur', 'to', 'e', 'o', '2', 'tem', 'tabe', 'las', 'mos', 'tre', 'a', 'tabe', 'la', 'Aqui', 'es', 'tá'];
const QUEM = i => (i < 5 || (i >= 21 && i < 27) || (i >= 39 && i < 44)) ? AZ : CI; // azul = você, ciano = IA
// janela de contexto: grade de cols x rows; tokens entram em ordem; passou do limite, os primeiros saem (vermelho, caindo)
function janelaCtx(x, y, cols, rows, n, t, a, o = {}) {
  if (a <= 0) return; const cw = 112, ch = 78, gp = 10, w = cols * (cw + gp) + 30, h = rows * (ch + gp) + 30, cap = cols * rows;
  ctx.save(); ctx.globalAlpha *= clamp(a);
  ctx.shadowColor = hex(o.cheio ? VERM : CI, .7); ctx.shadowBlur = 50; ctx.fillStyle = 'rgba(6,10,21,.92)'; rr(x, y, w, h, 26); ctx.fill(); ctx.shadowBlur = 0;
  ctx.strokeStyle = o.cheio ? hex(VERM, .6 + .4 * Math.sin(t * 8)) : CI; ctx.lineWidth = 6; rr(x, y, w, h, 26); ctx.stroke();
  const ini = Math.max(0, Math.floor(n) - cap);
  for (let j = ini; j < Math.floor(n); j++) { const k = j - ini, cx = x + 15 + (k % cols) * (cw + gp), cy = y + 15 + Math.floor(k / cols) * (ch + gp), q = clamp((n - j) * 2), c = QUEM(j % PAL_TOK.length);
    ctx.save(); ctx.globalAlpha *= q; ctx.fillStyle = hex(c, .35); rr(cx, cy, cw, ch, 14); ctx.fill(); ctx.strokeStyle = c; ctx.lineWidth = 3; rr(cx, cy, cw, ch, 14); ctx.stroke();
    txt(PAL_TOK[j % PAL_TOK.length], cx + cw / 2, cy + ch / 2 + 2, ARC, 32, BR, { align: 'center', weight: 600 }); ctx.restore(); }
  for (let j = Math.max(0, ini - 4); j < ini; j++) { const d = ini - j, q = clamp(1 - d / 4);
    ctx.save(); ctx.globalAlpha *= q; const cx = x - 40 - d * 30, cy = y + 15 + d * 60;
    ctx.fillStyle = hex(VERM, .45); rr(cx, cy, cw, ch, 14); ctx.fill(); ctx.strokeStyle = VERM; ctx.lineWidth = 3; rr(cx, cy, cw, ch, 14); ctx.stroke();
    txt(PAL_TOK[j % PAL_TOK.length], cx + cw / 2, cy + ch / 2 + 2, ARC, 32, BR, { align: 'center', weight: 600 }); ctx.restore(); }
  ctx.restore(); return { w, h };
}
function livro(x, y, s, a, cor) { if (a <= 0) return; ctx.save(); ctx.globalAlpha *= clamp(a); ctx.translate(x, y); ctx.scale(s * back(clamp(a)), s * back(clamp(a)));
  ctx.shadowColor = cor; ctx.shadowBlur = 20; ctx.fillStyle = hex(cor, .5); rr(-30, -45, 60, 90, 8); ctx.fill(); ctx.strokeStyle = cor; ctx.lineWidth = 4; rr(-30, -45, 60, 90, 8); ctx.stroke();
  ctx.fillStyle = BR; ctx.fillRect(-18, -25, 36, 5); ctx.fillRect(-18, -12, 26, 5); ctx.restore(); }
const S = [
  // 0 · gancho: a janela enche e o começo cai
  (t, lt) => {
    titulo('POR QUE A IA ESQUECE?', 330, -1, SC[1] - .2, t, 84, BR, 'ESQUECE?', CI);
    janelaCtx(cx0 - 422, 520, 7, 5, 26 + lt * 6, t, prog(lt, 0, .3), { cheio: lt > 1.5 });
    linhaTxt('a janela tem tamanho', 1080 + 0, wt('tamanho', 0) - .4, SC[1] - .2, t, 50, CI);
  },
  // 1 · episódio
  (t, lt) => {
    titulo('JANELA DE CONTEXTO', 620, wt('janela', 1) - .2, SC[2] - .2, t, 88, BR, 'CONTEXTO', CI);
    pilula('Modelos e parâmetros', cx0, 800, 620, prog(t, wt('modelos', 1), wt('modelos', 1) + .3), CI, 'EPISÓDIO 2');
    neon3d(P.chip, cx0, 1060 + flut(t), 120 * back(prog(lt, .2, .6)), .3 * Math.sin(t * .9), .2, CI, prog(lt, .2, .5));
  },
  // 2 · mecanismo: texto vira tokens; você + IA na mesma janela
  (t, lt) => {
    titulo('TEXTO VIRA TOKENS', 300, SC[2], SC[3] - .2, t, 80, BR, 'TOKENS', CI);
    const tk = wt('tokens', 2), sp = prog(t, tk, tk + .6);
    txt('janela', cx0, 470, EXP, 90, BR, { align: 'center', alpha: prog(t, SC[2], SC[2] + .3) * (1 - sp) });
    versao('jan', cx0 - 150 - 60 * sp, 470, sp, CI, 0, 60); versao('ela', cx0 + 150 + 60 * sp, 470, sp, CI, 0, 60);
    linhaTxt('token = pedaço de palavra', 590, wt('pedacos', 2) - .2, SC[3] - .2, t, 44, CI);
    const ma = wt('manda', 2), n = Math.max(0, (t - ma + .3) * 9);
    janelaCtx(cx0 - 422, 680, 7, 4, Math.min(n, 27), t, prog(t, ma - .4, ma), {});
    chipLegenda([['você manda', AZ], ['a IA responde', CI]], 1080, prog(t, wt('responde', 2) - .2, wt('responde', 2) + .2));
    linhaTxt('tudo ocupa a mesma janela', 1180, wt('ocupam', 2) - .2, SC[3] - .2, t, 46);
  },
  // 3 · limite: o começo sai; 1 milhão ≈ 8 romances
  (t, lt) => {
    titulo('PASSOU DO LIMITE', 300, SC[3], SC[4] - .2, t, 84, BR, 'LIMITE', VERM);
    const ml = wt('milhao', 3), f1 = 1 - prog(t, ml - .5, ml - .2);
    janelaCtx(cx0 - 422, 470, 7, 4, 28 + Math.max(0, lt - .3) * 5, t, prog(lt, 0, .3) * f1, { cheio: true });
    linhaTxt('o começo fica de fora', 880, wt('resto', 3) - .2, ml - .5, t, 48, VERM);
    versao('1.048.576 tokens', cx0, 560, prog(t, ml - .3, ml + .1), CI, 0, 64);
    linhaTxt('Gemini 3.8 Flash, número oficial do Google', 690, ml, SC[4] - .2, t, 36, 'rgba(244,248,255,.8)');
    const ro = wt('romances', 3);
    for (let i = 0; i < 8; i++) livro(cx0 - 350 + i * 100, 900 + flut(t, i) * .6, 1.3, prog(t, wt('8', 3) - .2 + i * .08, wt('8', 3) + .1 + i * .08), i % 2 ? CI : AZ);
    linhaTxt('≈ 8 romances inteiros', 1080, ro - .1, SC[4] - .2, t, 52, CI);
  },
  // 4 · teste no AI Studio
  (t, lt) => {
    titulo('TESTE GRÁTIS', 300, SC[4], SC[5] - .2, t, 84, BR, 'GRÁTIS', VERDE);
    janela(430, 560, prog(t, wt('google', 4) - .3, wt('google', 4) + .1), 'Google AI Studio', (x, y, w) => {
      campo(x, y, w, 'Modelo', 'Gemini Flash', 1, 0);
      campo(x, y + 130, w, 'Arquivo', '📄 apostila.pdf', prog(t, wt('pdf', 4) - .2, wt('pdf', 4) + .2), 1);
      const c = prog(t, wt('contador', 4) - .1, wt('ocupa', 4) + .3), v = Math.round(182340 * ease(c));
      if (c > 0) { txt('TOKENS', x, y + 290, ARC, 22, '#5a6a8f', { weight: 600, ls: 2 }); txt(v.toLocaleString('pt-BR') + ' / 1.048.576', x, y + 340, EXP, 44, '#1b2440', {});
        ctx.fillStyle = '#e1e8f8'; rr(x, y + 375, w, 22, 11); ctx.fill(); ctx.fillStyle = '#2e6bff'; rr(x, y + 375, w * .174 * ease(c), 22, 11); ctx.fill(); }
    });
    exemplo(cx0, 1040, prog(t, wt('pdf', 4), wt('pdf', 4) + .3));
    pilula('o contador mostra quanto do limite já foi', cx0, 1170, 900, prog(t, wt('quantos', 4) - .2, wt('quantos', 4) + .1), CI, '', 1, 34);
  },
  // 5 · limite prático: chat novo + resumo
  (t, lt) => {
    titulo('CONVERSA LONGA DEMAIS?', 300, SC[5], SC[6] - .2, t, 78, BR, 'DEMAIS?', AMB);
    janelaCtx(cx0 - 422, 430, 7, 3, 21 + lt * 4, t, prog(lt, 0, .3) * (1 - prog(t, wt('abra', 5) - .2, wt('abra', 5) + .1)), { cheio: true });
    pilula('+ chat novo', cx0, 620, 520, prog(t, wt('abra', 5) - .1, wt('abra', 5) + .2), VERDE, '', 1, 50);
    setaH(cx0 - 200, cx0 + 120, 800, prog(t, wt('cole', 5) - .2, wt('cole', 5) + .2), CI);
    pilula('cole um resumo do que importa', cx0, 960, 860, prog(t, wt('resumo', 5) - .3, wt('resumo', 5)), CI, 'a janela começa vazia de novo', 1, 40);
  },
  // 6 · logo + chamada
  (t, lt) => fim(t, lt, 'Salva e segue', 'domingo: modelo com raciocínio'),
];
</script></body></html>
