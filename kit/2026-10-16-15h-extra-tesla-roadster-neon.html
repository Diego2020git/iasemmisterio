<!doctype html>
<html><head><meta charset="utf-8">
<style>
@font-face{font-family:"AX";src:url(fontes/ArchivoExpanded-ExtraBold.ttf);font-weight:800}
@font-face{font-family:"AR";src:url(fontes/Archivo-SemiBold.ttf);font-weight:600}
html,body{margin:0;background:#000}canvas{display:block}
</style></head><body>
<img id="logo" src="marca/logo.png" style="display:none">
<canvas id="c" width="1080" height="1920"></canvas>
<script src="audio/2026-10-16-extra-tesla.tempos.js"></script>
<script src="raiox-kit.js"></script>
<script src="neon-kit.js"></script>
<script src="neon-extra.js"></script>
<script>
// 16/10/2026 · 15h (extra) · O novo Tesla Roadster "voa": o que é verdade. Neon.
const T0 = TEMPOS.cenas;
const SC = [T0[0], T0[1], T0[2], T0[3], T0[4], T0[5], T0[6], T0[7] + .7];
const DURATION = SC[7], IMPACTO = SC[6] + .4;
const COR = [AZ, CI, AZ, CI, IN, CI, AZ];
const HITS = [wt('voa', 0), wt('rampa', 1), wt('girou', 1), wt('dez', 2), wt('segundo', 3), wt('2028', 4), wt('seguranca', 5)];
const CLIQUES = [];
const CK = [[0, 0, 0, 0, 0]];
// carro esportivo de perfil (traço neon), centrado em 0,0
P.carro = function () {
  ctx.beginPath();
  ctx.moveTo(-110, 20); ctx.lineTo(-104, -6); ctx.lineTo(-60, -14); ctx.lineTo(-28, -40); ctx.lineTo(30, -40); ctx.lineTo(70, -12);
  ctx.lineTo(108, -4); ctx.lineTo(112, 20); ctx.lineTo(82, 20);
  ctx.moveTo(42, 20); ctx.lineTo(-42, 20); ctx.moveTo(-82, 20); ctx.lineTo(-110, 20);
  ctx.moveTo(-20, -34); ctx.lineTo(24, -34); ctx.lineTo(54, -14); ctx.lineTo(-44, -14); ctx.closePath();
  ctx.moveTo(-42, 20); ctx.arc(-62, 20, 20, 0, 7); ctx.moveTo(82, 20); ctx.arc(62, 20, 20, 0, 7);
};
// jatos de ar saindo de baixo do carro
function jatos(x, y, esc, f, t, n = 10) {
  if (f <= 0) return; ctx.save();
  for (let i = 0; i < n; i++) {
    const bx = x + (i - (n - 1) / 2) * 20 * esc, q = (t * 2.2 + i * .37) % 1;
    ctx.globalAlpha = f * (1 - q) * .9; ctx.strokeStyle = CI; ctx.shadowColor = CI; ctx.shadowBlur = 20; ctx.lineWidth = 6 * esc;
    ctx.beginPath(); ctx.moveTo(bx, y + 25 * esc); ctx.lineTo(bx, y + (25 + 90 * q) * esc); ctx.stroke();
  }
  ctx.restore();
}
const S = [
  // 0 · gancho: carro subindo com jatos, título no quadro 1
  (t, lt) => {
    frase('Um carro que voa?', 300, -1, SC[1] - .2, 92, { t, hot: 'voa', cor: CI });
    const sobe = 60 * Math.sin(lt * 2.2);
    neon3d(P.carro, cx0, 860 - sobe, 330, .25 * Math.sin(t * .9), .12, CI, 1);
    jatos(cx0, 860 - sobe, 2.6, 1, t);
    selo('Tesla Roadster', cx0, 1250, prog(t, .2, .5));
    frase('Mas calma.', 1420, wt('calma', 0) - .15, SC[1] - .2, 76, { t, hot: 'calma', cor: CI });
  },
  // 1 · a demonstração: rampa, de cabeça pra baixo, giro
  (t, lt) => {
    frase('Campo da SpaceX, Texas', 300, SC[1], SC[2] - .2, 64, { t, hot: 'SpaceX', cor: CI });
    const D = SC[2] - SC[1] - .3, q = clamp(lt / D);
    ctx.save(); ctx.globalAlpha *= prog(lt, 0, .3) * (1 - prog(t, SC[2] - .3, SC[2]));
    ctx.strokeStyle = hex(AZ, .8); ctx.lineWidth = 6; ctx.shadowColor = AZ; ctx.shadowBlur = 20;
    ctx.beginPath(); ctx.moveTo(140, 1150); ctx.lineTo(480, 1150); ctx.quadraticCurveTo(620, 1150, 640, 1000); ctx.stroke(); ctx.restore();
    // trajetória: anda, sobe a rampa, arco no ar com giro completo, pousa
    const x = lerp(240, 800, ease(q)), y = 1110 - 420 * Math.sin(Math.PI * clamp((q - .35) / .55)) * (q > .35 ? 1 : 0);
    const rot = q > .4 ? 2 * Math.PI * ease(clamp((q - .4) / .45)) : 0;
    ctx.save(); ctx.translate(x, y); ctx.rotate(-rot); ctx.translate(-x, -y);
    neon3d(P.carro, x, y, 190, 0, 0, CI, prog(lt, 0, .3) * (1 - prog(t, SC[2] - .3, SC[2])));
    ctx.restore();
    jatos(x, y, 1.5, q > .4 && q < .9 ? 1 : 0, t);
    linhaTxt('subiu a rampa', 1320, wt('rampa', 1) - .2, SC[2] - .2, t, 48);
    linhaTxt('de cabeça pra baixo', 1390, wt('cabeca', 1) - .2, SC[2] - .2, t, 48);
    linhaTxt('e girou no ar', 1460, wt('girou', 1) - .2, SC[2] - .2, t, 48, CI);
    exemplo(cx0, 1560, prog(lt, .2, .5) * (1 - prog(t, SC[2] - .3, SC[2])));
  },
  // 2 · 10 bicos de ar
  (t, lt) => {
    numero(1, 300, SC[2], SC[3] - .2, t);
    frase('10 bicos de ar', 480, wt('dez', 2) - .1, SC[3] - .2, 84, { t, hot: '10', cor: CI });
    neon3d(P.carro, cx0, 820, 300, .3 * Math.sin(t * .8), .15, AZ, prog(lt, .05, .35));
    jatos(cx0, 820, 2.4, prog(t, wt('dez', 2), wt('dez', 2) + .3), t);
    linhaTxt('ar em altíssima pressão', 1180, wt('altissima', 2) - .2, SC[3] - .2, t, 48);
    selo('tecnologia da SpaceX', cx0, 1290, prog(t, wt('tecnologia', 2), wt('tecnologia', 2) + .3));
  },
  // 3 · aceleração prometida
  (t, lt) => {
    numero(2, 300, SC[3], SC[4] - .2, t);
    frase('0 a ~100 km/h', 500, wt('zero', 3) - .1, SC[4] - .2, 84, { t, hot: '~100 km/h', cor: CI });
    frase('< 1 s', 760, wt('menos', 3) - .1, SC[4] - .2, 200, { t, hot: '< 1 s', cor: CI });
    neon3d(P.raio, cx0, 1080, 120 * back(prog(t, wt('segundo', 3), wt('segundo', 3) + .4)), .3 * Math.sin(t), .2, IN, prog(t, wt('segundo', 3), wt('segundo', 3) + .3));
    selo('promessa da Tesla', cx0, 1260, prog(t, wt('promete', 3), wt('promete', 3) + .3));
  },
  // 4 · produção, preço e reserva
  (t, lt) => {
    numero(3, 300, SC[4], SC[5] - .2, t);
    frase('Produção: 2028', 480, wt('producao', 4) - .1, SC[5] - .2, 84, { t, hot: '2028', cor: CI });
    selo('sem preço', cx0, 700, prog(t, wt('preco', 4) - .1, wt('preco', 4) + .2));
    frase('Reserva: US$ 50 mil', 900, wt('reserva', 4) - .1, SC[5] - .2, 72, { t, hot: 'US$ 50 mil', cor: CI });
    neon3d(P.cadeado, cx0, 1180, 120 * back(prog(t, wt('reserva', 4), wt('reserva', 4) + .4)), .3 * Math.sin(t), .2, AZ, prog(t, wt('reserva', 4), wt('reserva', 4) + .3));
  },
  // 5 · o outro lado
  (t, lt) => {
    frase('Prometido desde 2017', 420, wt('prometido', 5) - .1, SC[6] - .2, 72, { t, hot: '2017', cor: CI });
    linhaTxt('Musk: "não é um carro', 680, wt('musk', 5) - .1, SC[6] - .2, t, 54);
    linhaTxt('otimizado pra segurança"', 750, wt('musk', 5) + .1, SC[6] - .2, t, 54, CI);
    selo('por enquanto: saltos curtos, não voo', cx0, 940, prog(t, wt('seguranca', 5), wt('seguranca', 5) + .3));
    selo('fontes: CNN e CNBC, 15/10', cx0, 1060, prog(t, wt('seguranca', 5) + .3, wt('seguranca', 5) + .6));
  },
  // 6 · pergunta + logo
  (t, lt) => fim(t, lt, 'Você compraria?', 'comenta aí'),
];
</script></body></html>
