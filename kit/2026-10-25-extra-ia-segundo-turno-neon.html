const BLOCOS = []; { let cur = []; for (const p of PAL) { if (cur.length && (cur[0].cena !== p.cena || cur.length === 3 || /[.,:?!]$/.test(cur[cur.length - 1].w))) { BLOCOS.push(cur); cur = []; } cur.push(p); } if (cur.length) BLOCOS.push(cur); }

function bloco(x, y, w, h, est, a, t, k = 1) {

  if (est === 'livre') ctx.setLineDash([12, 10]);

}

  (t, lt) => {

  (t, lt) => {

    if (ma > 0) { ctx.save(); ctx.globalAlpha = ma; ctx.fillStyle = 'rgba(244,248,255,.1)'; rr(x - 60, y1 - h, 120, h, 30); ctx.fill();
      ctx.shadowColor = CF; ctx.shadowBlur = 30; ctx.fillStyle = CF; rr(x - 60, y1 - h * nv, 120, h * nv, 30); ctx.fill(); ctx.restore();
      txt('80%+', x, y1 - h * nv - 50, EXP, 52, CF, { align: 'center', alpha: prog(t, v80, v80 + .2) }); txt('Flávio, na véspera', x, y1 + 50, ARC, 32, BR, { align: 'center', weight: 600, alpha: prog(t, wt('vespera', 7) - .2, wt('vespera', 7) + .1) }); }

  },
  // 8 · IA fingindo ser eleitor
  (t, lt) => {
    titulo('IA FINGINDO SER ELEITOR', 250, SC[8], SC[9] - .2, t, 76, BR, 'ELEITOR');
    const ch = wt('chatgpt', 8), es = wt('estudos', 8);

      const n = 'Finja ser um eleitor de 35 anos, de Recife. Em quem você votaria?', k = prog(t, ch, ch + 1.2), m = Math.floor(n.length * k);
      ctx.fillStyle = '#2f6bff'; rr(x + 60, y - 10, w - 60, 150, 26); ctx.fill();
      const s = n.slice(0, m); const i = s.length > 34 ? s.lastIndexOf(' ', 34) : -1;
      txt(i > 0 ? s.slice(0, i) : s, x + 90, y + 40, ARC, 34, '#fff', { weight: 600 }); if (i > 0) txt(s.slice(i + 1), x + 90, y + 92, ARC, 34, '#fff', { weight: 600 });
    });

    for (let k = 0; k < 5; k++) { const a = prog(t, es - .2 + k * .12, es + k * .12); neon3d(P.pessoa, cx0 + (k - 2) * 170, 880 + flut(t, k) * .4, 50 * back(a), 0, .1, [AZ, CI, IN, CI, AZ][k], a); }
    [['✓  acerta a média', 'acerta', VERDE], ['✕  exagera padrões', 'exagera', VERM], ['✕  erra nos grupos', 'erra', VERM]].forEach(([s, w, c], i) =>
      pilula(s, cx0, 1050 + i * 115, 660, prog(t, wt(w, 8) - .2, wt(w, 8) + .1), c, '', 1, 40));
  },
  // 9 · o limite: tudo depende das pesquisas; 80% não é certeza
  (t, lt) => {

      if (a <= 0) continue; const e = back(a) * (ruim && t > pd ? 1 + .08 * Math.sin(t * 10) : 1);
      ctx.save(); ctx.translate(x, y); ctx.scale(e, e); ctx.globalAlpha = clamp(a * 2); ctx.fillStyle = 'rgba(8,16,34,.92)'; ctx.strokeStyle = c; ctx.lineWidth = 6; ctx.shadowColor = c; ctx.shadowBlur = 25;
      rr(-65, -65, 130, 130, 26); ctx.fill(); ctx.stroke(); txt(ruim ? '✕' : '✓', 0, 4, EXP, 60, c, { align: 'center' }); ctx.restore(); }
    linhaTxt('o favorito ganha 4 vezes em 5', 1040, wt('certeza', 9), SC[10] - .2, t, 40, CF);
    linhaTxt('e perde 1 vez em 5', 1120, pd - .3, SC[10] - .2, t, 46, VERM);

  // 10 · resultado oficial: no TSE
  (t, lt) => {
