<!doctype html>
<html><head><meta charset="utf-8">
<style>
@font-face{font-family:"AX";src:url(fontes/ArchivoExpanded-ExtraBold.ttf);font-weight:800}
@font-face{font-family:"AR";src:url(fontes/Archivo-SemiBold.ttf);font-weight:600}

<img id="logo" src="marca/logo.png" style="display:none">
<canvas id="c" width="1080" height="1920"></canvas>
<script src="audio/2026-11-06-agente-do-zero-10.tempos.js"></script>
<script src="raiox-kit.js"></script>
<script src="neon-kit.js"></script>
<script src="neon-extra.js"></script>
<script src="neon-entrega.js"></script>
<script>
// 06/11/2026 · 19h · Agente do zero #10: chamar um humano (regra no prompt + filtro "contém pessoa da equipe" + Gmail Send an Email) e quanto custa (~5 créditos por mensagem; Meta 1.000 respostas grátis/mês). Padrão de entrega de 24/10. Neon + neon-entrega.js.
// Fontes: help.make.com/credits, make.com/pricing, developers.facebook.com (WhatsApp pricing non-template), make.com/how-to-guides (Gmail Send an Email com filtro).
const T0 = TEMPOS.cenas;
const SC = [T0[0], T0[1], T0[2], T0[3], T0[4], T0[5], T0[6], T0[7] + .7];
const DURATION = SC[7], IMPACTO = SC[6] + .4;
const CLIQUES = [];
const CK = [[0, 0, 0, 0, 0], [DURATION, 0, 0, 0, 0]];
const COR = [AZ, CI, AZ, AMB, VERM, AMB, AZ];
const HITS = [wt('chamar', 0), wt('custa', 0), wt('dez', 1), wt('pessoa', 2), wt('equipe', 2), wt('filtro', 3), wt('equipe', 3), wt('gmail', 4), wt('cliente', 4), wt('cinco', 5), wt('duzentas', 5), wt('onze', 6)];
function conversa(x, y, w, s, t, t1, t2) {
  const b = (str, mine, yy, a) => { if (a <= 0) return; ctx.save(); ctx.globalAlpha *= clamp(a); const bw = Math.min(w * .92, measure(str, ARC, 28 * s, 600) + 46 * s);
    ctx.fillStyle = mine ? '#d9fdd3' : '#ffffff'; rr(mine ? x + w - bw : x, yy, bw, 70 * s, 18 * s); ctx.fill(); txt(str, (mine ? x + w - bw : x) + 22 * s, yy + 38 * s, ARC, 28 * s, '#1b2440', { weight: 600 }); ctx.restore(); };
  b('quero falar com alguém', 1, y + 20 * s, prog(t, t1 - .2, t1 + .2)); b('Vou chamar uma pessoa', 0, y + 110 * s, prog(t, t2 - .2, t2 + .2)); b('da equipe.', 0, y + 190 * s, prog(t, t2, t2 + .3)); }
function mod(x, y, a, cor, nome, sub, on) { if (a <= 0) return; ctx.save(); ctx.globalAlpha *= clamp(a); const e = back(clamp(a)); ctx.translate(x, y); ctx.scale(e, e);
  ctx.shadowColor = cor; ctx.shadowBlur = on ? 50 : 18; ctx.fillStyle = hex(cor, on ? .95 : .7); ctx.beginPath(); ctx.arc(0, 0, 58, 0, 7); ctx.fill(); ctx.shadowBlur = 0;
  txt(nome, 0, 95, ARC, 24, BR, { align: 'center', weight: 700 }); txt(sub, 0, 128, ARC, 22, CI, { align: 'center', weight: 600 }); ctx.restore(); }
const MODS = [['WhatsApp', 'Watch', VERDE], ['Data store', 'Get', AMB], ['Gemini', 'Completion', AZ], ['WhatsApp', 'Send', VERDE], ['Data store', 'Add/replace', AMB]];
const XS = MODS.map((_, i) => 130 + i * 205);
function cadeia(y, n, t, on) { MODS.forEach(([a, b, c], i) => { mod(XS[i], y, clamp(n - i), c, a, b, on === i); if (i) fio(XS[i - 1] + 62, y, XS[i] - 62, y, clamp(n - i + .5), CI, t, true); }); }
// desvio: Gemini → filtro → Gmail
function desvio(y0, y1, t, f, g, on) { const x = XS[2]; fio(x, y0 + 60, x, y1 - 50, f, AMB, t, true);
  if (f > 0) { ctx.save(); ctx.globalAlpha *= clamp(f); ctx.translate(x, y1); ctx.rotate(Math.PI / 4); ctx.fillStyle = hex(AMB, .9); ctx.shadowColor = AMB; ctx.shadowBlur = 30; ctx.fillRect(-36, -36, 72, 72); ctx.restore();
    txt('filtro', x, y1 + 70, ARC, 26, AMB, { align: 'center', weight: 700, alpha: clamp(f) }); }
  fio(x + 60, y1, XS[4] - 70, y1, g, VERM, t, true); mod(XS[4], y1, g, VERM, 'Gmail', 'Send an Email', on); }
const S = [
  // 0 · gancho
  (t, lt) => {
    titulo('O AGENTE CHAMA VOCÊ', 360, -1, SC[1] - .2, t, 78, BR, 'VOCÊ', AZ);
    celular(cx0 - 160, 880, .75, .12 * Math.sin(t * .6), prog(lt, 0, .3), (x, y, w, s) => conversa(x, y, w, s, t, .2, wt('chamar', 0)), 'Padaria Sol', VERDE);
    neon3d(P.envelope, cx0 + 300, 760 + flut(t), 90 * back(prog(t, wt('voce', 0) - .2, wt('voce', 0) + .2)), .3 * Math.sin(t), .1, VERM, prog(t, wt('voce', 0) - .2, wt('voce', 0) + .2));
    exemplo(cx0 - 160, 1320, prog(lt, .3, .6));
  },
  // 1 · episódio
  (t, lt) => {
    titulo('AGENTE DO ZERO', 520, SC[1], SC[2] - .2, t, 84, BR, 'ZERO', CI);
    versao('EPISÓDIO 10', cx0, 720, prog(t, wt('episodio', 1) - .1, wt('episodio', 1) + .3), CI, 0, 60);
    cadeia(1000, 5 * prog(lt, .2, 1.6), t, -1);
  },
  // 2 · passo 1: regra no prompt
  (t, lt) => {
    numero(1, 300, SC[2], SC[3] - .2, t);
    titulo('A REGRA NO PROMPT', 450, wt('instrucoes', 2) - .2, SC[3] - .2, t, 76, BR, 'REGRA', AZ);
    janela(580, 520, prog(t, wt('instrucoes', 2) - .3, wt('instrucoes', 2)), 'Instruções do agente', (x, y, w) => {
      const L = ['Se o cliente pedir para falar', 'com uma pessoa, reclamar ou', 'perguntar algo fora da lista,', 'responda só:'];
      L.forEach((s, i) => txt(s, x + 30, y + 50 + i * 52, ARC, 32, '#1b2440', { weight: 600, alpha: prog(t, wt('se', 2) + i * .3 - .2, wt('se', 2) + i * .3 + .1) }));
      const q = prog(t, wt('vou', 2) - .2, wt('equipe', 2)); ctx.save(); ctx.globalAlpha *= q; ctx.fillStyle = '#d9fdd3'; rr(x + 20, y + 270, w - 40, 80, 16); ctx.fill();
      txt('Vou chamar uma pessoa da equipe.', x + 40, y + 312, ARC, 32, '#1e7e45', { weight: 800 }); ctx.restore(); });
  },
  // 3 · passo 2: filtro
  (t, lt) => {
    numero(2, 300, SC[3], SC[4] - .2, t);
    titulo('UM FILTRO NO MAKE', 450, wt('make', 3) - .2, SC[4] - .2, t, 76, BR, 'FILTRO', AMB);
    cadeia(620, 5, t, prog(t, wt('gemini', 3) - .2, wt('gemini', 3) + .2) > .5 ? 2 : -1);
    desvio(620, 900, t, prog(t, wt('filtro', 3) - .2, wt('filtro', 3) + .4), 0, -1);
    pilula('a resposta contém', cx0, 1110, 520, prog(t, wt('resposta', 3) - .2, wt('contem', 3) + .2), AMB, '“PESSOA DA EQUIPE”', 1, 40);
  },
  // 4 · passo 3: Gmail
  (t, lt) => {
    numero(3, 300, SC[4], SC[5] - .2, t);
    titulo('O AVISO CHEGA PRA VOCÊ', 450, wt('caminho', 4) - .2, SC[5] - .2, t, 64, BR, 'VOCÊ', VERM);
    cadeia(620, 5, t, -1);
    desvio(620, 900, t, 1, prog(t, wt('gmail', 4) - .3, wt('gmail', 4) + .2), prog(t, wt('send', 4), wt('email', 4) + .2) > .5 ? 1 : 0);
    janela(1060, 230, prog(t, wt('voce', 4) - .3, wt('voce', 4)), 'Send an Email', (x, y, w) => {
      campo(x + 20, y + 20, w - 40, 'Para', 'seu e-mail · número do cliente', prog(t, wt('voce', 4) - .1, wt('cliente', 4) + .2), prog(t, wt('cliente', 4), wt('cliente', 4) + .3)); });
  },
  // 5 · custo
  (t, lt) => {
    titulo('QUANTO CUSTA', 360, SC[5], SC[6] - .2, t, 90, BR, 'CUSTA', AMB);
    MODS.forEach(([a, b, c], i) => { const q = prog(t, wt('cinco', 5) - .4 + i * .12, wt('cinco', 5) - .1 + i * .12); mod(XS[i], 560, q, c, a, b, 0);
      if (q > 0) txt('1', XS[i], 562, EXP, 44, BR, { align: 'center', alpha: q }); });
    versao('≈ 5 créditos por mensagem', cx0, 790, prog(t, wt('creditos', 5) - .2, wt('creditos', 5) + .2), AMB, 0, 50);
    pilula('Make grátis: ≈ 200 mensagens/mês', cx0, 960, 820, prog(t, wt('gratis', 5) - .2, wt('duzentas', 5) + .2), VERDE, '1.000 CRÉDITOS', 1, 38);
    pilula('Meta: 1.000 respostas grátis/mês', cx0, 1130, 820, prog(t, wt('mes', 5) - .1, wt('mes', 5) + .3), CI, 'POR NÚMERO', 1, 38);
  },
  // 6 · fim
  (t, lt) => fim(t, lt, 'Salva e segue', 'segunda: episódio 11'),
];
</script></body></html>
