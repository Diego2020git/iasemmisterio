<!doctype html>
<html><head><meta charset="utf-8">
<style>
@font-face{font-family:"AX";src:url(fontes/ArchivoExpanded-ExtraBold.ttf);font-weight:800}
@font-face{font-family:"AR";src:url(fontes/Archivo-SemiBold.ttf);font-weight:600}
html,body{margin:0;background:#000}canvas{display:block}
</style></head><body>
<img id="logo" src="marca/logo.png" style="display:none">
<canvas id="c" width="1080" height="1920"></canvas>
<script src="audio/2026-10-26-extra-sua-cidade-com-ia.tempos.js"></script>
<script src="raiox-kit.js"></script>
<script src="neon-kit.js"></script>
<script src="neon-extra.js"></script>
<script src="eleicoes-kit.js"></script>
<script>
const T0 = TEMPOS.cenas, NC = T0.length - 1;
const SC = [...T0.slice(0, NC), T0[NC] + .7];
const DURATION = SC[NC], IMPACTO = SC[NC - 1] + .4;
const CLIQUES = [], CK = [[0, 0, 0, 0, 0]];
const CF = AZ, CL = CI; // candidatos com cores neutras do canal
// 26/10/2026 · extra eleições 4/4: analisar o resultado da sua cidade com IA grátis. Cidade e candidatos FICTÍCIOS (Cidade Exemplo, Candidato A e B).
const COR = [AZ, CI, AZ, IN, CI, AZ, IN, AZ];
const HITS = [.1, wt('cidade', 0), wt('mudou', 0), wt('gratis', 0), wt('passos', 0), wt('estado', 1), wt('cidade', 1), wt('turno', 1), wt('copie', 2), wt('porcentagem', 2),
  wt('gemini', 3), wt('chatgpt', 3), wt('gratis', 3), wt('tabela', 3), wt('organiza', 4), wt('grafico', 4), wt('errar', 5), wt('confira', 5), wt('zona', 6), wt('abertos', 6)];
const DADOS = [['Candidato A', '12.430', '48,2%', '14.010', '52,1%', '+1.580'], ['Candidato B', '11.250', '43,6%', '12.880', '47,9%', '+1.630']];

function predios(y, a, t) { if (a <= 0) return; ctx.save(); ctx.globalAlpha *= a; ctx.strokeStyle = AZ; ctx.lineWidth = 4; ctx.shadowColor = AZ; ctx.shadowBlur = 16;
  [[-420, 160], [-330, 260], [-230, 190], [-140, 320], [-40, 230], [60, 290], [160, 180], [260, 340], [360, 220]].forEach(([dx, h], i) => { const hh = h * ease(clamp(a * 1.5 - i * .05));
    ctx.strokeRect(cx0 + dx, y - hh, 80, hh); for (let w = 1; w * 50 < hh - 20; w++) { ctx.fillStyle = hex(CI, .25 + .25 * ((i + w) % 2)); ctx.fillRect(cx0 + dx + 16, y - hh + w * 50 - 20, 16, 16); ctx.fillRect(cx0 + dx + 48, y - hh + w * 50 - 20, 16, 16); } });
  ctx.restore(); }
function tabela(x, y, w, a, linhas, t, o = {}) { if (a <= 0) return; ctx.save(); ctx.globalAlpha *= clamp(a * 2);
  const cols = o.cols || [0, .36, .6, .82], hd = o.head || ['', '1º turno', '2º turno', 'diferença'];
  hd.forEach((h, i) => txt(h, x + w * cols[i], y, ARC, 26, '#5a6a8f', { weight: 600 }));
  linhas.forEach((l, r) => { const k = clamp(a * 3 - r - .5); if (k <= 0) return; ctx.globalAlpha = k;
    o.cells(l).forEach((c, i) => txt(c, x + w * cols[i], y + 60 + r * 60, ARC, 30, i === 3 ? '#0a8a4a' : '#1b2440', { weight: 600 })); });
  ctx.restore(); }
const S = [
  // 0 · gancho
  (t, lt) => {
    const ia = wt('ia', 0), ps = wt('passos', 0);
    titulo('COMO SUA CIDADE VOTOU?', 250, -1, ia - .1, t, 78, BR, 'SUA CIDADE');
    titulo('ANALISE COM IA', 250, ia - .05, SC[1] - .2, t, 96, BR, 'IA');
    predios(820, prog(t, 0, 1.2), t);
    [['1º turno', -150, .55], ['2º turno', 150, .78]].forEach(([s, dx, h], i) => { const a = prog(t, wt(i ? 'segundo' : 'primeiro', 0) - .3, wt(i ? 'segundo' : 'primeiro', 0) + .4), hh = 300 * h * ease(a);
      if (a <= 0) return; ctx.save(); ctx.shadowColor = CI; ctx.shadowBlur = 30; ctx.fillStyle = hex(i ? CI : AZ, .9); rr(cx0 + dx - 70, 1150 - hh, 140, hh, 16); ctx.fill(); ctx.restore();
      txt(s, cx0 + dx, 1190, ARC, 30, BR, { align: 'center', weight: 600, alpha: a }); });
    pilula('3 passos · grátis', cx0, 1290, 520, prog(t, ps - .3, ps), CI, '', 1, 40);
  },
  // 1 · passo 1: site de resultados
  (t, lt) => {
    passo(1, 'ABRA O SITE DE RESULTADOS', SC[1], SC[2] - .2, t, 'RESULTADOS');
    const es = wt('estado', 1), ci = wt('cidade', 1), tu = wt('turno', 1);
    janela(500, 600, prog(t, wt('site', 1) - .3, wt('site', 1)), 'resultados.tse.jus.br', (x, y, w) => {
      campo(x, y, w, 'Estado', 'São Paulo', prog(t, es - .3, es), t > es && t < ci ? 1 : 0);
      campo(x, y + 130, w, 'Município', 'Cidade Exemplo', prog(t, ci - .3, ci), t > ci && t < tu ? 1 : 0);
      campo(x, y + 260, w, 'Turno', '1º e 2º turno', prog(t, tu - .3, tu), t > tu ? 1 : 0);
    }, 860);
    exemplo(cx0, 1160, prog(t, ci, ci + .3));
  },
  // 2 · passo 2: copiar os números
  (t, lt) => {
    passo(2, 'COPIE OS NÚMEROS', SC[2], SC[3] - .2, t, 'NÚMEROS');
    const cp = wt('copie', 2), sg = wt('segundo', 2);
    janela(500, 360, prog(lt, .05, .35), 'resultados.tse.jus.br · Cidade Exemplo', (x, y, w) => {
      const sel = prog(t, cp, sg + .3); if (sel > 0) { ctx.fillStyle = hex(AZ, .18); rr(x - 10, y + 20, (w + 20) * ease(sel), 150, 12); ctx.fill(); }
      tabela(x, y, w, prog(lt, .2, 1), DADOS, t, { cells: l => [l[0], l[1] + ' · ' + l[2], l[3] + ' · ' + l[4], ''], cols: [0, .33, .67, 1], head: ['', '1º turno', '2º turno', ''] });
    }, 900);
    const ok = prog(t, sg + .3, sg + .6); if (ok > 0) { ctx.save(); ctx.globalAlpha = ok; ctx.fillStyle = VERDE; rr(cx0 - 180, 960, 360, 80, 40); ctx.fill(); txt('✓ Copiado', cx0, 1000, EXP, 34, '#05200f', { align: 'center' }); ctx.restore(); }
    exemplo(cx0, 1120, 1);
  },
  // 3 · passo 3: cole na IA com o pedido
  (t, lt) => {
    passo(3, 'COLE NA IA', SC[3], SC[4] - .2, t, 'IA');
    const gm = wt('gemini', 3), cg = wt('chatgpt', 3), gr = wt('gratis', 3), mo = wt('monte', 3);
    pilula('Gemini', cx0 - 220, 520, 340, prog(t, gm - .3, gm), CI, '', 1, 40); pilula('ChatGPT', cx0 + 220, 520, 340, prog(t, cg - .3, cg), CI, '', 1, 40);
    linhaTxt('os dois têm versão grátis', 630, gr - .2, SC[4] - .2, t, 36, VERDE);
    janela(720, 520, prog(t, wt('pedido', 3) - .4, wt('pedido', 3)), 'chat com IA', (x, y, w) => {
      const n = 'Monte uma tabela comparando o 1º e o 2º turno desta cidade e diga quem ganhou e quem perdeu votos: [dados colados]', k = prog(t, mo - .2, wt('votos', 3) + .2), m = Math.floor(n.length * k);
      ctx.fillStyle = AZ; rr(x + 40, y - 10, w - 40, 330, 24); ctx.fill(); const s = n.slice(0, m), lin = []; let cur = '';
      s.split(' ').forEach(p => { if (measure(cur + ' ' + p, ARC, 34, 600) > w - 110) { lin.push(cur); cur = p; } else cur = cur ? cur + ' ' + p : p; }); lin.push(cur);
      lin.forEach((l, i) => txt(l, x + 70, y + 40 + i * 48, ARC, 34, '#fff', { weight: 600 })); }, 900);
  },
  // 4 · a resposta
  (t, lt) => {
    titulo('EM SEGUNDOS', 250, SC[4], SC[5] - .2, t, 96, BR, 'SEGUNDOS');
    const or = wt('organiza', 4), ap = wt('aponta', 4), gf = wt('grafico', 4);
    janela(400, 400, prog(lt, .05, .35), 'resposta da IA', (x, y, w) => {
      tabela(x, y, w, prog(t, or - .3, or + .8), DADOS, t, { cells: l => [l[0], l[1], l[3], l[5]] });
      const h = prog(t, ap, ap + .4); if (h > 0) { ctx.save(); ctx.globalAlpha = h; ctx.strokeStyle = VERDE; ctx.lineWidth = 4; rr(x + w * .8, y + 30, w * .22, 140, 12); ctx.stroke(); ctx.restore(); }
    }, 900);
    const ga = prog(t, gf - .3, gf + .3); if (ga > 0) { ctx.save(); ctx.globalAlpha = ga;
      [['A', 12430, 14010], ['B', 11250, 12880]].forEach(([n, v1, v2], i) => { const x = cx0 - 260 + i * 300, b = 380 / 15000;
        ctx.fillStyle = hex(AZ, .9); rr(x, 1260 - v1 * b * ease(ga), 80, v1 * b * ease(ga), 10); ctx.fill(); ctx.fillStyle = hex(CI, .9); rr(x + 100, 1260 - v2 * b * ease(ga), 80, v2 * b * ease(ga), 10); ctx.fill();
        txt('Candidato ' + n, x + 90, 1300, ARC, 28, BR, { align: 'center', weight: 600 }); });
      chipLegenda([['1º turno', AZ], ['2º turno', CI]], 900, ga); ctx.restore(); }
    exemplo(cx0, 1365, prog(lt, .3, .6));
  },
  // 5 · atenção: confira
  (t, lt) => {
    titulo('ATENÇÃO', 250, SC[5], SC[6] - .2, t, 110, BR, 'ATENÇÃO', AMB);
    const er = wt('errar', 5), cf = wt('confira', 5);
    pilula('IA pode errar conta', cx0, 440, 620, prog(t, er - .3, er), AMB, '', 1, 44);
    [['site do tribunal', '14.010', VERDE, -230], ['resposta da IA', t > cf + .6 ? '14.010' : '14.100', t > cf + .6 ? VERDE : VERM, 230]].forEach(([r, v, c, dx], i) => {
      const a = prog(t, (i ? er : er - .4) + .2, (i ? er : er - .4) + .5); if (a <= 0) return; pilula(v, cx0 + dx, 700, 380, a, c, r, 1, 60); });
    const cmp = prog(t, cf - .2, cf + .4); if (cmp > 0) { txt(t > cf + .6 ? '=' : '≠', cx0, 710, EXP, 80, t > cf + .6 ? VERDE : VERM, { align: 'center', alpha: cmp }); }
    linhaTxt('confira cada número antes de postar', 920, cf, SC[6] - .2, t, 40, CI);
    exemplo(cx0, 1010, prog(lt, .3, .6));
  },
  // 6 · dados abertos
  (t, lt) => {
    titulo('DADOS ABERTOS', 250, SC[6], SC[7] - .2, t, 96, BR, 'ABERTOS');
    const zn = wt('zona', 6), pt = wt('portal', 6), ar = wt('arquivos', 6);
    pilula('detalhe por zona eleitoral', cx0, 440, 640, prog(t, zn - .3, zn), CI, '', 1, 40);
    janela(560, 420, prog(t, pt - .6, pt - .2), 'dadosabertos.tse.jus.br', (x, y, w) => {
      txt('Votação nominal por município e zona', x, y + 10, ARC, 32, '#1b2440', { weight: 600 });
      ctx.fillStyle = '#e1e8f8'; rr(x, y + 60, 120, 50, 10); ctx.fill(); txt('CSV', x + 60, y + 86, EXP, 24, AZ, { align: 'center' });
      const d = prog(t, ar - .2, ar + 1.8); ctx.fillStyle = '#dfe6f5'; rr(x, y + 160, w, 40, 20); ctx.fill(); ctx.fillStyle = AZ; rr(x, y + 160, w * ease(d), 40, 20); ctx.fill();
      txt(d >= 1 ? 'arquivo pronto ✓' : 'baixando...', x, y + 250, ARC, 30, d >= 1 ? '#0a8a4a' : '#5a6a8f', { weight: 600 }); }, 900);
  },
  (t, lt) => fim(t, lt, 'Salva e faz com a sua cidade', 'e segue o canal'),
];

const renderBase = render;
window.render = render = function (t) { renderBase(t); legenda(t); };
</script></body></html>
