// 17/10/2026 · extra (pedido do Diego) · Como fazer a trend do gol do Özil com IA, sem CapCut (Kling Motion Control). Neon.
// O lance é uma SIMULAÇÃO em traço neon (nada de imagem da transmissão, por direito autoral).
const T0 = TEMPOS.cenas;
const SC = [...T0.slice(0, 10), T0[10] + .7];
const DURATION = SC[10], IMPACTO = SC[9] + .4;
const COR = [CI, AZ, IN, CI, AZ, CI, IN, AZ, IN, CI];
const HITS = [wt('ozil', 0), wt('qualquer', 0), wt('copia', 1), wt('pronto', 2), wt('kling', 2), wt('corte', 3), wt('foto', 4), wt('motion', 5), wt('gerar', 6), wt('baixar', 6), wt('40', 7), wt('permissao', 8)];
const CLIQUES = [wt('gerar', 6) + .1, wt('baixar', 6) + .1];
const CK = [[0, 0, 0, 0, 0]];
const VERM = '#ff4d6d';

// ---------- boneco em traço neon (pés em 0,0; altura ~210) ----------
function boneco(x, y, s, fase, cor, quem = 'jogador', a = 1, o = {}) {
  if (a <= 0) return;
  const corre = o.parado ? 0 : 1, sw = Math.sin(fase) * .8 * corre;
  ctx.save(); ctx.globalAlpha *= clamp(a); ctx.translate(x, y); ctx.scale(s * (o.vira ? -1 : 1), s); ctx.rotate(o.giro || 0);

  if (o.fantasma) ctx.setLineDash([10, 12]);
  const hip = [0, -92], sh = [6 * corre, -160];
  const perna = (ang, k) => { const jx = Math.sin(ang) * 48, jy = hip[1] + Math.cos(ang) * 48, fx = jx + Math.sin(ang - .7 * k) * 48, fy = jy + Math.cos(ang - .7 * k) * 48;
    ctx.beginPath(); ctx.moveTo(...hip); ctx.lineTo(jx, jy); ctx.lineTo(fx, fy); ctx.stroke(); };
  perna(sw, Math.max(0, Math.sin(fase))); perna(-sw, Math.max(0, -Math.sin(fase)));
  // camisa (tronco cheio)
  ctx.beginPath(); ctx.moveTo(sh[0] - 22, sh[1]); ctx.lineTo(sh[0] + 22, sh[1]); ctx.lineTo(14, hip[1] - 4); ctx.lineTo(-14, hip[1] - 4); ctx.closePath();
  ctx.fillStyle = hex(cor, o.fantasma ? .08 : .3); ctx.fill(); ctx.lineWidth = 8; ctx.stroke(); ctx.lineWidth = 11;
  const braco = (ang, lado) => { const bx = sh[0] + lado * 18, by = sh[1] + 6; ctx.beginPath(); ctx.moveTo(bx, by); ctx.lineTo(bx + Math.sin(ang) * 40, by + Math.cos(ang) * 40);
    ctx.lineTo(bx + Math.sin(ang) * 40 + Math.sin(ang + 1.1) * 34, by + Math.cos(ang) * 40 + Math.cos(ang + 1.1) * 22); ctx.stroke(); };
  if (o.comemora) [-1, 1].forEach(k => { ctx.beginPath(); ctx.moveTo(sh[0] + k * 18, sh[1] + 4); ctx.lineTo(sh[0] + k * 44, sh[1] - 34); ctx.lineTo(sh[0] + k * 52, sh[1] - 78); ctx.stroke(); });
  else if (o.bracos) [-1, 1].forEach(k => { ctx.beginPath(); ctx.moveTo(sh[0] + k * 18, sh[1] + 4); ctx.lineTo(sh[0] + k * 60, sh[1] - 10); ctx.lineTo(sh[0] + k * 92, sh[1] - 26); ctx.stroke(); });
  else { braco(-sw * 1.2, -1); braco(sw * 1.2, 1); }
  // cabeça
  const hx = sh[0] + 4 * corre, hy = sh[1] - 36;
  ctx.fillStyle = 'rgba(3,4,8,.92)'; ctx.lineWidth = 9;
  if (quem === 'astro') {
    ctx.beginPath(); ctx.arc(hx, hy - 4, 38, 0, 7); ctx.fill(); ctx.stroke();
    ctx.lineWidth = 6; ctx.strokeStyle = BR; ctx.shadowColor = BR; rr(hx - 6, hy - 22, 42, 26, 12); ctx.stroke();
  } else {
    ctx.beginPath(); ctx.arc(hx, hy, 27, 0, 7); ctx.fill(); ctx.stroke();
    if (quem === 'jogador') { ctx.beginPath(); ctx.arc(hx, hy - 4, 28, Math.PI * 1.05, Math.PI * 1.95); ctx.lineWidth = 15; ctx.stroke(); }
    if (quem === 'vova') { ctx.beginPath(); ctx.arc(hx - 8, hy - 36, 14, 0, 7); ctx.stroke(); ctx.lineWidth = 5; ctx.strokeStyle = BR; ctx.shadowColor = BR;
      ctx.beginPath(); ctx.arc(hx + 8, hy - 2, 8, 0, 7); ctx.moveTo(hx + 30, hy - 2); ctx.arc(hx + 22, hy - 2, 8, 0, 7); ctx.stroke(); }
    if (quem === 'gato') { ctx.beginPath(); ctx.moveTo(hx - 23, hy - 14); ctx.lineTo(hx - 19, hy - 48); ctx.lineTo(hx - 2, hy - 25); ctx.moveTo(hx + 4, hy - 26); ctx.lineTo(hx + 21, hy - 48); ctx.lineTo(hx + 24, hy - 13); ctx.stroke();
      ctx.lineWidth = 4; ctx.beginPath(); [-1, 1].forEach(k => { ctx.moveTo(hx + 14, hy + 6 + k * 4); ctx.lineTo(hx + 42, hy + 4 + k * 10); }); ctx.stroke(); }
  }
  ctx.restore();
}
function bola(x, y, s, a = 1, giro = 0) {
  if (a <= 0) return; ctx.save(); ctx.globalAlpha *= clamp(a); ctx.translate(x, y); ctx.scale(s, s); ctx.rotate(giro);
  ctx.shadowColor = BR; ctx.shadowBlur = 30; ctx.fillStyle = '#f4f8ff'; ctx.beginPath(); ctx.arc(0, 0, 16, 0, 7); ctx.fill();
  ctx.shadowBlur = 0; ctx.fillStyle = '#0a1d45'; ctx.beginPath(); for (let i = 0; i < 5; i++) { const an = i * 1.2566; ctx.lineTo(Math.cos(an) * 6.5, Math.sin(an) * 6.5); } ctx.fill(); ctx.restore();
}
// ---------- o lance (simulação): chapéu, carrinho, drible no goleiro e gol ----------
// q de 0 a 1 é a história; lento(u) dá câmera lenta no chapéu.
const lento = u => { u = clamp(u); return u < .1 ? u * 1.2 : u < .5 ? .12 + (u - .1) / .4 * .24 : .36 + (u - .5) / .5 * .64; };
const XA = q => q < .8 ? lerp(-330, 225, q / .8) : 225 + 20 * ease(clamp((q - .8) / .1));
function bpos(q) {
  const fase = q * 44, pe = x => [x + 32, -16 - 8 * Math.abs(Math.sin(fase))];
  if (q < .12) return pe(XA(q));
  if (q < .36) { const u = (q - .12) / .24, x0 = XA(.12) + 32, x1 = XA(.36) + 32; return [lerp(x0, x1, u), -16 - 320 * Math.sin(Math.PI * u)]; }
  if (q < .73) return pe(XA(q));

function lance(ox, oy, s, q, quem, a = 1, o = {}) {
  if (a <= 0) return; q = clamp(q);

  const chap = q > .1 && q < .4 ? Math.sin(Math.PI * (q - .1) / .3) : 0, z = s * (1 + (o.cam ? .22 * chap : 0));

  ctx.save(); ctx.lineCap = 'round';
  for (let i = 0; i < 6; i++) { const y0 = -46 + i * 22, y1 = y0 + 22, k0 = 1 + y0 / 300, k1 = 1 + y1 / 300;
    ctx.fillStyle = hex(i % 2 ? AZ : IN, .07 + .02 * i); ctx.beginPath(); ctx.moveTo(-400 * k0, y0); ctx.lineTo(400 * k0, y0); ctx.lineTo(400 * k1, y1); ctx.lineTo(-400 * k1, y1); ctx.closePath(); ctx.fill(); }
  ctx.strokeStyle = hex(CI, .35); ctx.lineWidth = 3; ctx.beginPath(); ctx.moveTo(150 * (1 - 46 / 300), -46); ctx.lineTo(120 * (1 + 86 / 300), 86); ctx.stroke();
  ctx.strokeStyle = hex(AZ, .8); ctx.lineWidth = 4; ctx.shadowColor = AZ; ctx.shadowBlur = 14; ctx.beginPath(); ctx.moveTo(-400 * (1 + 86 / 300), 86); ctx.lineTo(400 * (1 + 86 / 300), 86); ctx.stroke();
  ctx.restore();
  // gol com rede (trave de trás deslocada pra dar profundidade)
  const gol = q > .81 ? Math.pow(1 - clamp((q - .81) / .2), 2) : 0;
  ctx.save(); ctx.strokeStyle = BR; ctx.shadowColor = CI; ctx.shadowBlur = 18; ctx.lineWidth = 7; ctx.lineJoin = 'round';
  ctx.beginPath(); ctx.moveTo(318, 10); ctx.lineTo(318, -160); ctx.lineTo(372, -186); ctx.lineTo(372, -30); ctx.stroke();
  ctx.lineWidth = 2; ctx.strokeStyle = hex(CI, .45 + .5 * gol); ctx.shadowBlur = 0;
  for (let k = 1; k < 6; k++) { const xx = 318 + k * 9 + 10 * gol * Math.sin(k * 1.7); ctx.beginPath(); ctx.moveTo(xx, -160 - k * 4.3); ctx.lineTo(xx + 4 * gol, 10 - k * 7); ctx.stroke(); }
  for (let k = 1; k < 6; k++) { ctx.beginPath(); ctx.moveTo(318, -160 + k * 30); ctx.lineTo(372 + 6 * gol, -186 + k * 28); ctx.stroke(); }
  ctx.restore();
  const xa = XA(q), fase = q * 44, comemora = q > .86;
  // sombra da bola
  const [bx, by] = bpos(q), alt = clamp(-by / 320);
  ctx.save(); ctx.fillStyle = 'rgba(0,0,0,.55)'; ctx.beginPath(); ctx.ellipse(bx, 6, 18 * (1 - .5 * alt), 5, 0, 0, 7); ctx.fill(); ctx.restore();
  // marcador 1: pula e a bola passa por cima
  const sobe1 = q > .17 && q < .33 ? Math.sin(Math.PI * (q - .17) / .16) : 0;
  boneco(-150, -60 * sobe1, 1, 0, AZ, 'jogador', 1, { parado: true, vira: true, bracos: sobe1 > .1, giro: -.15 * sobe1 });
  // marcador 2: carrinho
  const k2 = ease(clamp((q - .48) / .1));
  boneco(40 - 80 * k2, -4 * k2, 1, 0, AZ, 'jogador', 1, { parado: true, vira: true, giro: -1.35 * k2 });
  // goleiro: sai e mergulha no lado errado
  const k3 = ease(clamp((q - .62) / .1));
  boneco(290 - 40 * k3, -20 * Math.sin(Math.PI * k3), 1, 0, IN, 'jogador', 1, { parado: true, vira: true, bracos: true, giro: -1.2 * k3 });
  // fantasma (movimento original copiado)
  if (o.fantasma) boneco(xa, 0, 1, fase, AZ, 'jogador', .55, { parado: comemora, comemora, fantasma: true });
  // atacante, com hop no drible do goleiro e linhas de velocidade
  const hop = q > .64 && q < .72 ? 30 * Math.sin(Math.PI * (q - .64) / .08) : 0;
  if (!comemora) { ctx.save(); ctx.strokeStyle = hex(CI, .4); ctx.lineWidth = 4; ctx.lineCap = 'round';
    for (let i = 0; i < 3; i++) { const yy = -60 - i * 45; ctx.beginPath(); ctx.moveTo(xa - 60 - i * 10, yy); ctx.lineTo(xa - 120 - i * 25, yy); ctx.stroke(); } ctx.restore(); }
  boneco(xa, -hop, 1, fase, CI, quem, 1, { parado: comemora, comemora });
  // rastro da bola quando ela voa
  if ((q > .12 && q < .36) || (q > .73 && q < .82)) for (let i = 8; i >= 1; i--) { const [tx, ty] = bpos(q - i * .006);
    ctx.save(); ctx.globalAlpha *= (1 - i / 9) * .45; ctx.fillStyle = CI; ctx.shadowColor = CI; ctx.shadowBlur = 16; ctx.beginPath(); ctx.arc(tx, ty, 12 * (1 - i / 12), 0, 7); ctx.fill(); ctx.restore(); }
  bola(bx, by, 1.1, 1, q * 34);
  if (o.rotulos) {
    const r1 = prog(q, .2, .25) * (1 - prog(q, .38, .43)), r2 = prog(q, .5, .55) * (1 - prog(q, .62, .66)), r3 = prog(q, .82, .86);
    if (r1 > 0) txt('CHAPÉU!', -150, -350, EXP, 56, CI, { align: 'center', alpha: r1 });
    if (r2 > 0) txt('CARRINHO!', 0, -330, EXP, 50, CI, { align: 'center', alpha: r2 });
    if (r3 > 0) txt('GOL!', 230, -340, EXP, 72, CI, { align: 'center', alpha: r3 });
  }
  ctx.restore();
}
// tela escura de vídeo; conteudo() desenha dentro (recortado)
function tela(x, y, w, h, a, titulo, conteudo, barra) {
  if (a <= 0) return; const e = .9 + .1 * back(clamp(a));
  ctx.save(); ctx.globalAlpha *= clamp(a * 1.5); ctx.translate(x + w / 2, y + h / 2); ctx.scale(e, e); ctx.translate(-x - w / 2, -y - h / 2);
  ctx.shadowColor = hex(AZ, .7); ctx.shadowBlur = 50; ctx.fillStyle = '#070b16'; rr(x, y, w, h, 24); ctx.fill(); ctx.shadowBlur = 0;
  ctx.strokeStyle = hex(CI, .8); ctx.lineWidth = 3; rr(x, y, w, h, 24); ctx.stroke();
  txt(titulo, x + 30, y + 40, ARC, 26, 'rgba(244,248,255,.75)', { weight: 600 });
  ctx.save(); rr(x, y + 64, w, h - 64 - (barra ? 90 : 0), 0); ctx.clip(); conteudo(); ctx.restore();
  if (barra) barra(x + 30, y + h - 45, w - 60);
  ctx.restore();
}
// caixa de envio de arquivo (dentro da janela clara)
function envio(x, y, w, h, rot, cheio, desenho) {
  ctx.save(); ctx.strokeStyle = cheio > 0 ? AZ : '#9fb0d0'; ctx.lineWidth = cheio > 0 ? 4 : 3; if (cheio <= 0) ctx.setLineDash([12, 10]);
  ctx.fillStyle = cheio > 0 ? '#070b16' : '#eef2fb'; rr(x, y, w, h, 18); ctx.fill(); rr(x, y, w, h, 18); ctx.stroke(); ctx.setLineDash([]);
  if (cheio <= 0) { txt('+', x + w / 2, y + h / 2 - 20, ARC, 70, '#9fb0d0', { align: 'center', weight: 600 }); }
  else { ctx.save(); ctx.globalAlpha *= clamp(cheio * 2); rr(x, y, w, h, 18); ctx.clip(); desenho(); ctx.restore(); }
  txt(rot, x + w / 2, y + h + 34, ARC, 26, '#1b2440', { align: 'center', weight: 600 });
  ctx.restore();
}
function cartaoFoto(x, y, e, quem, a, nome = 'personagem.png') {

  ctx.fillStyle = '#070b16'; rr(-185, -225, 370, 400, 10); ctx.fill(); ctx.restore();
  boneco(x, y + 140 * e, 1.5 * e, 0, CI, quem, clamp(a * 2), { parado: true });

}

const QUEM = ['vova', 'gato', 'astro'];
const S = [
  // 0 · gancho: título no quadro 1 e o lance com câmera lenta no chapéu
  (t, lt) => {
    frase('Gol do Özil · 2016', 270, -1, SC[1] - .2, 96, { t, hot: 'Özil', cor: CI });
    frase('VIRALIZOU DE NOVO', 385, -1, SC[1] - .2, 64, { t, hot: 'VIRALIZOU', cor: CI });
    const tq = wt('qualquer', 0), troca = t >= tq;

    exemplo(cx0, 1340, prog(lt, .4, .7));
  },
  // 6 · passo 4: modelo 2.6 Standard, gerar e baixar
  (t, lt) => {
    numero(4, 290, SC[6], SC[7] - .2, t);
    frase('Gerar e baixar', 460, wt('escolha', 6) - .1, SC[7] - .2, 76, { t, hot: 'baixar', cor: CI });
    const g = wt('gerar', 6), bx = wt('baixar', 6), pronto = prog(t, g + .3, g + .9);
    janela(560, 700, prog(lt, .1, .4) * (1 - pronto), 'kling.ai · Motion Control', (x, y, w) => {
      campo(x, y, w, 'Modelo', '2.6', prog(t, wt('modelo', 6) - .2, wt('modelo', 6) + .1), prog(t, wt('modelo', 6), wt('modelo', 6) + .2) * (1 - prog(t, wt('modo', 6), wt('modo', 6) + .1)));
      txt('MODO', x, y + 150, ARC, 22, '#5a6a8f', { weight: 600, ls: 2 });
      const st = prog(t, wt('standard', 6) - .1, wt('standard', 6) + .2);
      ctx.fillStyle = '#e6ecfa'; rr(x, y + 170, w, 80, 40); ctx.fill();
      ctx.fillStyle = hex(AZ, st); rr(x + 6, y + 176, w / 2 - 6, 68, 34); ctx.fill();
      txt('Standard', x + w / 4, y + 211, ARC, 32, st > .5 ? '#fff' : '#1b2440', { align: 'center', weight: 600 });
      txt('Professional', x + w * .75, y + 211, ARC, 32, '#5a6a8f', { align: 'center', weight: 600 });
      botao(x, y + 290, 'gerar', prog(t, wt('clique', 6) - .3, wt('clique', 6)), prog(t, g, g + .3));
      const pg = prog(t, g + .1, g + .3); if (pg > 0) { ctx.fillStyle = '#dbe3f5'; rr(x, y + 410, w, 18, 9); ctx.fill(); ctx.fillStyle = CI; rr(x, y + 410, w * pg, 18, 9); ctx.fill(); }
    });
    if (pronto > 0) {
      tela(cx0 - 410, 560, 820, 640, pronto, 'resultado.mp4', () => lance(cx0, 1010, .95, lento(prog(t, g + .5, SC[7])) * 1.05, 'vova', 1));
      botao(cx0 - 140, 1240, 'baixar vídeo', prog(t, bx - .3, bx), prog(t, bx, bx + .3), CI);
    }
    exemplo(cx0, 1380, prog(lt, .4, .7));
  },
  // 7 · custo e limite grátis
  (t, lt) => {
    frase('5 créditos por segundo', 330, wt('5', 7) - .1, SC[8] - .2, 70, { t, hot: '5 créditos', cor: CI });
    frase('8 s = 40 créditos', 480, wt('8', 7) - .1, SC[8] - .2, 82, { t, hot: '40 créditos', cor: CI });
    lance(cx0, 1000, 1.05, lento((lt % 3) / 3) * 1.05, 'astro', prog(lt, .1, .4));
    selo('cabe no grátis do dia', cx0, 1180, prog(t, wt('cabem', 7), wt('cabem', 7) + .3));
    linhaTxt("com marca d'água · Kling 2.6 Standard", 1290, wt('marca', 7), SC[8] - .2, t, 40, 'rgba(244,248,255,.85)');
  },
  // 8 · cuidado
  (t, lt) => {
    neon3d(P.alerta, cx0, 560, 140 * back(prog(lt, .05, .5)), .3 * Math.sin(t * .9), .2, VERM, prog(lt, .05, .3));
    frase('Personagem inventado', 820, wt('personagem', 8) - .1, SC[9] - .2, 72, { t, hot: 'inventado', cor: CI });
    linhaTxt('ou foto com permissão', 920, wt('ou', 8), SC[9] - .2, t, 50);
    linhaTxt('lance da TV pode tomar bloqueio', 1100, wt('lance', 8), SC[9] - .2, t, 48, VERM);
    linhaTxt('(no nosso vídeo, o lance é simulação)', 1180, wt('bloqueio', 8), SC[9] - .2, t, 34, 'rgba(244,248,255,.7)');
  },
  // 9 · logo + chamada
  (t, lt) => fim(t, lt, 'Salva e faz o seu', 'segue o canal'),
];
