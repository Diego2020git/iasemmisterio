<img id="logo" src="marca/logo.png" style="display:none">
<canvas id="c" width="1080" height="1920"></canvas>

<script>
// 17/10/2026 · extra (pedido do Diego) · Como fazer a trend do gol do Özil com IA, sem CapCut (Kling Motion Control). Neon.
// O lance é uma SIMULAÇÃO em traço neon (nada de imagem da transmissão, por direito autoral).
const T0 = TEMPOS.cenas;
const SC = [...T0.slice(0, 9), T0[9] + .7];
const DURATION = SC[9], IMPACTO = SC[8] + .4;
const COR = [CI, AZ, IN, CI, AZ, CI, IN, AZ, CI];
const HITS = [wt('qualquer', 0), wt('ozil', 1), wt('copia', 1), wt('kling', 2), wt('recorte', 3), wt('foto', 4), wt('motion', 5), wt('gere', 5), wt('40', 6), wt('permissao', 7)];
const CLIQUES = [wt('gere', 5) + .2];
const CK = [[0, 0, 0, 0, 0]];
const VERM = '#ff4d6d';

// ---------- boneco em traço neon (pés em 0,0; altura ~200) ----------
// fase = ciclo da corrida; quem = 'jogador' | 'vova' | 'gato' | 'astro'; giro = inclinação do corpo
function boneco(x, y, s, fase, cor, quem = 'jogador', a = 1, o = {}) {
  if (a <= 0) return;
  const corre = o.parado ? 0 : 1, sw = Math.sin(fase) * .75 * corre;
  ctx.save(); ctx.globalAlpha *= clamp(a); ctx.translate(x, y); ctx.scale(s * (o.vira ? -1 : 1), s); ctx.rotate(o.giro || 0);
  ctx.lineCap = ctx.lineJoin = 'round'; ctx.strokeStyle = cor; ctx.shadowColor = cor; ctx.shadowBlur = 24; ctx.lineWidth = 12;
  const hip = [0, -92], sh = [0, -158], perna = (ang, k) => { const jx = hip[0] + Math.sin(ang) * 46, jy = hip[1] + Math.cos(ang) * 46;
    const fx = jx + Math.sin(ang - .6 * k) * 46, fy = jy + Math.cos(ang - .6 * k) * 46; ctx.beginPath(); ctx.moveTo(...hip); ctx.lineTo(jx, jy); ctx.lineTo(fx, fy); ctx.stroke(); };
  perna(sw, Math.max(0, Math.sin(fase))); perna(-sw, Math.max(0, -Math.sin(fase)));
  ctx.beginPath(); ctx.moveTo(...hip); ctx.lineTo(sh[0] + 6 * corre, sh[1]); ctx.stroke(); // tronco
  const braco = (ang) => { ctx.beginPath(); ctx.moveTo(sh[0] + 6 * corre, sh[1] + 6); ctx.lineTo(sh[0] + Math.sin(ang) * 40, sh[1] + 6 + Math.cos(ang) * 40);
    ctx.lineTo(sh[0] + Math.sin(ang) * 40 + Math.sin(ang + 1.2) * 34, sh[1] + 6 + Math.cos(ang) * 40 + Math.cos(ang + 1.2) * 34 * .6); ctx.stroke(); };
  if (o.comemora) { [[-1], [1]].forEach(([k]) => { ctx.beginPath(); ctx.moveTo(sh[0], sh[1] + 6); ctx.lineTo(k * 34, sh[1] - 34); ctx.lineTo(k * 44, sh[1] - 74); ctx.stroke(); }); }
  else { braco(-sw * 1.1); braco(sw * 1.1); }
  // cabeça
  const hx = sh[0] + 8 * corre, hy = sh[1] - 34;
  ctx.fillStyle = 'rgba(3,4,8,.9)'; ctx.lineWidth = 9;
  if (quem === 'astro') {
    ctx.beginPath(); ctx.arc(hx, hy - 4, 36, 0, 7); ctx.fill(); ctx.stroke();
    ctx.lineWidth = 6; ctx.strokeStyle = BR; ctx.shadowColor = BR; rr(hx - 6, hy - 22, 40, 26, 12); ctx.stroke();
  } else {
    ctx.beginPath(); ctx.arc(hx, hy, 26, 0, 7); ctx.fill(); ctx.stroke();
    if (quem === 'jogador') { ctx.beginPath(); ctx.arc(hx, hy - 4, 27, Math.PI * 1.05, Math.PI * 1.95); ctx.lineWidth = 14; ctx.stroke(); }
    if (quem === 'vova') { ctx.beginPath(); ctx.arc(hx - 8, hy - 34, 13, 0, 7); ctx.stroke(); ctx.lineWidth = 5; ctx.strokeStyle = BR; ctx.shadowColor = BR;
      ctx.beginPath(); ctx.arc(hx + 8, hy - 2, 8, 0, 7); ctx.moveTo(hx + 30, hy - 2); ctx.arc(hx + 22, hy - 2, 8, 0, 7); ctx.stroke(); }
    if (quem === 'gato') { ctx.beginPath(); ctx.moveTo(hx - 22, hy - 14); ctx.lineTo(hx - 18, hy - 46); ctx.lineTo(hx - 2, hy - 24); ctx.moveTo(hx + 4, hy - 25); ctx.lineTo(hx + 20, hy - 46); ctx.lineTo(hx + 23, hy - 13); ctx.stroke();
      ctx.lineWidth = 4; ctx.beginPath(); [-1, 1].forEach(k => { ctx.moveTo(hx + 14, hy + 6 + k * 4); ctx.lineTo(hx + 40, hy + 4 + k * 10); }); ctx.stroke(); }
  }
  ctx.restore();
}
function bola(x, y, s, a = 1, giro = 0) {
  if (a <= 0) return; ctx.save(); ctx.globalAlpha *= clamp(a); ctx.translate(x, y); ctx.scale(s, s); ctx.rotate(giro);
  ctx.shadowColor = BR; ctx.shadowBlur = 30; ctx.fillStyle = '#f4f8ff'; ctx.beginPath(); ctx.arc(0, 0, 15, 0, 7); ctx.fill();
  ctx.shadowBlur = 0; ctx.fillStyle = '#0a1d45'; ctx.beginPath(); for (let i = 0; i < 5; i++) { const an = i * 1.2566; ctx.lineTo(Math.cos(an) * 6, Math.sin(an) * 6); } ctx.fill(); ctx.restore();
}
// ---------- o lance (simulação): chapéu no 1º marcador, drible no 2º e gol ----------
// q de 0 a 1; ox,oy = centro do gramado (linha do chão); quem = personagem do atacante
function lance(ox, oy, s, q, quem, a = 1, o = {}) {
  if (a <= 0) return; q = clamp(q);
  ctx.save(); ctx.globalAlpha *= clamp(a); ctx.translate(ox, oy); ctx.scale(s, s);
  // gramado e gol
  ctx.lineCap = 'round'; ctx.strokeStyle = hex(AZ, .7); ctx.lineWidth = 5; ctx.shadowColor = AZ; ctx.shadowBlur = 16;
  ctx.beginPath(); ctx.moveTo(-350, 0); ctx.lineTo(350, 0); ctx.stroke();
  for (let i = -3; i <= 3; i++) { ctx.globalAlpha = a * .25; ctx.beginPath(); ctx.moveTo(i * 100 - 30, 22); ctx.lineTo(i * 100 + 30, 22); ctx.stroke(); }
  ctx.globalAlpha = clamp(a);
  const gol = q > .8 ? Math.pow(1 - clamp((q - .8) / .2), 2) : 0;
  ctx.strokeStyle = BR; ctx.shadowColor = CI; ctx.lineWidth = 7;
  ctx.beginPath(); ctx.moveTo(295, 0); ctx.lineTo(295, -150); ctx.lineTo(345, -130); ctx.lineTo(345, 0); ctx.stroke();
  ctx.lineWidth = 2; ctx.strokeStyle = hex(CI, .5 + .5 * gol); for (let k = 1; k < 5; k++) { ctx.beginPath(); ctx.moveTo(295 + k * 10 + 8 * gol * Math.sin(k), -150 + k * 4); ctx.lineTo(295 + k * 10 + 8 * gol * Math.sin(k), 0); ctx.stroke(); }
  // atacante
  const xa = q < .78 ? lerp(-320, 190, q / .78) : 190 + 25 * ease(clamp((q - .78) / .1));
  const fase = q * 40, comemora = q > .86;
  // marcadores
  const sobe1 = q > .14 && q < .36 ? Math.sin(Math.PI * (q - .14) / .22) : 0;
  boneco(-100, -70 * sobe1, 1, 0, AZ, 'jogador', 1, { parado: true, vira: true, giro: -.25 * sobe1 });
  const k2 = clamp((q - .46) / .1), cai = clamp((q - .54) / .08);
  boneco(90 - 60 * ease(k2), 0, 1, 0, AZ, 'jogador', 1, { parado: true, vira: true, giro: -1.1 * ease(cai) });
  boneco(xa, 0, 1, fase, CI, quem, 1, { parado: comemora, comemora });
  // bola
  let bx, by;
  const pe = x => [x + 30, -14 - 10 * Math.abs(Math.sin(fase))];
  if (q < .15) [bx, by] = pe(xa);
  else if (q < .33) { const u = (q - .15) / .18, x0 = lerp(-320, 190, .15 / .78) + 30, x1 = lerp(-320, 190, .33 / .78) + 30; bx = lerp(x0, x1, u); by = -14 - 290 * Math.sin(Math.PI * u); }
  else if (q < .68) [bx, by] = pe(xa);
  else if (q < .8) { const u = ease((q - .68) / .12), x0 = lerp(-320, 190, .68 / .78) + 30; bx = lerp(x0, 320, u); by = lerp(-14, -70, u); }
  else { bx = 320; by = -14 - 30 * Math.abs(Math.sin((q - .8) * 30)) * (1 - clamp((q - .8) / .15)); }
  bola(bx, by, 1.1, 1, q * 30);
  if (o.rotulos) {
    const r1 = prog(q, .2, .26) * (1 - prog(q, .38, .44)), r2 = prog(q, .5, .56) * (1 - prog(q, .66, .7)), r3 = prog(q, .82, .86);
    if (r1 > 0) txt('CHAPÉU!', -100, -400, EXP, 52, CI, { align: 'center', alpha: r1 });
    if (r2 > 0) txt('DRIBLE!', 90, -330, EXP, 52, CI, { align: 'center', alpha: r2 });
    if (r3 > 0) txt('GOL!', 240, -330, EXP, 64, CI, { align: 'center', alpha: r3 });
  }
  ctx.restore();
}
// tela escura de vídeo com barra de tempo; conteudo() desenha dentro (recortado)
function tela(x, y, w, h, a, titulo, conteudo, barra) {
  if (a <= 0) return; const e = .9 + .1 * back(clamp(a));
  ctx.save(); ctx.globalAlpha *= clamp(a * 1.5); ctx.translate(x + w / 2, y + h / 2); ctx.scale(e, e); ctx.translate(-x - w / 2, -y - h / 2);
  ctx.shadowColor = hex(AZ, .7); ctx.shadowBlur = 50; ctx.fillStyle = '#070b16'; rr(x, y, w, h, 24); ctx.fill(); ctx.shadowBlur = 0;
  ctx.strokeStyle = hex(CI, .8); ctx.lineWidth = 3; rr(x, y, w, h, 24); ctx.stroke();
  txt(titulo, x + 30, y + 40, ARC, 26, 'rgba(244,248,255,.75)', { weight: 600 });
  ctx.save(); rr(x, y + 64, w, h - 64 - (barra ? 70 : 0), 0); ctx.clip(); conteudo(); ctx.restore();
  if (barra) barra(x + 30, y + h - 40, w - 60);
  ctx.restore();
}
Object.assign(P, {
  alerta() { ctx.beginPath(); ctx.moveTo(0, -96); ctx.lineTo(100, 80); ctx.lineTo(-100, 80); ctx.closePath(); ctx.moveTo(8, -30); ctx.lineTo(-8, -30); ctx.lineTo(-5, 30); ctx.lineTo(5, 30); ctx.closePath(); ctx.moveTo(10, 52); ctx.arc(0, 52, 10, 0, 7); },
});
const QUEM = ['vova', 'gato', 'astro'];
const S = [
  // 0 · gancho: o lance acontecendo já no quadro 1, e o atacante vira outro personagem
  (t, lt) => {
    frase('O lance que tá', 290, -1, SC[1] - .2, 92, { t, cor: CI }); frase('em todo lugar', 400, -1, SC[1] - .2, 92, { t, hot: 'todo lugar', cor: CI });
    const tq = wt('qualquer', 0), troca = t >= tq;
    lance(cx0, 1010, 1.25, lt / 3.2, troca ? 'vova' : 'jogador', 1, { rotulos: true });
    if (Math.abs(t - tq) < .25) { ctx.save(); ctx.globalCompositeOperation = 'lighter'; luz(cx0 + 200, 850, 500, 500, CI, .6 * (1 - Math.abs(t - tq) / .25)); ctx.restore(); }
    frase('com QUALQUER personagem', 1250, tq - .1, SC[1] - .2, 60, { t, hot: 'QUALQUER', cor: CI });
    exemplo(cx0, 1360, prog(lt, .3, .6));
  },
  // 1 · o que é: mesmo movimento, personagem trocado
  (t, lt) => {
    frase('Gol do Özil · 2016', 300, SC[1], SC[2] - .2, 76, { t, hot: 'Özil', cor: CI });
    const per = 2.2, k = Math.floor(lt / per), q = (lt % per) / per;
    lance(cx0, 980, 1.2, q * 1.1, QUEM[k % 3], 1);
    selo('a IA copia o movimento', cx0, 1160, prog(t, wt('copia', 1), wt('copia', 1) + .3));
    linhaTxt('e troca só quem faz a jogada', 1290, wt('troca', 1), SC[2] - .2, t, 46, CI);
    exemplo(cx0, 1390, prog(lt, .3, .6));
  },
  // 2 · CapCut x Kling
  (t, lt) => {
    neon3d(P.play, cx0, 600, 150 * back(prog(lt, .05, .5)), .4 * Math.sin(t * .9), .3, IN, prog(lt, .05, .3));
    frase('modelo pronto do CapCut', 880, wt('modelo', 2) - .1, SC[3] - .2, 64, { t, hot: 'CapCut', cor: CI });
    linhaTxt('é o que quase todo mundo usa', 980, wt('quase', 2) + .2, SC[3] - .2, t, 40, 'rgba(244,248,255,.8)');
    frase('Sem CapCut? Kling', 1180, wt('sem', 2) - .1, SC[3] - .2, 80, { t, hot: 'Kling', cor: CI });
  },
  // 3 · passo 1: recortar a jogada
  (t, lt) => {
    numero(1, 300, SC[3], SC[4] - .2, t);
    frase('Recorte só a jogada', 470, wt('recorte', 3) - .1, SC[4] - .2, 72, { t, hot: 'jogada', cor: CI });
    const sel = prog(t, wt('5', 3), wt('10', 3) + .3);
    tela(cx0 - 400, 580, 800, 560, prog(lt, .1, .4), 'lance.mp4', () => lance(cx0, 1000, .95, (lt % 2.4) / 2.4 * 1.05, 'jogador', 1), (x, y, w) => {
      ctx.fillStyle = 'rgba(244,248,255,.18)'; rr(x, y - 8, w, 16, 8); ctx.fill();
      const s0 = x + w * .3, s1 = x + w * lerp(.3, .62, ease(sel));
      ctx.fillStyle = CI; ctx.shadowColor = CI; ctx.shadowBlur = 20; rr(s0, y - 14, Math.max(8, s1 - s0), 28, 10); ctx.fill(); ctx.shadowBlur = 0;
      if (sel > 0) txt(Math.round(lerp(0, 10, ease(sel))) + ' s', s1 + 20, y + 2, ARC, 30, BR, { weight: 600, alpha: sel });
    });
    linhaTxt('5 a 10 s · sem cortes de câmera', 1250, wt('5', 3), SC[4] - .2, t, 46);
    exemplo(cx0, 1350, prog(lt, .4, .7));
  },
  // 4 · passo 2: foto do personagem
  (t, lt) => {
    numero(2, 300, SC[4], SC[5] - .2, t);
    frase('Foto do personagem', 470, wt('foto', 4) - .1, SC[5] - .2, 72, { t, hot: 'personagem', cor: CI });
    const a = prog(lt, .1, .4); if (a > 0) {
      const e = back(clamp(a)); ctx.save(); ctx.translate(cx0, 860); ctx.scale(e, e); ctx.globalAlpha *= clamp(a * 2);
      ctx.shadowColor = hex(CI, .7); ctx.shadowBlur = 50; ctx.fillStyle = '#f4f7ff'; rr(-210, -250, 420, 500, 20); ctx.fill(); ctx.shadowBlur = 0;
      ctx.fillStyle = '#070b16'; rr(-185, -225, 370, 400, 10); ctx.fill();
      ctx.restore();
      boneco(cx0, 860 + 140 * e, 1.5 * e, 0, CI, 'vova', clamp(a * 2), { parado: true });
      txt('personagem.png', cx0, 860 + 212 * e, ARC, 28, '#1b2440', { align: 'center', weight: 600, alpha: clamp(a * 2) });
    }
    selo('corpo inteiro', cx0 - 190, 1230, prog(t, wt('corpo', 4), wt('corpo', 4) + .3));
    selo('fundo limpo', cx0 + 200, 1230, prog(t, wt('fundo', 4), wt('fundo', 4) + .3));
    exemplo(cx0, 1340, prog(lt, .4, .7));
  },
  // 5 · passo 3: Kling > Motion Control
  (t, lt) => {
    numero(3, 300, SC[5], SC[6] - .2, t);
    frase('Kling · Motion Control', 470, wt('kling', 5) - .1, SC[6] - .2, 70, { t, hot: 'Motion Control', cor: CI });
    const g = wt('gere', 5);
    janela(560, 760, prog(lt, .1, .4), 'kling.ai · Motion Control', (x, y, w) => {
      let yy = y;
      yy += campo(x, yy, w, 'Vídeo do movimento', '✓ lance.mp4', prog(t, wt('video', 5) - .2, wt('video', 5) + .1), prog(t, wt('video', 5), wt('video', 5) + .2) * (1 - prog(t, wt('foto', 5), wt('foto', 5) + .1)));
      yy += campo(x, yy, w, 'Imagem do personagem', '✓ personagem.png', prog(t, wt('foto', 5) - .2, wt('foto', 5) + .1), prog(t, wt('foto', 5), wt('foto', 5) + .2) * (1 - prog(t, wt('modelo', 5), wt('modelo', 5) + .1)));
      yy += campo(x, yy, w, 'Modelo', '2.6 · Standard', prog(t, wt('modelo', 5) - .2, wt('modelo', 5) + .1), prog(t, wt('standard', 5), wt('standard', 5) + .2) * (1 - prog(t, g, g + .1)));
      botao(x, yy + 10, 'gerar vídeo', prog(t, wt('escolha', 5), wt('escolha', 5) + .3), prog(t, g + .2, g + .5));
    });
    exemplo(cx0, 1390, prog(lt, .4, .7));
  },
  // 6 · custo e limite grátis
  (t, lt) => {
    frase('5 créditos por segundo', 330, wt('5', 6) - .1, SC[7] - .2, 70, { t, hot: '5 créditos', cor: CI });
    frase('8 s = 40 créditos', 480, wt('8', 6) - .1, SC[7] - .2, 80, { t, hot: '40 créditos', cor: CI });
    lance(cx0, 980, 1.1, (lt % 2.6) / 2.6 * 1.05, 'astro', prog(lt, .1, .4)); selo('resultado: outro personagem, mesmo lance', cx0, 640, prog(lt, .1, .4), CI, 1 - prog(t, wt('8', 6) - .4, wt('8', 6) - .1));
    selo('cabe no grátis do dia', cx0, 1150, prog(t, wt('cabem', 6), wt('cabem', 6) + .3));
    linhaTxt("com marca d'água · Kling 2.6 Standard", 1270, wt('marca', 6), SC[7] - .2, t, 40, 'rgba(244,248,255,.85)');
  },
  // 7 · cuidado
  (t, lt) => {
    neon3d(P.alerta, cx0, 560, 140 * back(prog(lt, .05, .5)), .3 * Math.sin(t * .9), .2, VERM, prog(lt, .05, .3));
    frase('Personagem inventado', 820, wt('personagem', 7) - .1, SC[8] - .2, 72, { t, hot: 'inventado', cor: CI });
    linhaTxt('ou foto com permissão', 920, wt('ou', 7), SC[8] - .2, t, 50);
    linhaTxt('lance da TV pode tomar bloqueio', 1100, wt('lance', 7), SC[8] - .2, t, 48, VERM);
    linhaTxt('(no nosso vídeo, o lance é simulação)', 1180, wt('bloqueio', 7), SC[8] - .2, t, 34, 'rgba(244,248,255,.7)');
  },
  // 8 · logo + chamada
  (t, lt) => fim(t, lt, 'Salva e faz o seu', 'segue o canal'),
];
</script></body></html>
