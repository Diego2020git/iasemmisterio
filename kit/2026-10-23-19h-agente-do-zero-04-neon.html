<!doctype html>
<html><head><meta charset="utf-8">
<style>
@font-face{font-family:"AX";src:url(fontes/ArchivoExpanded-ExtraBold.ttf);font-weight:800}
@font-face{font-family:"AR";src:url(fontes/Archivo-SemiBold.ttf);font-weight:600}
html,body{margin:0;background:#000}canvas{display:block}
</style></head><body>
<img id="logo" src="marca/logo.png" style="display:none">
<canvas id="c" width="1080" height="1920"></canvas>
<script src="audio/2026-10-23-agente-do-zero-04.tempos.js"></script>
<script src="raiox-kit.js"></script>
<script src="neon-kit.js"></script>
<script src="neon-extra.js"></script>
<script>
// 23/10/2026 · 19h · Agente do zero #4: dar conhecimento (horário, preços e entrega nas System instructions). Neon.
const T0 = TEMPOS.cenas;
const SC = [T0[0], T0[1], T0[2], T0[3], T0[4], T0[5], T0[6], T0[7] + .7];
const DURATION = SC[7], IMPACTO = SC[6] + .4;
const COR = [AZ, CI, AZ, CI, IN, CI, AZ];
const HITS = [wt('horario', 0), wt('zero', 1), wt('studio', 2), wt('cole', 3), wt('casamento', 4), wt('custo', 5)];
const CLIQUES = [];
const CK = [[0, 0, 0, 0, 0], [DURATION, 0, 0, 0, 0]];
const INFO = ['Informações da Padaria Sol:', 'Seg a sáb, 6h às 20h. Dom, 7h às 12h.', 'Pão francês: R$ 1,00. Bolo: R$ 25,00.', 'Entrega só no Centro, taxa R$ 5,00.', 'Encomendas com 1 dia de antecedência.'];
const S = [
  // 0 · gancho: o agente sabe horário, preço e entrega
  (t, lt) => {
    frase('O agente agora sabe', 300, -1, SC[1] - .2, 78, { t, hot: 'sabe', cor: CI });
    neon3d(P.chip, cx0, cy0 - 60, 170 * back(prog(lt, .05, .5)), .35 * Math.sin(t * .9), .3, CI, prog(lt, .05, .3));
    selo('horário', cx0 - 260, 1100, prog(t, wt('horario', 0) - .1, wt('horario', 0) + .2));
    selo('preço', cx0, 1100, prog(t, wt('preco', 0) - .1, wt('preco', 0) + .2));
    selo('entrega', cx0 + 260, 1100, prog(t, wt('entrega', 0) - .1, wt('entrega', 0) + .2));
  },
  // 1 · série
  (t, lt) => {
    neon3d(P.balao, cx0, cy0 - 110, 200 * back(prog(lt, .05, .5)), .4 * Math.sin(t * .9), .3, CI, prog(lt, .05, .3));
    frase('Agente do zero', cy0 + 200, wt('agente', 1) - .1, SC[2] - .2, 92, { t, hot: 'zero', cor: CI });
    selo('episódio 4', cx0, cy0 + 340, prog(t, wt('episodio', 1), wt('episodio', 1) + .3));
    linhaTxt('sem informações, não sabe responder', cy0 + 460, wt('sem', 1), SC[2] - .2, t, 42);
  },
  // 2 · passo 1: abrir o chat do episódio 3
  (t, lt) => {
    numero(1, 300, SC[2], SC[3] - .2, t);
    frase('Abra o chat do ep. 3', 470, wt('abra', 2) - .1, SC[3] - .2, 74, { t, hot: 'ep. 3', cor: CI });
    janela(640, 440, prog(lt, .1, .4), 'Google AI Studio', (x, y, w) => {
      campo(x, y, w - 140, 'System instructions', 'Você é o atendente...', prog(t, wt('instrucoes', 2) - .3, wt('instrucoes', 2)), prog(t, wt('instrucoes', 2), wt('instrucoes', 2) + .2));
    });
    exemplo(cx0, 1200, prog(lt, .4, .7));
  },
  // 3 · passo 2: colar as informações
  (t, lt) => {
    numero(2, 300, SC[3], SC[4] - .2, t);
    frase('Cole as informações', 470, wt('cole', 3) - .1, SC[4] - .2, 76, { t, hot: 'informações', cor: CI });
    janela(600, 600, prog(lt, .1, .4), 'System instructions', (x, y, w) => {
      txt('Você é o atendente da Padaria Sol...', x, y + 30, ARC, 30, '#8a93a8', { weight: 600 });
      INFO.forEach((l, k) => txt(l, x, y + 110 + k * 70, ARC, k ? 32 : 34, '#1b2440', { weight: 600, alpha: prog(t, SC[3] + .5 + k * .5, SC[3] + .8 + k * .5) }));
    });
    linhaTxt('texto completo na legenda', 1280, wt('legenda', 3) - .3, SC[4] - .2, t, 38, 'rgba(244,248,255,.8)');
    exemplo(cx0, 1390, prog(lt, .4, .7));
  },
  // 4 · passo 3: testar 3 perguntas
  (t, lt) => {
    numero(3, 300, SC[4], SC[5] - .2, t);
    frase('Teste 3 perguntas', 470, wt('teste', 4) - .1, SC[5] - .2, 80, { t, hot: '3 perguntas', cor: CI });
    celular(cx0, 1010, .82, -.15 + .1 * sm(lt / 3), prog(lt, .1, .4), (x, y, w, s) => {
      let yy = y; yy += msg(x, yy, w, 'Abre domingo?', false, prog(t, wt('domingo', 4) - .3, wt('domingo', 4)), s);
      yy += msg(x, yy, w, 'Das 7h às 12h.', true, prog(t, wt('domingo', 4) + .2, wt('domingo', 4) + .5), s);
      yy += msg(x, yy, w, 'Quanto é o bolo?', false, prog(t, wt('bolo', 4) - .2, wt('bolo', 4)), s);
      yy += msg(x, yy, w, 'R$ 25,00.', true, prog(t, wt('bolo', 4) + .3, wt('bolo', 4) + .6), s);
      yy += msg(x, yy, w, 'Bolo de casamento?', false, prog(t, wt('casamento', 4) - .3, wt('casamento', 4)), s);
      msg(x, yy, w, 'Vou chamar a equipe.', true, prog(t, wt('casamento', 4) + .3, wt('casamento', 4) + .6), s);
    }, 'AI Studio', AZ);
    exemplo(cx0, 1580, prog(lt, .4, .7));
  },
  // 5 · resultado + custo
  (t, lt) => {
    neon3d(P.check, cx0, cy0 - 120, 190 * back(prog(lt, .05, .5)), .3 * Math.sin(t * .8), .3, CI, prog(lt, .05, .3));
    frase('Acerta o que sabe', cy0 + 120, wt('acerta', 5) - .1, SC[6] - .2, 76, { t, hot: 'sabe', cor: CI });
    linhaTxt('e chama a equipe no resto', cy0 + 230, wt('ultima', 5), SC[6] - .2, t, 46);
    selo('custo: zero, no AI Studio', cx0, cy0 + 350, prog(t, wt('custo', 5), wt('custo', 5) + .3));
  },
  // 6 · logo + chamada
  (t, lt) => fim(t, lt, 'Segue a série', 'segunda: episódio 5'),
];
</script></body></html>
