<canvas id="c" width="1080" height="1920"></canvas>

<script>
// 30/10/2026 · 12h · Radar IA #15 (61 s): Gemini edita arquivos no chat, GPT-6 grátis mais conciso + Model Spec, Connected Apps Platform (Localiza). Neon + neon-entrega.js.
// Fontes: blog.google (edit files directly, 29/10; Connected Apps Platform, 28/10), help.openai.com (Model Release Notes, 29/10).
const T0 = TEMPOS.cenas;
const SC = [T0[0], T0[1], T0[2], T0[3], T0[4], T0[5], T0[6], T0[7], T0[8], T0[9] + .7];
const DURATION = SC[9], IMPACTO = SC[8] + .4;
const COR = [AZ, CI, CI, VERDE, IN, IN, AZ, AZ, AZ];
const HITS = [wt('arquivos', 0), wt('direto', 0), wt('busca', 0), wt('radar', 1), wt('tela', 2), wt('refazer', 2), wt('gratis', 3), wt('computador', 3), wt('curto', 4), wt('elogio', 4), wt('regras', 5), wt('previa', 6), wt('localiza', 6), wt('unidos', 6), wt('editar', 7)];
const CLIQUES = [];
const CK = [[0, 0, 0, 0, 0], [DURATION, 0, 0, 0, 0]];
// documento em tela cheia com trecho selecionado
function doc(x, y, w, h, t, sel, novo) { ctx.fillStyle = '#ffffff'; rr(x, y, w, h, 16); ctx.fill();
  txt('Proposta para cliente', x + 40, y + 70, EXP, 36, '#1b2440');
  [.9, .75, .85, .6, .8].forEach((f, i) => { const yy = y + 130 + i * 56;
    if (i === 2 && sel > 0) { ctx.save(); ctx.globalAlpha *= sel; ctx.fillStyle = novo > 0 ? '#c9f2d8' : '#cfe0ff'; ctx.fillRect(x + 32, yy - 8, (w - 80) * f + 16, 40); ctx.restore(); }
    ctx.fillStyle = i === 2 && novo > 0 ? '#1e7e45' : '#b9c3d8'; rr(x + 40, yy, (w - 80) * f, 22, 11); ctx.fill(); }); }
// resposta longa x curta
function balao(x, y, w, linhas, a, cor, rot) { if (a <= 0) return; ctx.save(); ctx.globalAlpha *= clamp(a); ctx.fillStyle = 'rgba(10,20,50,.85)'; ctx.strokeStyle = cor; ctx.lineWidth = 3; ctx.shadowColor = cor; ctx.shadowBlur = 18;
  const h = 90 + linhas * 40; rr(x, y, w, h, 22); ctx.fill(); ctx.stroke(); ctx.shadowBlur = 0; txt(rot, x + 30, y + 46, ARC, 28, cor, { weight: 800, ls: 2 });
  for (let i = 0; i < linhas; i++) { ctx.fillStyle = 'rgba(220,230,255,.55)'; rr(x + 30, y + 80 + i * 40, (w - 60) * (i === linhas - 1 ? .55 : 1), 18, 9); ctx.fill(); } ctx.restore(); return h; }
// Gemini no centro, apps em volta
function hub(x, y, t, n, busca) { const A = [['Localiza', VERDE], ['Adobe', VERM], ['Experian', CI], ['Peloton', AMB]];
  A.forEach(([s, c], i) => { const q = clamp(n - i); if (q <= 0) return; const ang = -Math.PI / 2 + i * Math.PI / 2 + .25 * Math.sin(t * .3), r = 270;
    fio(x, y, x + Math.cos(ang) * r, y + Math.sin(ang) * r * .8, q, c, t); pilula(s, x + Math.cos(ang) * r, y + Math.sin(ang) * r * .8, 250, q, c, '', 1, 34); });
  ctx.save(); ctx.fillStyle = 'rgba(10,20,50,.95)'; ctx.strokeStyle = CI; ctx.lineWidth = 5; ctx.shadowColor = CI; ctx.shadowBlur = 30; ctx.beginPath(); ctx.arc(x, y, 95, 0, 7); ctx.fill(); ctx.stroke(); ctx.restore();
  txt('Gemini', x, y + 2, EXP, 34, BR, { align: 'center' }); }
const S = [
  // 0 · gancho
  (t, lt) => {
    linhaTxt('RADAR IA · 30/10', 330, -1, SC[1] - .2, t, 40, CI);
    versao('GEMINI EDITA SEUS ARQUIVOS', cx0, 560, prog(t, -1, .1), CI, 0, 38);
    versao('CHATGPT GRÁTIS MAIS DIRETO', cx0, 820, prog(t, wt('chatgpt', 0) - .2, wt('chatgpt', 0) + .2), IN, 0, 38);
    versao('APPS DO GEMINI NA BUSCA', cx0, 1080, prog(t, wt('apps', 0) - .2, wt('apps', 0) + .2), VERDE, 0, 38);
  },
  // 1 · radar
  (t, lt) => {
    neon3d(P.radar, cx0, 700, 230 * back(prog(lt, .05, .4)), .4 * Math.sin(t * .9), .3, CI, prog(lt, .05, .25));
    titulo('RADAR IA', 1050, SC[1], SC[2] - .2, t, 110, BR, 'IA', CI);
  },
  // 2 · Gemini edita arquivos
  (t, lt) => {
    numero(1, 300, SC[2], SC[3] - .2, t);
    titulo('EDITA NO CHAT', 450, wt('gemini', 2) - .2, SC[3] - .2, t, 84, BR, 'CHAT', CI);
    [['Documento', 'documento'], ['PDF', 'pdf'], ['Apresentação', 'apresentacao'], ['Planilha', 'planilha']].forEach(([s, k], i) =>
      pilula(s, cx0 - 230 + (i % 2) * 460, 600 + Math.floor(i / 2) * 120, 400, prog(t, wt(k, 2) - .2, wt(k, 2) + .1) * (1 - prog(t, wt('tela', 2) - .3, wt('tela', 2))), CI, '', 1, 36));
    const a = prog(t, wt('tela', 2) - .3, wt('cheia', 2));
    if (a > 0) { ctx.save(); ctx.globalAlpha *= a; doc(cx0 - 380, 560 - 40 * (1 - a), 760, 470, t, prog(t, wt('mudanca', 2), wt('pede', 2)), prog(t, wt('refazer', 2), wt('trecho', 2) + .2)); ctx.restore(); }
    botao(cx0, 1150, 'refazer este trecho', prog(t, wt('pede', 2) - .2, wt('pede', 2)), prog(t, wt('refazer', 2), wt('refazer', 2) + .2), VERDE);
    exemplo(cx0, 1260, a);
  },
  // 3 · quem usa
  (t, lt) => {
    titulo('QUEM PODE USAR', 380, SC[3], SC[4] - .2, t, 86, BR, 'USAR', VERDE);
    pilula('grátis', cx0, 600, 300, prog(t, wt('gratis', 3) - .2, wt('gratis', 3) + .2), VERDE, '', 1, 52);
    pilula('todos os idiomas do app', cx0, 760, 680, prog(t, wt('idiomas', 3) - .2, wt('idiomas', 3) + .2), CI, '', 1, 42);
    pilula('PDF: celular e computador', cx0, 920, 700, prog(t, wt('pdf', 3) - .2, wt('celular', 3) + .2), CI, '', 1, 40);
    pilula('outros formatos: só computador', cx0, 1080, 760, prog(t, wt('resto', 3) - .2, wt('computador', 3) + .2), AMB, '', 1, 38);
  },
  // 4 · ChatGPT mais curto
  (t, lt) => {
    numero(2, 300, SC[4], SC[5] - .2, t);
    titulo('RESPOSTA MAIS CURTA', 450, wt('chatgpt', 4) - .2, SC[5] - .2, t, 70, BR, 'CURTA', IN);
    const fora = prog(t, wt('curto', 4) - .2, wt('curto', 4) + .2);
    balao(cx0 - 380, 560, 760, 6, prog(t, wt('login', 4) - .3, wt('login', 4)) * (1 - fora), AMB, 'ANTES');
    balao(cx0 - 380, 640 + 80 * (1 - fora), 760, 2, fora, VERDE, 'AGORA');
    pilula('menos elogio exagerado', cx0, 1110, 640, prog(t, wt('elogio', 4) - .2, wt('exagerado', 4)), VERDE, '', 1, 38);
    pilula('Plus e Pro: modelo principal igual', cx0, 1250, 820, prog(t, wt('plus', 4) - .2, wt('mudou', 4)), CI, '', 1, 36);
  },
  // 5 · regras públicas
  (t, lt) => {
    titulo('REGRAS PÚBLICAS', 380, SC[5], SC[6] - .2, t, 84, BR, 'PÚBLICAS', IN);
    neon3d(P.balao, cx0, 720, 170 * back(prog(lt, .05, .4)), .5 * Math.sin(t * .8), .2, IN, prog(lt, .05, .3));
    pilula('Model Spec', cx0, 1000, 520, prog(t, wt('regras', 5) - .2, wt('regras', 5) + .2), IN, 'COMO OS MODELOS DEVEM AGIR', 1, 44);
  },
  // 6 · apps no Gemini e na Busca
  (t, lt) => {
    numero(3, 300, SC[6], SC[7] - .2, t);
    titulo('APPS DENTRO DO GEMINI', 450, wt('google', 6) - .2, SC[7] - .2, t, 64, BR, 'GEMINI', VERDE);
    pilula('prévia', cx0 - 280, 560, 220, prog(t, wt('previa', 6) - .2, wt('previa', 6) + .2), AMB, '', 1, 34);
    hub(cx0, 900, t, 4 * prog(t, wt('apps', 6) - .2, wt('localiza', 6) + .3), 0);
    pilula('Busca: em breve', cx0 + 200, 560, 380, prog(t, wt('busca', 6) - .2, wt('busca', 6) + .2), CI, '', 1, 34);
    pilula('maioria só nos EUA', cx0, 1250, 560, prog(t, wt('maioria', 6) - .2, wt('unidos', 6) + .2), AMB, '', 1, 38);
  },
  // 7 · teste hoje
  (t, lt) => {
    titulo('TESTE HOJE', 330, SC[7], SC[8] - .2, t, 90, BR, 'HOJE', CI);
    janela(470, 560, prog(t, wt('peca', 7) - .3, wt('peca', 7) + .1), 'gemini.google.com', (x, y, w) => {
      const q = prog(t, wt('documento', 7) - .2, wt('documento', 7) + .2); ctx.save(); ctx.globalAlpha *= q; ctx.fillStyle = '#dfe8ff'; rr(x + w - 560, y + 20, 540, 70, 18); ctx.fill();
      txt('Crie uma lista de compras', x + w - 540, y + 56, ARC, 30, '#1b2440', { weight: 600 }); ctx.restore();
      const f = prog(t, wt('tela', 7) - .3, wt('cheia', 7)); ctx.save(); ctx.globalAlpha *= prog(t, wt('gemini', 7), wt('abra', 7));
      ctx.fillStyle = '#f2f5fc'; rr(x + 20 - 20 * f, y + 120 - 100 * f, w - 200 + 220 * f, 200 + 260 * f, 16); ctx.fill(); txt('Lista de compras', x + 50, y + 170 - 90 * f, EXP, 30, '#1b2440');
      ['Arroz', 'Café', 'Frutas'].forEach((s2, i) => txt('• ' + s2, x + 50, y + 225 - 90 * f + i * 46, ARC, 28, '#1b2440', { weight: 600 }));
      ctx.restore(); });
    exemplo(cx0, 1120, prog(t, wt('abra', 7), wt('abra', 7) + .3));
  },
  // 8 · fim
  (t, lt) => fim(t, lt, 'Siga o Radar IA', 'todo dia às 12h'),
];
</script></body></html>
