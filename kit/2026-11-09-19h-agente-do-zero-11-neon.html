<!doctype html>
<html><head><meta charset="utf-8">

<img id="logo" src="marca/logo.png" style="display:none">
<canvas id="c" width="1080" height="1920"></canvas>

<script>
// 09/11/2026 · 19h · Agente do zero #11 (fim da temporada): cliente marca horário → resposta "AGENDAR data hora" → filtro no Make → Google Calendar Create an Event. Padrão de entrega de 24/10. Neon + neon-entrega.js.
// Fontes: make.com/integrations/google-calendar (Create an Event), community.make.com (início + fim ou duração; parseDate com formato e fuso), make.com/pricing.
const T0 = TEMPOS.cenas;
const SC = [T0[0], T0[1], T0[2], T0[3], T0[4], T0[5], T0[6], T0[7] + .7];
const DURATION = SC[7], IMPACTO = SC[6] + .4;
const CLIQUES = [];
const CK = [[0, 0, 0, 0, 0], [DURATION, 0, 0, 0, 0]];
const COR = [AZ, CI, AZ, AMB, VERDE, AMB, AZ];
const HITS = [wt('horario', 0), wt('agenda', 0), wt('onze', 1), wt('temporada', 1), wt('agendar', 2), wt('hora', 2), wt('filtro', 3), wt('calendar', 3), wt('event', 3), wt('start', 4), wt('duracao', 4), wt('credito', 5), wt('temporada', 6)];
function conversa(x, y, w, s, t, t1, t2) {
  const b = (str, mine, yy, a) => { if (a <= 0) return; ctx.save(); ctx.globalAlpha *= clamp(a); const bw = Math.min(w * .92, measure(str, ARC, 28 * s, 600) + 46 * s);
    ctx.fillStyle = mine ? '#d9fdd3' : '#ffffff'; rr(mine ? x + w - bw : x, yy, bw, 70 * s, 18 * s); ctx.fill(); txt(str, (mine ? x + w - bw : x) + 22 * s, yy + 38 * s, ARC, 28 * s, '#1b2440', { weight: 600 }); ctx.restore(); };
  b('pode ser sexta às 15h?', 1, y + 20 * s, prog(t, t1 - .2, t1 + .2)); b('Combinado! Sexta, 15h.', 0, y + 110 * s, prog(t, t2 - .2, t2 + .2)); }
function mod(x, y, a, cor, nome, sub, on) { if (a <= 0) return; ctx.save(); ctx.globalAlpha *= clamp(a); const e = back(clamp(a)); ctx.translate(x, y); ctx.scale(e, e);
  ctx.shadowColor = cor; ctx.shadowBlur = on ? 50 : 18; ctx.fillStyle = hex(cor, on ? .95 : .7); ctx.beginPath(); ctx.arc(0, 0, 58, 0, 7); ctx.fill(); ctx.shadowBlur = 0;
  txt(nome, 0, 95, ARC, 24, BR, { align: 'center', weight: 700 }); txt(sub, 0, 128, ARC, 22, CI, { align: 'center', weight: 600 }); ctx.restore(); }
const MODS = [['WhatsApp', 'Watch', VERDE], ['Data store', 'Get', AMB], ['Gemini', 'Completion', AZ], ['WhatsApp', 'Send', VERDE], ['Data store', 'Add/replace', AMB]];
const XS = MODS.map((_, i) => 130 + i * 205);
function cadeia(y, n, t, on) { MODS.forEach(([a, b, c], i) => { mod(XS[i], y, clamp(n - i), c, a, b, on === i); if (i) fio(XS[i - 1] + 62, y, XS[i] - 62, y, clamp(n - i + .5), CI, t, true); }); }
function desvio(y0, y1, t, f, g, on) { const x = XS[2]; fio(x, y0 + 150, x, y1 - 50, f, AMB, t, true);
  if (f > 0) { ctx.save(); ctx.globalAlpha *= clamp(f); ctx.translate(x, y1); ctx.rotate(Math.PI / 4); ctx.fillStyle = hex(AMB, .9); ctx.shadowColor = AMB; ctx.shadowBlur = 30; ctx.fillRect(-36, -36, 72, 72); ctx.restore();
    txt('filtro', x, y1 + 70, ARC, 26, AMB, { align: 'center', weight: 700, alpha: clamp(f) }); }
  fio(x + 60, y1, XS[3] + 60, y1, g, AZ, t, true); mod(XS[3] + 130, y1, g, AZ, 'Google Calendar', 'Create an Event', on); }
// agenda com o horário marcado
function agendaDia(x, y, w, a, marcado) { if (a <= 0) return; ctx.save(); ctx.globalAlpha *= clamp(a); ctx.fillStyle = '#ffffff'; rr(x, y, w, 340, 18); ctx.fill();
  ctx.fillStyle = '#e8eefc'; rr(x, y, w, 70, 18); ctx.fill(); ctx.fillRect(x, y + 50, w, 20); txt('Google Agenda · sexta', x + 24, y + 38, ARC, 28, '#1b2440', { weight: 700 });
  ['14:00', '15:00', '16:00'].forEach((h, i) => { const yy = y + 100 + i * 80; txt(h, x + 24, yy + 20, ARC, 26, '#5a6a8f', { weight: 600 }); ctx.strokeStyle = '#dde4f3'; ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(x + 120, yy); ctx.lineTo(x + w - 20, yy); ctx.stroke(); });
  if (marcado > 0) { ctx.save(); ctx.globalAlpha *= clamp(marcado); ctx.fillStyle = '#2e6bff'; rr(x + 130, y + 182, w - 160, 72, 12); ctx.fill(); txt('Cliente · (número do WhatsApp)', x + 150, y + 218, ARC, 26, '#ffffff', { weight: 700 }); ctx.restore(); }
  ctx.restore(); }
const S = [
  // 0 · gancho
  (t, lt) => {
    titulo('O CLIENTE MARCA SOZINHO', 360, -1, SC[1] - .2, t, 66, BR, 'SOZINHO', AZ);
    celular(cx0 - 230, 760, .6, .12 * Math.sin(t * .6), prog(lt, 0, .3), (x, y, w, s) => conversa(x, y, w, s, t, .2, wt('whatsapp', 0)), 'Padaria Sol', VERDE);
    agendaDia(cx0 - 40, 960, 450, prog(t, wt('cai', 0) - .3, wt('cai', 0)), prog(t, wt('agenda', 0) - .3, wt('agenda', 0) + .1));
    exemplo(cx0, 1340, prog(lt, .3, .6));
  },
  // 1 · episódio
  (t, lt) => {
    titulo('AGENTE DO ZERO', 520, SC[1], SC[2] - .2, t, 84, BR, 'ZERO', CI);
    versao('EPISÓDIO 11', cx0, 720, prog(t, wt('episodio', 1) - .1, wt('episodio', 1) + .3), CI, 0, 60);
    pilula('último da temporada', cx0, 920, 560, prog(t, wt('ultimo', 1) - .2, wt('temporada', 1) + .2), AMB, '', 1, 42);
    cadeia(1120, 5 * prog(lt, .2, 1.6), t, -1);
  },
  // 2 · passo 1: regra no prompt
  (t, lt) => {
    numero(1, 300, SC[2], SC[3] - .2, t);
    titulo('A REGRA NO PROMPT', 450, wt('instrucoes', 2) - .2, SC[3] - .2, t, 76, BR, 'REGRA', AZ);
    janela(580, 480, prog(t, wt('instrucoes', 2) - .3, wt('instrucoes', 2)), 'Instruções do agente', (x, y, w) => {
      const L = ['Quando o cliente escolher', 'um horário, responda só:'];
      L.forEach((s, i) => txt(s, x + 30, y + 50 + i * 52, ARC, 34, '#1b2440', { weight: 600, alpha: prog(t, wt('quando', 2) + i * .5 - .2, wt('quando', 2) + i * .5 + .1) }));
      const q = prog(t, wt('agendar', 2) - .2, wt('hora', 2)); ctx.save(); ctx.globalAlpha *= q; ctx.fillStyle = '#d9fdd3'; rr(x + 20, y + 170, w - 40, 90, 16); ctx.fill();
      txt('AGENDAR 13/11/2026 15:00', x + 40, y + 226, EXP, 36, '#1e7e45'); ctx.restore(); });
    linhaTxt('a data e a hora, sempre nesse formato', 1150, wt('data', 2), SC[3] - .2, t, 34, CI);
  },
  // 3 · passo 2: filtro + Calendar
  (t, lt) => {
    numero(2, 300, SC[3], SC[4] - .2, t);
    titulo('FILTRO E AGENDA', 450, wt('make', 3) - .2, SC[4] - .2, t, 80, BR, 'AGENDA', AMB);
    cadeia(620, 5, t, prog(t, wt('gemini', 3) - .2, wt('gemini', 3) + .2) > .5 ? 2 : -1);
    desvio(620, 940, t, prog(t, wt('filtro', 3) - .2, wt('filtro', 3) + .4), prog(t, wt('calendar', 3) - .3, wt('calendar', 3) + .2), prog(t, wt('create', 3), wt('event', 3) + .2) > .5 ? 1 : 0);
    pilula('a resposta contém', cx0 - 180, 1170, 500, prog(t, wt('contem', 3) - .2, wt('agendar', 3) + .2), AMB, '“AGENDAR”', 1, 38);
  },
  // 4 · passo 3: Start Date
  (t, lt) => {
    numero(3, 300, SC[4], SC[5] - .2, t);
    titulo('DATA, HORA E DURAÇÃO', 450, wt('start', 4) - .3, SC[5] - .2, t, 66, BR, 'DURAÇÃO', VERDE);
    janela(560, 380, prog(t, wt('start', 4) - .3, wt('start', 4)), 'Create an Event', (x, y, w) => {
      campo(x + 20, y + 20, w - 40, 'Start Date', '13/11/2026 15:00 (da resposta)', prog(t, wt('ligue', 4) - .1, wt('hora', 4) + .2), prog(t, wt('hora', 4), wt('hora', 4) + .3));
      campo(x + 20, y + 160, w - 40, 'Duração', '1 hora', prog(t, wt('duracao', 4) - .3, wt('duracao', 4) + .1), prog(t, wt('duracao', 4), wt('duracao', 4) + .3)); });
    agendaDia(cx0 - 380, 980, 760, prog(t, wt('teste', 4) - .3, wt('teste', 4)), prog(t, wt('seu', 4) - .2, wt('seu', 4) + .2));
  },
  // 5 · custo
  (t, lt) => {
    titulo('QUANTO CUSTA', 380, SC[5], SC[6] - .2, t, 90, BR, 'CUSTA', AMB);
    mod(cx0, 680, prog(lt, .05, .4), AZ, 'Google Calendar', 'Create an Event', 1);
    if (prog(lt, .05, .4) > 0) txt('1', cx0, 682, EXP, 48, BR, { align: 'center', alpha: prog(lt, .05, .4) });
    pilula('+1 crédito por horário', cx0, 940, 600, prog(t, wt('credito', 5) - .2, wt('marcado', 5) + .2), AMB, 'MAKE GRÁTIS: 1.000 POR MÊS', 1, 42);
  },
  // 6 · fim
  (t, lt) => fim(t, lt, 'Comenta a próxima temporada', 'fim da temporada 1'),
];
</script></body></html>
