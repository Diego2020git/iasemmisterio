const T0 = TEMPOS.cenas;

// Fonte: faq.whatsapp.com/241617298315321 (pt_BR), conferida 13/11/2026.

function audio(x, y, s, a, t, tempo = '3:02') { if (a <= 0) return; ctx.save(); ctx.globalAlpha *= clamp(a); ctx.translate(x, y); ctx.scale(s * back(clamp(a)), s * back(clamp(a)));
  ctx.shadowColor = VERDE; ctx.shadowBlur = 30; ctx.fillStyle = 'rgba(10,40,28,.95)'; rr(-330, -80, 660, 160, 40); ctx.fill(); ctx.shadowBlur = 0; ctx.strokeStyle = VERDE; ctx.lineWidth = 4; rr(-330, -80, 660, 160, 40); ctx.stroke();
  ctx.fillStyle = VERDE; ctx.beginPath(); ctx.moveTo(-280, -34); ctx.lineTo(-226, 0); ctx.lineTo(-280, 34); ctx.closePath(); ctx.fill();
  for (let i = 0; i < 26; i++) { const h = 14 + 44 * Math.abs(Math.sin(i * 1.7 + 1) * Math.sin(t * 3 + i * .5)); ctx.fillStyle = i < 26 * ((t * .12) % 1) ? BR : 'rgba(244,248,255,.4)'; rr(-190 + i * 15, -h / 2, 8, h, 4); ctx.fill(); }
  txt(tempo, 250, 8, ARC, 38, BR, { align: 'center' }); ctx.restore(); }
function linhas(x, y, w, n, a, cor = BR) { if (a <= 0) return; const L = [1, .92, .78, .6]; for (let i = 0; i < n; i++) { const p = clamp(a * n - i); if (p <= 0) continue; ctx.fillStyle = hex(cor, .85); rr(x - w / 2, y + i * 46, w * L[i % 4] * p, 16, 8); ctx.fill(); } }
const S = [
  (t, lt) => {
    titulo('ÁUDIO DE 3 MINUTOS?', 340, -1, SC[1] - .2, t, 76, BR, '3 MINUTOS?', VERDE);
    audio(cx0, 620, 1.15, prog(lt, .1, .5), t);
    setaH(cx0 - 1, cx0, 0, 0);
    txt('↓', cx0, 800, EXP, 90, CI, { align: 'center', alpha: prog(t, wt('transforma', 0) - .2, wt('transforma', 0) + .2) });
    const a = prog(t, wt('texto', 0) - .3, wt('ler', 0) + .2);

  },
  (t, lt) => {

    titulo('ATIVE NO WHATSAPP', 450, wt('abra', 2) - .2, SC[3] - .2, t, 72, BR, 'ATIVE', AZ);

    pilula('Transcrição de mensagens de voz', cx0 - 60, 990, 720, a, VERDE, '', 1, 36);
    if (a > 0) { const on = ease(prog(t, wt('transcricao', 2), wt('voz', 2))); ctx.save(); ctx.globalAlpha *= clamp(a * 2); ctx.fillStyle = on > .5 ? VERDE : '#445'; rr(cx0 + 320, 962, 110, 56, 28); ctx.fill(); ctx.fillStyle = BR; ctx.beginPath(); ctx.arc(cx0 + 348 + 54 * on, 990, 22, 0, 7); ctx.fill(); ctx.restore(); }
  },
  (t, lt) => {
    numero(2, 300, SC[3], SC[4] - .2, t);

  },
  (t, lt) => {

    titulo('GRÁTIS, MAS NEM EM TODOS', 420, SC[5], SC[6] - .2, t, 58, BR, 'GRÁTIS', VERDE);

  },
  (t, lt) => fim(t, lt, 'Salva e manda', 'pra quem só manda áudio'),
