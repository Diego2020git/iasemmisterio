<!doctype html>
<html><head><meta charset="utf-8">
<style>
@font-face{font-family:"AX";src:url(fontes/ArchivoExpanded-ExtraBold.ttf);font-weight:800}
@font-face{font-family:"AR";src:url(fontes/Archivo-SemiBold.ttf);font-weight:600}
html,body{margin:0;background:#000}canvas{display:block}
</style></head><body>
<img id="logo" src="marca/logo.png" style="display:none">
<canvas id="c" width="1080" height="1920"></canvas>
<script src="audio/2026-10-22-termo-de-ia-01.tempos.js"></script>
<script src="raiox-kit.js"></script>
<script src="neon-kit.js"></script>
<script src="neon-extra.js"></script>
<script>
// 22/10/2026 · 19h · Termo de IA #1: RAG (a IA consulta seus documentos), teste no NotebookLM. Neon.
const T0 = TEMPOS.cenas;
const SC = [T0[0], T0[1], T0[2], T0[3], T0[4], T0[5], T0[6], T0[7] + .7];
const DURATION = SC[7], IMPACTO = SC[6] + .4;
const COR = [AZ, CI, AZ, CI, IN, CI, AZ];
const HITS = [wt('pdf', 0), wt('rag', 0), wt('busca', 1), wt('notebooklm', 2), wt('pdf', 3), wt('prazos', 4), wt('agora', 5)];
const CLIQUES = [];
const CK = [[0, 0, 0, 0, 0], [DURATION, 0, 0, 0, 0]];
const PEDIDO = ['Quais são os prazos citados', 'neste documento? Mostre de', 'onde tirou cada um.'];
const S = [
  // 0 · gancho: resposta com citação do PDF
  (t, lt) => {
    frase('A IA citou o seu PDF', 300, -1, SC[1] - .2, 76, { t, hot: 'seu PDF', cor: CI });
    neon3d(P.legenda, cx0, cy0 - 20, 190 * back(prog(lt, .05, .5)), .35 * Math.sin(t * .9), .3, CI, prog(lt, .05, .3));
    frase('isso é RAG', 1230, wt('nome', 0) - .3, SC[1] - .2, 100, { t, hot: 'RAG', cor: CI });
  },
  // 1 · o termo: busca nos seus documentos antes de responder
  (t, lt) => {
    frase('Termo de IA', 300, wt('termo', 1) - .1, SC[2] - .2, 84, { t, hot: 'IA', cor: CI });
    selo('RAG', cx0, 440, prog(t, wt('rag', 1) - .1, wt('rag', 1) + .2));
    const b = wt('busca', 1);
    neon3d(P.pasta, cx0 - 260, 760, 120 * back(prog(t, b - .2, b + .2)), .3 * Math.sin(t), .3, CI, prog(t, b - .2, b));
    txt('→', cx0, 760, ARC, 120, CI, { align: 'center', weight: 600, alpha: prog(t, b + .3, b + .5) });
    neon3d(P.balao, cx0 + 260, 760, 120 * back(prog(t, wt('responder', 1) - .3, wt('responder', 1))), .3 * Math.sin(t), .3, CI, prog(t, wt('responder', 1) - .3, wt('responder', 1) - .1));
    linhaTxt('a IA consulta seus documentos', 980, b, SC[2] - .2, t, 46, CI);
    linhaTxt('e só depois responde', 1060, wt('responder', 1) - .2, SC[2] - .2, t, 46);
  },
  // 2 · passo 1: NotebookLM, caderno novo
  (t, lt) => {
    numero(1, 300, SC[2], SC[3] - .2, t);
    frase('NotebookLM', 470, wt('notebooklm', 2) - .1, SC[3] - .2, 84, { t, hot: 'LM', cor: CI });
    selo('grátis', cx0, 590, prog(t, wt('gratis', 2) - .1, wt('gratis', 2) + .2));
    janela(700, 380, prog(lt, .1, .4), 'NotebookLM', (x, y, w) => {
      const c = prog(t, wt('caderno', 2) - .2, wt('caderno', 2) + .3);
      neon3d(P.legenda, x + w / 2 - 40, y + 110, 70 * back(c), 0, .2, AZ, c);
      txt('caderno novo', x + w / 2 - 40, y + 220, ARC, 40, '#1b2440', { align: 'center', weight: 600, alpha: c });
    });
    exemplo(cx0, 1160, prog(lt, .4, .7));
  },
  // 3 · passo 2: adicionar o PDF como fonte
  (t, lt) => {
    numero(2, 300, SC[3], SC[4] - .2, t);
    frase('Adicione um PDF seu', 470, wt('adicione', 3) - .1, SC[4] - .2, 76, { t, hot: 'PDF', cor: CI });
    neon3d(P.pasta, cx0, 800, 180 * back(prog(lt, .1, .5)), .35 * Math.sin(t * .8), .3, CI, prog(lt, .1, .3));
    linhaTxt('como fonte do caderno', 1000, wt('fonte', 3), SC[4] - .2, t, 44, CI);
    selo('manual', cx0 - 270, 1140, prog(t, wt('manual', 3) - .1, wt('manual', 3) + .2));
    selo('contrato', cx0, 1140, prog(t, wt('contrato', 3) - .1, wt('contrato', 3) + .2));
    selo('apostila', cx0 + 270, 1140, prog(t, wt('apostila', 3) - .1, wt('apostila', 3) + .2));
  },
  // 4 · passo 3: o pedido completo e a resposta com citação
  (t, lt) => {
    numero(3, 300, SC[4], SC[5] - .2, t);
    frase('Pergunte', 470, wt('pergunte', 4) - .1, SC[5] - .2, 84, { t, hot: 'Pergunte', cor: CI });
    janela(600, 640, prog(lt, .1, .4), 'NotebookLM', (x, y, w) => {
      PEDIDO.forEach((l, k) => txt(l, x, y + 30 + k * 60, ARC, 36, '#1b2440', { weight: 600, alpha: prog(t, SC[4] + .4 + k * .4, SC[4] + .7 + k * .4) }));
      const r = prog(t, wt('legenda', 4) - .8, wt('legenda', 4) - .4);
      if (r > 0) { ctx.save(); ctx.globalAlpha *= r; ctx.fillStyle = '#dbe6ff'; rr(x, y + 230, w - 20, 210, 18); ctx.fill();
        txt('Entrega até 30/11', x + 24, y + 280, ARC, 34, '#1b2440', { weight: 600 });
        ctx.fillStyle = AZ; rr(x + 340, y + 260, 46, 40, 10); ctx.fill(); txt('1', x + 363, y + 281, ARC, 28, '#fff', { align: 'center', weight: 600 });
        txt('Pagamento em 10 dias', x + 24, y + 360, ARC, 34, '#1b2440', { weight: 600 });
        ctx.fillStyle = AZ; rr(x + 400, y + 340, 46, 40, 10); ctx.fill(); txt('2', x + 423, y + 361, ARC, 28, '#fff', { align: 'center', weight: 600 });
        ctx.restore(); }
    });
    linhaTxt('cada número aponta o trecho do PDF', 1330, wt('legenda', 4) - .4, SC[5] - .2, t, 38, CI);
    exemplo(cx0, 1400, prog(lt, .4, .7));
    linhaTxt('pedido completo na legenda', 1480, wt('legenda', 4) - .2, SC[5] - .2, t, 36, 'rgba(244,248,255,.8)');
  },
  // 5 · antes e depois + custo
  (t, lt) => {
    const a = wt('antes', 5), g = wt('agora', 5);
    frase('Antes: chute', 560, a - .1, SC[6] - .2, 80, { t, hot: 'chute', cor: IN });
    neon3d(P.check, cx0, 820, 150 * back(prog(t, g - .1, g + .3)), .3 * Math.sin(t * .8), .3, CI, prog(t, g - .1, g + .1));
    frase('Agora: trecho do seu arquivo', 1010, g - .1, SC[6] - .2, 66, { t, hot: 'seu arquivo', cor: CI });
    selo('plano grátis, com limite de fontes', cx0, 1170, prog(t, wt('plano', 5) - .1, wt('plano', 5) + .2));
  },
  // 6 · logo + chamada
  (t, lt) => fim(t, lt, 'Segue o Termo de IA', 'quinta: token'),
];
</script></body></html>
